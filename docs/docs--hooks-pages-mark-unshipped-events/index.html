<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hook reference pages now say when an event is not shipped</title>
<meta name="description" content="Pick a hook event and see whether the OrchestKit plugin runs it, and what its reference page says.">
<style>
  :root{--pg-bg:oklch(19% .012 265);--pg-panel:oklch(23% .014 265);--pg-edge:oklch(32% .016 265);--pg-ink:oklch(94% .006 265);--pg-dim:oklch(72% .02 265);--pg-accent:oklch(83% .09 225);--pg-well:oklch(16% .01 265);--status-ok:#4ade80;--status-warn:#facc15;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
  *{box-sizing:border-box}
  body{margin:0;padding:2.5rem 1.25rem;background:var(--pg-bg);color:var(--pg-ink);font-family:var(--mono);line-height:1.6}
  main{max-width:56rem;margin-inline:auto}
  h1{font-size:1.35rem;margin:0 0 .3rem}
  .sub{color:var(--pg-dim);margin:0 0 2rem;font-size:.85rem}
  section{background:var(--pg-panel);border:1px solid var(--pg-edge);border-radius:10px;padding:1.2rem 1.4rem;margin-block:1.1rem}
  h2{font-size:.9rem;margin:0 0 .9rem;color:var(--pg-accent);text-transform:uppercase;letter-spacing:.06em}
  label{display:block;color:var(--pg-dim);font-size:.8rem;margin-top:.6rem}
  select,button{background:var(--pg-well);color:var(--pg-ink);border:1px solid var(--pg-edge);border-radius:6px;padding:.35rem .5rem;font-family:inherit}
  select{width:100%}
  button{margin-top:1rem;cursor:pointer}
  .out{margin-top:1rem;padding:.6rem .8rem;background:var(--pg-well);border:1px solid var(--pg-edge);border-radius:6px;font-size:.85rem;min-height:4rem}
  .ok{color:var(--status-ok)} .warn{color:var(--status-warn)}
  @media (prefers-reduced-motion:reduce){*{transition:none;animation:none}}
</style>
</head>
<body><main>
<h1>Hook reference pages now say when an event is not shipped</h1>
<p class="sub">Branch docs/hooks-pages-mark-unshipped-events, 2026-11-11. The pages come from the hook registry; the plugin ships a built copy that can leave an event out. Since #5214 that is PostToolBatch.</p>
<section><h2>Pick an event</h2>
<label for="pick">Event</label>
<select id="pick"></select>
<div class="out" id="out"></div>
<button id="copy" type="button">Copy prompt</button>
</section>
<script>
const CASES = [["PostToolBatch", false, "The page now opens with a note: the shipped plugins/ork/hooks/hooks.json does not register PostToolBatch, so tool-batch-observer does not run. It stays in the registry so the build can ship it again."], ["PreToolUse", true, "Shipped (one dispatcher entry). The page is unchanged and lists the registry's handlers."], ["PostToolUse", true, "Shipped (one dispatcher entry). The page is unchanged."], ["SessionStart", true, "Shipped as in the registry. The page is unchanged."]];
const pick = document.getElementById('pick');
pick.replaceChildren(...CASES.map((c, i) => new Option(c[0], String(i))));
function show() {
  const c = CASES[Number(pick.value)];
  const o = document.getElementById('out');
  o.textContent = (c[1] ? 'Runs in the plugin. ' : 'Does not run in the plugin. ') + c[2];
  o.className = 'out ' + (c[1] ? 'ok' : 'warn');
}
pick.addEventListener('change', show);
document.getElementById('copy').addEventListener('click', () => {
  const c = CASES[Number(pick.value)];
  navigator.clipboard.writeText('Check the OrchestKit hooks reference page for ' + c[0] + ': ' + c[2]);
});
show();
</script>
</main></body>
</html>

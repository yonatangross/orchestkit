<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>portless URL shape — 443 vs the 1355 fallback</title>
<style>
  :root{--bg:#0c0e12;--panel:#14171d;--panel2:#1a1e26;--line:#252b36;--ink:#e9eef7;
        --dim:#93a0b4;--acc:#7cc4ff;--ok:#5ddc9a;--warn:#ffc46b;--bad:#ff8f8f;
        --mono:ui-monospace,SFMono-Regular,Menlo,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.6 -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}
  header{padding:20px 24px 10px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 4px;font-size:19px} .sub{margin:0;color:var(--dim);font-size:13px}
  .wrap{display:grid;grid-template-columns:300px 1fr;gap:20px;padding:20px 24px 30px;
        max-width:1180px;margin:0 auto;align-items:start}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h2{margin:0 0 12px;font-size:12px;letter-spacing:.7px;text-transform:uppercase;color:var(--dim)}
  .row{display:flex;align-items:center;gap:8px;margin:9px 0}
  input[type=checkbox]{accent-color:var(--acc);width:15px;height:15px}
  label{font-size:13px}
  .presets{display:flex;flex-wrap:wrap;gap:6px}
  button{background:#212a36;color:var(--ink);border:1px solid #32404f;border-radius:7px;
         padding:6px 11px;font:600 12px inherit;cursor:pointer}
  button:hover{background:#2a3644}
  .url{font-family:var(--mono);font-size:17px;padding:14px;border-radius:10px;
       background:#0e1116;border:1px solid var(--line);word-break:break-all}
  .url.good{border-color:#1f4a37;color:var(--ok)}
  .url.meh{border-color:#6a4a22;color:var(--warn)}
  .url.bad{border-color:#5a2b2b;color:var(--bad)}
  .steps{margin-top:14px;font-family:var(--mono);font-size:12px}
  .step{padding:7px 10px;border-radius:7px;background:var(--panel2);
        border:1px solid var(--line);margin:5px 0}
  .step.fail{border-color:#5a2b2b;color:var(--bad)}
  .step.ok{border-color:#1f4a37;color:var(--ok)}
  .note{margin-top:14px;font-size:12.5px;color:var(--dim);border-left:2px solid var(--line);padding-left:10px}
  .note b{color:var(--ink)}
  .prompt{margin:0 24px 40px;max-width:1180px;background:var(--panel);
          border:1px solid var(--line);border-radius:12px;padding:16px}
  .prompt h2{margin:0 0 10px;font-size:12px;letter-spacing:.7px;text-transform:uppercase;color:var(--dim)}
  #promptText{white-space:pre-wrap;font-family:var(--mono);font-size:12.5px;
              background:#0e1116;border:1px solid var(--line);border-radius:8px;padding:12px}
</style>
</head>
<body>
<header>
  <h1>portless URL shape</h1>
  <p class="sub">Why a port appeared in a <code>.localhost</code> URL, and which state produces which shape.</p>
</header>

<div class="wrap">
  <div class="card">
    <h2>Presets</h2>
    <div class="presets">
      <button data-p="healthy">Healthy (service live)</button>
      <button data-p="deadService">Service installed, dead</button>
      <button data-p="noService">No service, TTY</button>
      <button data-p="agent">No service, agent shell</button>
    </div>

    <h2 style="margin-top:20px">Machine state</h2>
    <div class="row"><input type="checkbox" id="svcInstalled"><label for="svcInstalled">startup service installed</label></div>
    <div class="row"><input type="checkbox" id="svcAlive"><label for="svcAlive">proxy on 443 responding</label></div>
    <div class="row"><input type="checkbox" id="tty"><label for="tty">shell has a TTY (can sudo)</label></div>
    <div class="row"><input type="checkbox" id="stray"><label for="stray">a stray :1355 proxy is running</label></div>

    <div class="note" id="statusNote"></div>
  </div>

  <div>
    <div class="card">
      <h2>Resulting URL</h2>
      <div class="url" id="url">—</div>
      <div class="steps" id="steps"></div>
    </div>
    <div class="card" style="margin-top:16px">
      <h2>What to run</h2>
      <div class="steps" id="fix"></div>
    </div>
  </div>
</div>

<div class="prompt">
  <h2>Prompt <button id="copy" style="float:right">Copy</button></h2>
  <div id="promptText"></div>
</div>

<script>
const DEF = {svcInstalled:true, svcAlive:true, tty:false, stray:false};
const state = {...DEF};
const $ = id => document.getElementById(id);

function render(){
  const steps = [];
  let url, cls;

  if (state.stray) {
    steps.push(['fail','portless proxy start → "Proxy is already running on port 1355"']);
  }

  if (state.svcInstalled && state.svcAlive) {
    steps.push(['ok','443 already bound by the root LaunchDaemon — nothing to start']);
    url = 'https://portfolio.localhost/'; cls = 'good';
  } else if (state.stray) {
    steps.push(['fail','the stray proxy squats the port; the service cannot take over']);
    url = 'https://portfolio.localhost:1355/'; cls = 'bad';
  } else if (state.tty) {
    steps.push(['ok','auto-start elevates via sudo (prompts once) and binds 443']);
    url = 'https://portfolio.localhost/'; cls = 'good';
  } else {
    steps.push(['fail','auto-start tries sudo, has no TTY → "Proxy is not running and no TTY is available for sudo"']);
    steps.push(['fail','falls back to the unprivileged port']);
    url = 'https://portfolio.localhost:1355/'; cls = 'meh';
  }

  $('url').className = 'url ' + cls;
  $('url').textContent = url;
  $('steps').innerHTML = steps.map(([k,t]) => `<div class="step ${k}">${t}</div>`).join('');

  // the trap this playground exists for
  $('statusNote').innerHTML = (state.svcInstalled && !state.svcAlive)
    ? '<b>The trap.</b> <code>portless service status</code> prints <code>Installed: yes</code> AND <code>Proxy on 443: not responding</code> at the same time. Reading only the first line says "installed, fine"; the second is the one that matters.'
    : 'Read BOTH lines of <code>portless service status</code>: <code>Installed</code> and <code>Proxy on 443</code> are independent.';

  const fix = [];
  if (state.stray) fix.push(['','portless proxy stop -p 1355   # clear the squatter first']);
  if (state.svcInstalled && !state.svcAlive) {
    fix.push(['','sudo launchctl kickstart -k system/sh.portless.proxy']);
    fix.push(['','# or full reset: portless service uninstall && portless clean && portless service install']);
  } else if (!state.svcInstalled) {
    fix.push(['','portless service install   # once, needs sudo; survives reboot']);
  }
  if (!fix.length) fix.push(['ok','nothing — this is the healthy state']);
  $('fix').innerHTML = fix.map(([k,t]) => `<div class="step ${k}">${t}</div>`).join('');

  const p = [];
  if (state.svcInstalled && !state.svcAlive)
    p.push("portless reports `Installed: yes` with `Proxy on 443: not responding`. The startup service exists but its daemon is dead — revive it with sudo rather than starting an unprivileged proxy.");
  if (!state.tty && !(state.svcInstalled && state.svcAlive))
    p.push("This is an agent/CI shell with no TTY, so portless auto-start cannot sudo and falls back to :1355. Never accept that fallback as the fix — it puts a port in every URL and squats the port the real service needs.");
  if (state.stray)
    p.push("Stop the stray proxy (`portless proxy stop -p 1355`) before starting or reviving the 443 service.");
  if (state.svcInstalled && state.svcAlive && !state.stray)
    p.push("Healthy: URLs are `https://<name>.localhost/` with no port. Keep it that way.");
  $('promptText').textContent = p.join('\n\n');
}

['svcInstalled','svcAlive','tty','stray'].forEach(k =>
  $(k).addEventListener('change', e => { state[k] = e.target.checked; render(); }));

const P = {
  healthy:     {svcInstalled:true,  svcAlive:true,  tty:false, stray:false},
  deadService: {svcInstalled:true,  svcAlive:false, tty:false, stray:false},
  noService:   {svcInstalled:false, svcAlive:false, tty:true,  stray:false},
  agent:       {svcInstalled:false, svcAlive:false, tty:false, stray:true},
};
document.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => {
  Object.assign(state, P[b.dataset.p]);
  ['svcInstalled','svcAlive','tty','stray'].forEach(k => { $(k).checked = state[k]; });
  render();
}));
$('copy').addEventListener('click', () => {
  navigator.clipboard.writeText($('promptText').textContent);
  const o = $('copy').textContent; $('copy').textContent='Copied!';
  setTimeout(()=>$('copy').textContent=o,1200);
});
render();
</script>
</body>
</html>

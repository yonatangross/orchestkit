<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homepage-only social meta</title>
<style>
  :root{--bg:#0f1117;--panel:#161922;--edge:#272b38;--ink:#e8eaf2;--dim:#9aa3b8;--ok:#4ade80;--bad:#f87171;--accent:#7dd3fc;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  *{box-sizing:border-box}
  body{margin:0;padding:2rem 1.25rem;background:var(--bg);color:var(--ink);font-family:var(--mono);line-height:1.55}
  main{max-width:52rem;margin-inline:auto}
  h1{font-size:1.2rem;margin:0 0 .35rem}
  .sub{color:var(--dim);margin:0 0 1.4rem;font-size:.85rem}
  section{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:1.1rem 1.25rem;margin-block:1rem}
  h2{font-size:.8rem;margin:0 0 .8rem;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
  .seg{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.9rem}
  button{background:#1d2330;color:var(--ink);border:1px solid #2d3546;border-radius:7px;padding:.45rem .8rem;cursor:pointer;font:inherit;font-size:.82rem}
  button[aria-pressed="true"]{border-color:#6d8cff;background:#26304a}
  button:focus-visible{outline:2px solid #6d8cff;outline-offset:2px}
  table{width:100%;border-collapse:collapse;font-size:.8rem}
  th,td{text-align:start;padding:.4rem .5rem;border-bottom:1px solid var(--edge);vertical-align:top}
  th{color:var(--dim);width:8rem}
  .ok{color:var(--ok)} .bad{color:var(--bad)}
  code{white-space:pre-wrap}
</style>
</head>
<body>
<main>
  <h1>Homepage-only social meta</h1>
  <p class="sub">#4343 follow-up &middot; fix/site-homepage-social-meta &middot; 2026-09-22</p>

  <section>
    <h2>State</h2>
    <div class="seg" role="group" aria-label="Root meta placement">
      <button type="button" id="poison" aria-pressed="false">Before (root openGraph.title)</button>
      <button type="button" id="scoped" aria-pressed="true">After (homepage only)</button>
    </div>
    <div class="seg" role="group" aria-label="Page">
      <button type="button" id="home" aria-pressed="true">/</button>
      <button type="button" id="about" aria-pressed="false">/about</button>
    </div>
    <table>
      <tbody>
        <tr><th>&lt;title&gt;</th><td><code id="v-title"></code></td></tr>
        <tr><th>og:title</th><td><code id="v-og"></code></td></tr>
        <tr><th>twitter:title</th><td><code id="v-tw"></code></td></tr>
        <tr><th>parity?</th><td id="v-ok"></td></tr>
      </tbody>
    </table>
  </section>
</main>
<script>
const HOME = "OrchestKit: for Claude Code and 7 more agents";
const ABOUT = "About | OrchestKit";
let mode = "scoped";
let page = "home";

function render() {
  const isHome = page === "home";
  const title = isHome ? HOME : ABOUT;
  let og;
  if (mode === "poison") {
    og = HOME; // root openGraph.title wins for every child
  } else {
    og = isHome ? HOME : ABOUT; // child title drives social when root omits title
  }
  document.getElementById("v-title").textContent = title;
  document.getElementById("v-og").textContent = og;
  document.getElementById("v-tw").textContent = og;
  const ok = title === og;
  const el = document.getElementById("v-ok");
  el.textContent = ok ? "title and og:title agree" : "LEAK: child page shows homepage og:title";
  el.className = ok ? "ok" : "bad";
  document.getElementById("poison").setAttribute("aria-pressed", mode === "poison" ? "true" : "false");
  document.getElementById("scoped").setAttribute("aria-pressed", mode === "scoped" ? "true" : "false");
  document.getElementById("home").setAttribute("aria-pressed", page === "home" ? "true" : "false");
  document.getElementById("about").setAttribute("aria-pressed", page === "about" ? "true" : "false");
}
document.getElementById("poison").onclick = () => { mode = "poison"; render(); };
document.getElementById("scoped").onclick = () => { mode = "scoped"; render(); };
document.getElementById("home").onclick = () => { page = "home"; render(); };
document.getElementById("about").onclick = () => { page = "about"; render(); };
render();
</script>
</body>
</html>

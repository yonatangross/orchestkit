<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tool dispatcher follow-up: three fail-open edges closed</title>
<meta name="description" content="Follow-up to #4962. Pick an edge case of the flag-on tool dispatchers and compare what happened before and after: a missing dispatcher bundle, a proof log with no runs, and a git query that timed out.">
<style>
  :root{--bg:#0f1117;--panel:#161922;--edge:#272b38;--ink:#e8eaf2;--dim:#9aa3b8;--ok:#4ade80;--bad:#f87171;--accent:#7dd3fc;--mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;}
  *{box-sizing:border-box}
  body{margin:0;padding:2.5rem 1.25rem;background:var(--bg);color:var(--ink);font-family:var(--mono);line-height:1.6}
  main{max-width:64rem;margin-inline:auto}
  h1{font-size:1.35rem;margin:0 0 .3rem}
  .sub{color:var(--dim);margin:0 0 2rem;font-size:.85rem}
  section{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:1.2rem 1.4rem;margin-block:1.1rem}
  h2{font-size:.9rem;margin:0 0 .9rem;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
  code{background:#0b0d13;border:1px solid var(--edge);border-radius:5px;padding:0 4px}
  select{background:#0b0d13;color:var(--ink);border:1px solid var(--edge);border-radius:6px;padding:.25rem .5rem;font-family:inherit;font-size:.8rem}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:.9rem}
  .out{padding:.6rem .8rem;background:#0b0d13;border:1px solid var(--edge);border-radius:6px;font-size:.78rem;white-space:pre-wrap;min-height:5rem}
  .bad{color:var(--bad)} .ok{color:var(--ok)} .dim{color:var(--dim)}
</style>
</head>
<body><main>
<h1>Tool dispatcher follow-up: three fail-open edges closed</h1>
<p class="sub">Branch fix/ork-dispatcher-review-threads, 2026-11-01, follow-up to #4962 (the three CodeRabbit threads left open at its merge). The flag is still default off; the shipped hooks.json is unchanged.</p>

<section><h2>Pick an edge case</h2>
<select id="edge" aria-label="edge case">
  <option value="bundle">the dispatcher bundle is missing or stale</option>
  <option value="proof">the dispatch-proof log has no dispatcher run</option>
  <option value="git">check-plugins-drift: a git query times out</option>
</select>
<div class="grid">
  <div><div class="dim">before</div><div class="out bad" id="before"></div></div>
  <div><div class="dim">after</div><div class="out ok" id="after"></div></div>
</div>
</section>

<script>
const CASES = {
  bundle: [
    'run-hook.mjs takes its silent-success path: exit 0, no output.\nIn the flag variant the dispatchers are the only tool-event entries, so every guard is skipped and the call proceeds.',
    'Both dispatchers are in FAIL_CLOSED_WHEN_MISSING: a missing bundle, a missing handler or a stale cached bundle exits 2 and the call is blocked, with a rebuild hint.'
  ],
  proof: [
    'check-dispatch-proof.mjs without --require reports OK on a log with zero proof tokens, though it checked no dispatcher.',
    'No dispatcher run is a problem: "no dispatcher run with proof tokens in the log (flag off, or ORK_DISPATCH_PROOF unset?)".'
  ],
  git: [
    'git log or git status runs past its 2 s timeout, the helper returns false ("not rebuilt"), and the hook blocks the next src/ edit on a guess.',
    'A timed-out query (ETIMEDOUT or SIGKILL) returns null; rebuildEvidence maps it to unknown, which does not block on its own. Other git failures keep their meaning.'
  ]
};
function render() {
  const [b, a] = CASES[document.getElementById('edge').value];
  document.getElementById('before').textContent = b;
  document.getElementById('after').textContent = a;
}
document.getElementById('edge').addEventListener('change', render);
render();
</script>
</main></body>
</html>

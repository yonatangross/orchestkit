<body><main>
<h1>Count docs page views before consent, with nothing stored</h1>
<p class="sub">Branch feat/posthog-cookieless-pageviews, 2026-11-09. Since #5098 PostHog saw about zero visitors, because nothing loaded before consent.</p>
<section><h2>Pick a case</h2>
<label for="pick">Case</label>
<select id="pick"></select>
<div class="grid">
  <div><h3>Before</h3><div class="out bad" id="before"></div></div>
  <div><h3>Now</h3><div class="out ok" id="after"></div></div>
</div>
<button id="copy" type="button">Copy prompt</button>
</section>
<script>
const CASES = [["No choice yet", "Nothing loads. No page views are counted.", "Cookieless: memory persistence, no person profile, no replay, nothing in cookies or storage. Page views are counted."], ["No choice, on a /docs/reference page", "Nothing loads, no replay.", "Counted, still no replay: the gate starts only with consent."], ["Allow analytics", "Loads the consented client.", "Upgrades the same client: reset to a fresh id, persistent storage, opt in, replay gate as before."], ["Decline", "Nothing loads.", "The cookieless count stops, nothing is identified, and later visits load nothing."], ["Returning visitor who allowed", "Consented client on load.", "Unchanged."]];
const pick = document.getElementById('pick');
pick.replaceChildren(...CASES.map((c, i) => new Option(c[0], String(i))));
function show() {
  const c = CASES[Number(pick.value)];
  document.getElementById('before').textContent = c[1];
  document.getElementById('after').textContent = c[2];
}
pick.addEventListener('change', show);
document.getElementById('copy').addEventListener('click', () => {
  const c = CASES[Number(pick.value)];
  navigator.clipboard.writeText('Check this case in OrchestKit: ' + c[0] + '. Before: ' + c[1] + ' Now: ' + c[2]);
});
show();
</script>

</script><!-- ork-lab-chrome:end --></body>

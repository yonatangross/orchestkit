<!-- ork-lab-head:start --><meta property="og:type" content="website"><meta property="og:site_name" content="OrchestKit"><meta property="og:title" content="doctor: agent-memory directory checks"><meta property="og:description" content="Issue 3131: orphan dirs, staleness only when the agent ran, a 150-line warning before the 200-line injection cap, and a secret backstop."><meta property="og:url" content="https://orchestkit.yonyon.ai/lab/feat--doctor-agent-memory.html"><meta property="og:image" content="https://orchestkit.yonyon.ai/opengraph-image"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="doctor: agent-memory directory checks"><meta name="twitter:description" content="Issue 3131: orphan dirs, staleness only when the agent ran, a 150-line warning before the 200-line injection cap, and a secret backstop."><meta name="twitter:image" content="https://orchestkit.yonyon.ai/opengraph-image"><!-- ork-lab-head:end --></head>
<body>
<main>
  <h1>Agent-memory health</h1>
  <p>Issue 3131. Four checks on <code>.claude/agent-memory/&lt;agent&gt;/MEMORY.md</code>. Pick a fixture.</p>
  <div>
    <button type="button" data-k="clean" aria-pressed="true">clean</button>
    <button type="button" data-k="orphan" aria-pressed="false">orphan</button>
    <button type="button" data-k="stale" aria-pressed="false">stale</button>
    <button type="button" data-k="size" aria-pressed="false">size</button>
    <button type="button" data-k="secret" aria-pressed="false">secret</button>
  </div>
  <pre id="out"></pre>
</main>
<script>
var lines = {
  clean: "OK agent-memory: no orphan, stale, size, or secret findings",
  orphan: "ORPHAN ghost: no matching agent",
  stale: "STALE scribe/MEMORY.md: untouched 40d and the agent ran after that write",
  size: "SIZE scribe/MEMORY.md: 160 lines (warn at 150; injection drops past about 200)",
  secret: "SECRET scribe/MEMORY.md: token or PII pattern"
};
var out = document.getElementById("out");
function show(key) {
  document.querySelectorAll("button").forEach(function (b) {
    b.setAttribute("aria-pressed", String(b.getAttribute("data-k") === key));
  });
  out.textContent = lines[key];
}
document.querySelectorAll("button").forEach(function (b) {
  b.addEventListener("click", function () { show(b.getAttribute("data-k")); });
});
show("clean");
</script>

<script>
const HOME = "OrchestKit: for Claude Code and 7 more agents";
const ABOUT = "About | OrchestKit";
let mode = "scoped";

  const title = isHome ? HOME : ABOUT;
  let og;
  if (mode === "poison") {

}
document.getElementById("poison").onclick = () => { mode = "poison"; render(); };
document.getElementById("scoped").onclick = () => { mode = "scoped"; render(); };

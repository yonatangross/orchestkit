<meta charset="utf-8">

<title>21st.dev wiring &amp; metering — PR #3509</title>
<style>
  :root{
    --bg:#0c0e12; --panel:#14171d; --panel2:#1a1e26; --line:#252b36;
    --ink:#e9eef7; --dim:#93a0b4; --acc:#7cc4ff; --ok:#5ddc9a;
    --warn:#ffc46b; --bad:#ff8f8f; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,sans-serif}
  header{padding:20px 24px 8px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 4px;font-size:19px;letter-spacing:-.2px}
  .sub{color:var(--dim);font-size:13px;margin:0}
  .wrap{display:grid;grid-template-columns:300px 1fr;gap:20px;padding:20px 24px 40px;
        max-width:1300px;margin:0 auto;align-items:start}
  @media(max-width:920px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h2{margin:0 0 12px;font-size:12px;letter-spacing:.7px;text-transform:uppercase;color:var(--dim)}
  label{display:block;margin:12px 0 5px;font-size:12.5px;color:var(--dim)}
  input[type=range]{width:100%;accent-color:var(--acc)}
  .row{display:flex;align-items:center;gap:8px;margin:7px 0}
  .row input[type=checkbox]{accent-color:var(--acc);width:15px;height:15px}
  .row code{font-family:var(--mono);font-size:12px}
  .presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  button{background:#212a36;color:var(--ink);border:1px solid #32404f;border-radius:7px;
         padding:6px 11px;font:600 12px inherit;cursor:pointer}
  button:hover{background:#2a3644}
  button.on{background:#1e4d7a;border-color:#2c6ba5}
  .val{float:right;font-family:var(--mono);color:var(--ink);font-size:12px}
  /* preview */
  .surfaces{display:grid;gap:10px}
  .surface{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel2)}
  .surface .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .name{font-family:var(--mono);font-size:13px;font-weight:600}
  .pill{font-size:10.5px;padding:2px 7px;border-radius:99px;letter-spacing:.3px}
  .pill.ok{background:#16352a;color:var(--ok)} .pill.bad{background:#3a1f1f;color:var(--bad)}
  .pill.dim{background:#232a35;color:var(--dim)}
  .claims{color:var(--dim);font-size:12px;margin-top:6px}
  .path{margin-top:8px;font-family:var(--mono);font-size:11.5px;padding:7px 9px;border-radius:7px}
  .path.api{background:#12281f;color:var(--ok);border:1px solid #1f4a37}
  .path.scrape{background:#33241a;color:var(--warn);border:1px solid #543a26}
  .meter{margin-top:14px}
  .bar{height:9px;background:#20262f;border-radius:5px;overflow:hidden;margin:5px 0 2px}
  .bar > i{display:block;height:100%;border-radius:5px}
  .stat{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
  .stat b{color:var(--ink);font-family:var(--mono)}
  .flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;
        font-family:var(--mono);font-size:12px}
  .step{padding:6px 10px;border-radius:7px;background:var(--panel2);border:1px solid var(--line)}
  .step.free{border-color:#1f4a37;color:var(--ok)}
  .step.paid{border-color:#6a4a22;color:var(--warn)}
  .arrow{color:var(--dim)}
  .note{margin-top:12px;font-size:12.5px;color:var(--dim);border-left:2px solid var(--line);padding-left:10px}
  .note b{color:var(--ink)}
  /* prompt */
  .prompt{margin:20px 24px 40px;max-width:1300px;background:var(--panel);
          border:1px solid var(--line);border-radius:12px;padding:16px}
  .prompt h2{margin:0 0 10px;font-size:12px;letter-spacing:.7px;text-transform:uppercase;color:var(--dim)}
  #promptText{white-space:pre-wrap;font-family:var(--mono);font-size:12.5px;
              background:#0e1116;border:1px solid var(--line);border-radius:8px;padding:12px;color:var(--ink)}
</style>
</head>
<body>
<header>
  <h1>21st.dev — wiring gap &amp; metering economics</h1>
  <p class="sub">orchestkit PR #3509 · four surfaces named the MCP server and none could call it</p>
</header>

<div class="wrap">
  <div class="card">
    <h2>Presets</h2>
    <div class="presets">
      <button data-preset="before">Before this PR</button>
      <button data-preset="after">After this PR</button>
      <button data-preset="careless">Careless day</button>
      <button data-preset="disciplined">Disciplined day</button>
    </div>

    <h2 style="margin-top:20px">Wiring</h2>
    <div class="row"><input type="checkbox" id="granted"><label for="granted" style="margin:0">Grant <code>mcp__21st-dev-magic__*</code></label></div>
    <div class="row"><input type="checkbox" id="writes"><label for="writes" style="margin:0">Also grant write tools <span class="pill bad">risky</span></label></div>

    <h2 style="margin-top:20px">A day of work</h2>
    <label>Components explored <span class="val" id="vExp">12</span></label>
    <input type="range" id="explored" min="1" max="30" value="12">
    <label>Retrievals per candidate <span class="val" id="vRet">1</span></label>
    <input type="range" id="retr" min="1" max="4" value="1">
    <div class="row"><input type="checkbox" id="picker" checked><label for="picker" style="margin:0">Use <code>search_picker</code> (user picks)</label></div>
    <label>Tier</label>
    <div class="presets">
      <button data-tier="free" class="on">free</button>
      <button data-tier="paid">paid</button>
    </div>
  </div>

  <div>
    <div class="card">
      <h2>Surface reachability</h2>
      <div class="surfaces" id="surfaces"></div>
    </div>

    <div class="card" style="margin-top:16px">
      <h2>Metering</h2>
      <div class="flow" id="flow"></div>
      <div class="meter">
        <div class="stat"><span>Metered <code>get_component</code> calls</span><b id="used">—</b></div>
        <div class="bar"><i id="barUsed"></i></div>
        <div class="stat"><span>Free calls (search / picker / metadata)</span><b id="free">—</b></div>
        <div class="bar"><i id="barFree" style="background:#2a6b4d"></i></div>
      </div>
      <div class="note" id="verdict"></div>
    </div>
  </div>
</div>

<div class="prompt">
  <h2>Prompt <button id="copy" style="float:right">Copy</button></h2>
  <div id="promptText"></div>
</div>

<script>
const SURFACES = [
  {name:'skills/component-search', claim:'"If 21st-dev-magic MCP is available: use MCP tools" — pseudocode naming no tool', tools:8},
  {name:'agents/component-curator', claim:'declares required_mcp_servers: [21st-dev-magic]', tools:4},
  {name:'agents/frontend-ui-developer', claim:'declares mcpServers: [...21st-dev-magic...] + "prefer registry over generating"', tools:4},
  {name:'skills/design-to-code', claim:'documents a "Priority 2 — Search 21st.dev" branch', tools:5},
];
const DEFAULTS = {granted:false, writes:false, explored:12, retr:1, picker:true, tier:'free'};
const state = {...DEFAULTS};

const $ = id => document.getElementById(id);

function renderSurfaces(){
  $('surfaces').innerHTML = SURFACES.map(s => {
    const on = state.granted;
    return `<div class="surface">
      <div class="top">
        <span class="name">${s.name}</span>
        ${on ? `<span class="pill ok">${s.tools} mcp tools</span>`
             : `<span class="pill bad">0 mcp tools</span>`}
        ${on && state.writes ? `<span class="pill bad">writes granted</span>` : ``}
      </div>
      <div class="claims">${s.claim}</div>
      <div class="path ${on?'api':'scrape'}">${on
        ? 'search_picker → get_component   (ids, install commands, previews)'
        : 'WebSearch("site:21st.dev …") → WebFetch   (no ids, no install commands)'}</div>
    </div>`;
  }).join('');
}

function renderFlow(){
  const steps = state.picker
    ? [['search_picker','free'],['user picks','free'],['get_component','paid']]
    : [['search','free'],['get_component','paid']];
  $('flow').innerHTML = steps.map((s,i) =>
    `${i?'<span class="arrow">→</span>':''}<span class="step ${s[1]}">${s[0]}</span>`
  ).join('');
}

function renderMeter(){
  const cap = state.tier === 'free' ? 2 : Infinity;
  // Disciplined: browse everything free, retrieve only the chosen one.
  // Undisciplined: retrieve for each candidate you compare.
  const metered = state.picker ? state.retr : state.explored * state.retr;
  const free = state.explored + (state.picker ? 1 : 0);
  $('used').textContent = metered + (cap===Infinity ? '' : ` / ${cap}`);
  $('free').textContent = free + ' (unmetered)';
  const pct = cap===Infinity ? Math.min(100, metered*4) : Math.min(100, metered/cap*100);
  const over = cap!==Infinity && metered > cap;
  $('barUsed').style.width = pct+'%';
  $('barUsed').style.background = over ? '#8f3030' : '#2c6ba5';
  $('barFree').style.width = Math.min(100, free*3.3)+'%';

  let v;
  if(!state.granted){
    v = `<b>Nothing is callable.</b> Without the tool grant every surface takes its WebSearch/WebFetch fallback — scraping a site for data the API returns free, minus the ids and install commands.`;
  } else if(over){
    v = `<b>Budget blown.</b> ${metered} retrievals against a cap of ${cap}/day. Retrieving per candidate spends the whole day to answer a question <code>search</code> answers for nothing.`;
  } else if(state.picker){
    v = `<b>Within budget.</b> Browsing is free, so the entire cost is the single chosen component — the same discipline as approving a frame before rendering video.`;
  } else {
    v = `<b>Workable, but blind.</b> Without <code>search_picker</code> the model guesses which component you meant, and each guess costs a metered retrieval.`;
  }
  if(state.granted && state.writes){
    v += ` <span style="color:var(--bad)">Write tools granted: a search surface that can <code>delete_component</code> from a shared registry is one bad prompt from damage.</span>`;
  }
  $('verdict').innerHTML = v;
}

function updatePrompt(){
  const p = [];
  if(!state.granted){
    p.push("Four orchestkit surfaces name the 21st-dev-magic MCP server but grant none of its tools, so they silently fall back to scraping 21st.dev with WebSearch/WebFetch.");
    p.push("Add mcp__21st-dev-magic__* to allowed-tools/tools on component-search, component-curator, frontend-ui-developer and design-to-code.");
  } else {
    p.push("Grant the 21st-dev-magic MCP tools to the four surfaces that already declare the server (component-search, component-curator, frontend-ui-developer, design-to-code).");
    p.push(state.writes
      ? "Include the catalog-mutating tools too."
      : "Grant a read-only surface only: search, search_picker, get_component, get_theme, search_logo, get_usage — withhold submit/edit/delete/bookmark writes so a search surface can never mutate a shared registry.");
  }
  if(state.tier === 'free'){
    p.push(`Respect the free tier: get_component is capped at 2/day while search and all metadata tools are unmetered.`);
  }
  if(state.picker){
    p.push("Prescribe search_picker → user picks → exactly one get_component, and forbid speculative or comparison retrievals.");
  } else {
    p.push("Note that skipping search_picker makes the model guess the intended component, and each guess costs a metered retrieval.");
  }
  const metered = state.picker ? state.retr : state.explored * state.retr;
  if(state.tier==='free' && metered > 2){
    p.push(`As configured this pattern would spend ${metered} retrievals against a 2/day cap.`);
  }
  $('promptText').textContent = p.join('\n\n');
}

function updateAll(){ renderSurfaces(); renderFlow(); renderMeter(); updatePrompt(); }

// controls
$('granted').addEventListener('change', e => { state.granted = e.target.checked; updateAll(); });
$('writes').addEventListener('change', e => { state.writes = e.target.checked; updateAll(); });
$('picker').addEventListener('change', e => { state.picker = e.target.checked; updateAll(); });
$('explored').addEventListener('input', e => { state.explored = +e.target.value; $('vExp').textContent = e.target.value; updateAll(); });
$('retr').addEventListener('input', e => { state.retr = +e.target.value; $('vRet').textContent = e.target.value; updateAll(); });
document.querySelectorAll('[data-tier]').forEach(b => b.addEventListener('click', () => {
  state.tier = b.dataset.tier;
  document.querySelectorAll('[data-tier]').forEach(x => x.classList.toggle('on', x === b));
  updateAll();
}));

const PRESETS = {
  before:      {granted:false, writes:false, explored:12, retr:1, picker:false, tier:'free'},
  after:       {granted:true,  writes:false, explored:12, retr:1, picker:true,  tier:'free'},
  careless:    {granted:true,  writes:false, explored:8,  retr:2, picker:false, tier:'free'},
  disciplined: {granted:true,  writes:false, explored:25, retr:1, picker:true,  tier:'free'},
};
document.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => {
  Object.assign(state, PRESETS[b.dataset.preset]);
  $('granted').checked = state.granted; $('writes').checked = state.writes;
  $('picker').checked = state.picker;
  $('explored').value = state.explored; $('vExp').textContent = state.explored;
  $('retr').value = state.retr; $('vRet').textContent = state.retr;
  document.querySelectorAll('[data-tier]').forEach(x => x.classList.toggle('on', x.dataset.tier === state.tier));
  updateAll();
}));

$('copy').addEventListener('click', () => {
  navigator.clipboard.writeText($('promptText').textContent);
  const o = $('copy').textContent; $('copy').textContent = 'Copied!';
  setTimeout(() => $('copy').textContent = o, 1200);
});

updateAll();
</script>
</body>
</html>

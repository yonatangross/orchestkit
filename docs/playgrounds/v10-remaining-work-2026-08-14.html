      "containment": "Gate every EPIC C child PR on 're-homed + observed firing' evidence before the deletion commit lands. #3308's comment thread already caught two premature verdicts (Mechanism 13 refuted, Mechanism 06 retracted)." },
    { "id": "R5", "title": "worktree-merge-verifier trains operators to ignore real warnings (#3365)", "severity": "warning",
      "likelihood": 5, "impact": 3,
      "premortem": "It fires on every squash merge in a squash-merge repo and calls landed commits 'unrecoverable' — false once squashed. The operator already had to hand-verify fix/3455-push-refspec today after the tool cried wolf, which is exactly the day a genuine warning would get the same treatment.",
      "containment": "Fix the ancestry check to compare against the squashed commit's tree instead of raw branch ancestry before the next release." }
  ],
  "decisions": [
    { "id": "D1", "title": "#3311 — label CRITICAL bug, evidence says mostly SHIPPED",
      "context": "Labeled priority:CRITICAL, bug, security. Reads as urgent, unstarted code work.",
      "decision": "Re-scope as a 1-step operator action, not a coding task: `enabled` and 26 deny rules (5 Read()) already exist at main HEAD; the credential-read half already shipped as pretool/read/credential-read-guard, live-probed with confirmed denies.",
      "alternatives": "Keep re-verifying the same body claims every session · silently downgrade without recording why",
      "tradeoff": "Downgrading the label loses the visual urgency signal, but leaving it CRITICAL burns re-verification cycles on work that's already done." },
    { "id": "D2", "title": "#3322 — label priority:high, evidence says BLOCKED not queued",
      "context": "Body says 'blocked by the sandbox issue landing first,' which reads like a queue position.",
      "decision": "Treat it as blocked behind an unsolved failure: #3424's Phase 1 rollout already broke gh and rolled back on 2026-08-12, so #3322 cannot proceed until that root cause is fixed — not just 'when its turn comes.'",
      "alternatives": "Schedule it next in line regardless · silently deprioritize without recording why",
      "tradeoff": "Naming the blocker explicitly costs a status downgrade optically, but stops the next session from picking it up and hitting the same gh TLS wall." },
    { "id": "D3", "title": "EPIC C (#3308) — label implies 9 fixed mechanisms, evidence says the count is shrinking",
      "context": "5 comments, and every probe run has changed the verdict so far: Mechanism 13 REFUTED (not a parallel mechanism at all), Mechanism 09's RETIRE verdict was WRONG but the probe found a real defect inside it, Mechanism 06 was CONFIRMED then RETRACTED — the empirical probe at 2.1.226 shows commands/ wrappers are load-bearing (35 commands with them, 0 without).",
      "decision": "Re-scope the epic's remaining count down as each probe lands, instead of holding the original ~9 as a fixed burndown target.",
      "alternatives": "Keep the original count as the epic's success metric · close and re-file with the corrected count",
      "tradeoff": "A shrinking count reads as less progress on a burndown chart, but a static count that ignores three reversals is the less honest number." },
    { "id": "D4", "title": "#3365 — no priority label at all, evidence says it fires on EVERY merge",
      "context": "Carries no priority label, so default triage sort pushes it down the list.",
      "decision": "Treat as high-urgency despite the missing label. It fires on every squash merge in a squash-merge repo, and its own 'unrecoverable' claim is false in that case — actively training operators to ignore a channel that will eventually carry a real warning.",
      "alternatives": "Leave it at default priority since no label overrides it · silence the check instead of fixing the ancestry logic",
      "tradeoff": "Fixing the ancestry check costs a real diff; silencing it is faster but removes the only channel a squash-merge repo has for this warning at all." }
  ],
  "byCategory": [
    { "name": "Sandbox chain", "count": 4 },
    { "name": "Epics", "count": 4 },
    { "name": "Entangled bugs/chores", "count": 5 }
  ],
  "prompt": "Execute the v10.0.0 remaining-work plan in this order: (1) ship #3353's tombstone decision and #3308/#3326's active re-homing work in parallel — both are independent of the sandbox chain; (2) root-cause #3424's gh TLS + live-session + self-lockout failures before touching #3311 or #3322 again; (3) only after #3424 is stable, re-activate #3311 and then retire the egress guard in #3322, closing EPIC D; (4) fix #3365's squash-merge ancestry check and #3448's auto-background handoff loss as standalone reliability work, and pin the Dockerfile (#3477) alongside a gate decision for #3461's mcpServers: key."
}
</script>

<script>
(() => {
  'use strict';
  const S = JSON.parse(document.getElementById('plan-state').textContent);
  const live = document.getElementById('pv-live');
  const say = (m) => { live.textContent = m; };

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = String(text);
    return n;
  };
  const svgEl = (tag, attrs) => {
    const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const k in attrs) n.setAttribute(k, String(attrs[k]));
    return n;
  };

  // ---------------------------------------------------------------- tier 1
  document.getElementById('pv-title').textContent = S.title;
  document.getElementById('pv-issue').textContent = S.issue || '';
  document.title = S.title + ' — plan';

  const t = S.totals || {};
  const facts = document.getElementById('pv-facts');
  const fact = (label, value, cls) => {
    const f = el('span', 'fact' + (cls ? ' ' + cls : ''));
    f.append(label + ' ', el('b', null, value));
    facts.append(f);
  };
  fact('Issues', t.total ?? '—');
  fact('Milestone', (t.milestoneClosed ?? '—') + ' closed / ' + (t.milestoneOpen ?? '—') + ' open');
  fact('Entangled', t.entangled ?? '—');
  fact('Alphas', (t.alphas ?? '—') + ' in 5 days');
  fact('Risk', S.risk ?? '—', 'risk-' + (S.risk || 'low'));
  fact('Confidence', S.confidence ?? '—');
  fact('Reversible until', S.reversibleUntil ?? '—');
  document.getElementById('pv-branch').textContent =
    S.branch + (S.updated ? '   ·   updated ' + S.updated : '');

  // --------------------------------------------------------------- sections
  const host = document.getElementById('pv-sections');
  const section = (id, no, title, count, build) => {
    const d = el('details', 'sec glass');
    d.id = id;
    if (no === 0 || no === 3) d.open = true;
    const sm = el('summary');
    sm.append(el('span', 'secno', '[' + no + ']'), el('h2', null, title));
    if (count != null) sm.append(el('span', 'seccount', count));
    d.append(sm);
    const body = el('div', 'secbody');
    build(body);
    d.append(body);
    host.append(d);
  };

  // ---- [0] before/after: sandbox claim (issue body) vs verified main HEAD ----
  const MARK = { add: '[+]', chg: '[~]', del: '[-]', same: '   ' };
  section('s0', 0, 'Before / After — #3311 sandbox: claimed vs verified', null, (b) => {
    const a = S.arch || {};
    const grid = el('div', 'ba');
    const col = (heading, nodes) => {
      const c = el('div', 'col');
      c.append(el('h3', null, heading));
      (nodes || []).forEach((n) => {
        const row = el('div', 'node ' + (n.mark || 'same'));
        row.append(el('span', 'mk', MARK[n.mark] || MARK.same), el('span', 'mono', n.node));
        c.append(row);
      });
      return c;
    };
    grid.append(col('Claimed (issue body)', a.before), el('div', 'arrow', '→'),
                col('Verified at ' + S.base, a.after));
    b.append(grid);
  });

  // ---- [1] issue manifest (no chart — a git-diff bar chart doesn't fit an issue list) ----
  const issues = S.issues || [];
  section('s1', 1, 'Issue Manifest', issues.length + ' issues', (b) => {
    if (!issues.length) { b.append(el('p', 'empty', 'No issues in scope.')); return; }
    const tb = el('table');
    const thead = el('thead'); const hr = el('tr');
    ['', 'Issue', 'Group', 'Note'].forEach((h) => hr.append(el('th', null, h)));
    thead.append(hr); tb.append(thead);
    const body = el('tbody');
    issues.forEach((i) => {
      const tr = el('tr');
      const tag = el('td'); tag.append(el('span', 'tag ' + i.tier, i.ref));
      tr.append(tag, el('td', null, i.title), el('td', 'mono', i.group), el('td', null, i.note || ''));
      body.append(tr);
    });
    tb.append(body); b.append(tb);
    const lg = el('div', 'legend');
    [['ok', 'shipped / near-done'], ['mid', 'active work needed'], ['danger', 'blocked / at-risk']].forEach(([c, n]) => {
      const s = el('span'); const i = el('i');
      i.style.background = 'var(--status-' + (c === 'ok' ? 'good' : c === 'mid' ? 'warning' : 'critical') + ')';
      s.append(i, document.createTextNode(n)); lg.append(s);
    });
    b.append(lg);
  });

  // ---- [2] execution swimlane (dependency chain + all 13 issues) ----
  const phases = S.phases || [];
  section('s2', 2, 'Execution order', phases.length + ' issues', (b) => {
    if (!phases.length) { b.append(el('p', 'empty', 'No phase breakdown provided.')); return; }
    phases.forEach((p) => {
      const lane = el('div', 'lane ' + (p.status || 'planned'));
      lane.append(el('div', 'pid', p.id));
      const bar = el('div', 'bar');
      bar.append(el('span', null, p.title));
      if ((p.deps || []).length) bar.append(el('span', 'deps', 'after ' + p.deps.join(', ')));
      lane.append(bar);
      b.append(lane);
      if (p.detail) {
        const d = el('div', 'lane');
        d.style.borderBlockEnd = 'none';
        d.append(el('div'), el('div', 'empty', p.detail));
        b.append(d);
      }
    });
  });

  // ---- [3] risk dashboard ------------------------------------------------
  const risks = S.risks || [];
  const SEV_ORDER = ['good', 'warning', 'serious', 'critical'];
  section('s3', 3, 'Risk heat map', risks.length + ' tracked', (b) => {
    if (!risks.length) { b.append(el('p', 'empty', 'No risks recorded — say why, do not pad.')); return; }
    const toggle = el('div', 'viewtoggle');
    const bC = el('button', null, 'Chart'); bC.type = 'button';
    const bT = el('button', null, 'Table'); bT.type = 'button';
    const chart = el('div', 'chart');
    const table = el('div', 'table');
    (() => {
      const w = 940, h = 300, padL = 56, padB = 44;
      const svg = svgEl('svg', { viewBox: '0 0 ' + w + ' ' + h, role: 'img',
        'aria-label': 'Risk likelihood against impact, 1 to 5 each. Same data in the table view.' });
      for (let i = 1; i <= 5; i++) {
        const x = padL + ((i - 1) / 4) * (w - padL - 40);
        const y = h - padB - ((i - 1) / 4) * (h - padB - 30);
        svg.append(svgEl('line', { x1: x, x2: x, y1: 20, y2: h - padB, stroke: 'var(--mark-grid)', 'stroke-width': 1 }));
        svg.append(svgEl('line', { x1: padL, x2: w - 40, y1: y, y2: y, stroke: 'var(--mark-grid)', 'stroke-width': 1 }));
        const xt = svgEl('text', { x: x, y: h - padB + 18, 'text-anchor': 'middle' }); xt.textContent = String(i); svg.append(xt);
        const yt = svgEl('text', { x: padL - 12, y: y + 4, 'text-anchor': 'end' }); yt.textContent = String(i); svg.append(yt);
      }
      const ax = svgEl('text', { x: (w + padL) / 2, y: h - 8, 'text-anchor': 'middle', class: 'lbl' }); ax.textContent = 'likelihood →'; svg.append(ax);
      const ay = svgEl('text', { x: 14, y: 16, class: 'lbl' }); ay.textContent = 'impact ↑'; svg.append(ay);
      risks.forEach((r) => {
        const x = padL + (((r.likelihood || 1) - 1) / 4) * (w - padL - 40);
        const y = h - padB - (((r.impact || 1) - 1) / 4) * (h - padB - 30);
        svg.append(svgEl('circle', { cx: x, cy: y, r: 11, fill: 'var(--status-' + (r.severity || 'warning') + ')' }));
        const lab = svgEl('text', { x: x, y: y + 4, 'text-anchor': 'middle', fill: 'var(--pg-bg)', 'font-weight': '700' });
        lab.textContent = r.id; svg.append(lab);
      });
      chart.append(svg);
      const lg = el('div', 'legend');
      SEV_ORDER.slice().reverse().forEach((s) => {
        const sp = el('span'); const i = el('i'); i.style.background = 'var(--status-' + s + ')';
        sp.append(i, document.createTextNode(s)); lg.append(sp);
      });
      chart.append(lg);
    })();
    (() => {
      const tbl = el('table');
      const hr = el('tr');
      ['ID', 'Risk', 'Severity', 'Likelihood', 'Impact'].forEach((hh, i) => hr.append(el('th', i >= 3 ? 'num' : null, hh)));
      const thead = el('thead'); thead.append(hr); tbl.append(thead);
      const body = el('tbody');
      risks.forEach((r) => {
        const tr = el('tr');
        const sv = el('td'); sv.append(el('span', 'sev ' + (r.severity || 'warning'), r.severity || 'warning'));
        tr.append(el('td', 'mono', r.id), el('td', null, r.title), sv,
                  el('td', 'num', r.likelihood ?? '—'), el('td', 'num', r.impact ?? '—'));
        body.append(tr);
      });
      tbl.append(body); table.append(tbl);
    })();
    const show = (isChart) => {
      chart.hidden = !isChart; table.hidden = isChart;
      bC.setAttribute('aria-pressed', String(isChart)); bT.setAttribute('aria-pressed', String(!isChart));
      say('Risk map: ' + (isChart ? 'chart' : 'table') + ' view');
    };
    bC.addEventListener('click', () => show(true));
    bT.addEventListener('click', () => show(false));
    toggle.append(bC, bT);
    b.append(toggle, chart, table);
    show(true);

    const cards = el('div', 'cards');
    cards.style.marginBlockStart = '16px';
    risks.forEach((r) => {
      const c = el('div', 'card');
      const hd = el('h4');
      hd.append(el('span', 'sev ' + (r.severity || 'warning'), r.severity || 'warning'), el('span', null, r.title));
      c.append(hd);
      const dl = el('dl');
      if (r.premortem) { dl.append(el('dt', null, 'pre-mortem'), el('dd', null, r.premortem)); }
      if (r.containment) { dl.append(el('dt', null, 'containment'), el('dd', null, r.containment)); }
      c.append(dl);
      cards.append(c);
    });
    b.append(cards);
  });

  // ---- [4] label vs evidence (decision-log card shape, repurposed) -------
  const decisions = S.decisions || [];
  section('s4', 4, 'Label vs Evidence', decisions.length + ' compared', (b) => {
    if (!decisions.length) { b.append(el('p', 'empty', 'No comparisons recorded.')); return; }
    const cards = el('div', 'cards');
    decisions.forEach((d) => {
      const c = el('div', 'card');
      const hd = el('h4');
      hd.append(el('span', 'mono', d.id), el('span', null, d.title));
      c.append(hd);
      const dl = el('dl');
      [['label claims', d.context], ['evidence says', d.decision],
       ['alternatives considered', d.alternatives], ['tradeoff', d.tradeoff]].forEach(([k, v]) => {
        if (v) { dl.append(el('dt', null, k), el('dd', null, v)); }
      });
      c.append(dl);
      cards.append(c);
    });
    b.append(cards);
  });

  // ---- [5] impact ---------------------------------------------------------
  section('s5', 5, 'Impact', null, (b) => {
    const kpis = el('div', 'kpis');
    const kpi = (value, label, cls) => {
      const k = el('div', 'kpi');
      k.append(el('b', cls, value), el('span', null, label));
      kpis.append(k);
    };
    const milestoneTotal = (t.milestoneClosed ?? 0) + (t.milestoneOpen ?? 0);
    const pct = milestoneTotal ? Math.round(((t.milestoneClosed ?? 0) / milestoneTotal) * 100) : 0;
    kpi(pct + '%', 'milestone complete', 'up');
    kpi(String(t.milestoneOpen ?? '—'), 'milestone issues open');
    kpi(String(t.entangled ?? '—'), 'entangled issues', 'acc');
    kpi(String(t.total ?? '—'), 'total tracked here');
    kpi(String(t.alphas ?? '—'), 'alphas shipped, 5 days');
    b.append(kpis);

    const cats = S.byCategory || [];
    if (cats.length > 1) {
      const toggle = el('div', 'viewtoggle');
      const bC = el('button', null, 'Chart'); bC.type = 'button';
      const bT = el('button', null, 'Table'); bT.type = 'button';
      const chart = el('div', 'chart');
      const table = el('div', 'table');
      (() => {
        const max = Math.max(1, ...cats.map((c) => c.count));
        const rowH = 32, padL = 170, padR = 70, w = 940;
        const svg = svgEl('svg', { viewBox: '0 0 ' + w + ' ' + (cats.length * rowH + 10),
          role: 'img', 'aria-label': 'Issue count per category. Same data in the table view.' });
        cats.forEach((c, i) => {
          const y = i * rowH + 6;
          const bw = Math.round((c.count / max) * (w - padL - padR));
          const lab = svgEl('text', { x: padL - 12, y: y + 15, 'text-anchor': 'end', class: 'lbl' });
          lab.textContent = c.name; svg.append(lab);
          svg.append(svgEl('rect', { x: padL, y: y + 4, width: bw, height: 16, rx: 4, fill: 'var(--series-1)' }));
          const v = svgEl('text', { x: padL + bw + 10, y: y + 17 }); v.textContent = String(c.count); svg.append(v);
        });
        chart.append(svg);
      })();
      (() => {
        const tb = el('table');
        const hr = el('tr'); hr.append(el('th', null, 'Category'), el('th', 'num', 'Issues'));
        const thead = el('thead'); thead.append(hr); tb.append(thead);
        const body = el('tbody');
        cats.forEach((c) => {
          const tr = el('tr');
          tr.append(el('td', null, c.name), el('td', 'num', String(c.count)));
          body.append(tr);
        });
        tb.append(body); table.append(tb);
      })();
      const show = (isChart) => {
        chart.hidden = !isChart; table.hidden = isChart;
        bC.setAttribute('aria-pressed', String(isChart)); bT.setAttribute('aria-pressed', String(!isChart));
        say('Issues by category: ' + (isChart ? 'chart' : 'table') + ' view');
      };
      bC.addEventListener('click', () => show(true));
      bT.addEventListener('click', () => show(false));
      toggle.append(bC, bT);
      b.append(el('h2', null, 'Issues by category'));
      b.append(toggle, chart, table);
      show(true);
    }
  });

  // ---- copy-prompt ---------------------------------------------------------
  const promptText = S.prompt || ('Execute the plan for ' + S.title + '.');
  document.getElementById('pv-prompt').textContent = promptText;
  const btn = document.getElementById('pv-copy');
  btn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(promptText); }
    catch { const r = document.createRange(); r.selectNode(document.getElementById('pv-prompt'));
            getSelection().removeAllRanges(); getSelection().addRange(r); }
    const was = btn.textContent;
    btn.textContent = '✓ Copied';
    say('Prompt copied to clipboard');
    setTimeout(() => { btn.textContent = was; }, 1500);
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OrchestKit x Claude Code — Convergence Audit, 2026-08-08</title>
<!--
  DASHBOARD archetype (playground-visual-standard §0): a verdict/adoption view.
  Started from plan-dashboard.template.html; tokens, glass, motion budget and the
  reduced-motion gate are carried over verbatim.
  DELIBERATE DEVIATION: the operator asked for tabs. Tabs are the top-level nav;
  every panel still uses anchored <details> sections, so keyboard + deep links work.
  State lives in the JSON island below and renders via textContent/createElement.
-->
<style>
  :root{
    /* ---- CHROME (§2): HSL only ---- */
    --pg-bg: hsl(232 26% 7%);
    --pg-ink: hsl(220 18% 93%);
    --pg-muted: hsl(226 14% 64%);
    --pg-faint: hsl(226 12% 46%);
    --pg-glass: hsl(0 0% 100% / .05);
    --pg-glass-2: hsl(0 0% 100% / .08);
    --pg-glass-edge: hsl(0 0% 100% / .18);
    --pg-accent: hsl(248 84% 68%);
    --pg-accent-deep: hsl(248 70% 54%);
    --pg-violet: hsl(268 78% 70%);
    --pg-warm: hsl(38 95% 60%);
    --pg-ok: hsl(152 62% 58%);
    --pg-risk: hsl(0 78% 66%);
    --pg-ease: cubic-bezier(.2,.8,.25,1);

    /* ---- DATA MARKS: /dataviz validated palette, DARK column ---- */
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
    --series-4:#c98500; --series-5:#d55181;
    --status-good:#0ca30c; --status-warning:#fab219;
    --status-serious:#ec835a; --status-critical:#d03b3b;
    --mark-muted:#898781; --mark-grid:#2c2c2a; --mark-base:#383835;

    font-size:15px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--pg-bg); color:var(--pg-ink);
    font-family:-apple-system,'SF Pro Text',Inter,sans-serif;
    line-height:1.55; padding-block:0 96px; padding-inline:24px;
    background-image:
      radial-gradient(60% 42% at 12% 0%,   hsl(248 84% 68% / .16), transparent 62%),
      radial-gradient(48% 36% at 88% 8%,   hsl(268 78% 70% / .12), transparent 60%),
      radial-gradient(52% 40% at 50% 100%, hsl(240 80% 62% / .10), transparent 64%);
    background-attachment:fixed;
  }
  .wrap{max-inline-size:1180px;margin-inline:auto}
  h1{font-size:1.75rem;font-weight:700;letter-spacing:-.3px}
  h2{font-size:1.05rem;font-weight:650;letter-spacing:-.2px}
  h3{font-size:.92rem;font-weight:650;color:var(--pg-muted);margin-block:16px 8px}
  p{color:var(--pg-muted);font-size:.9rem}
  .mono,.num,code{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
  code{font-size:.82em;background:var(--pg-glass-2);padding:1px 6px;border-radius:6px;color:var(--pg-ink)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .glass{
    background:var(--pg-glass); border:1px solid var(--pg-glass-edge); border-radius:24px;
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    box-shadow: inset 0 1px 0 hsl(0 0% 100% / .12),
      0 20px 60px -22px hsl(232 40% 3% / .7), 0 4px 12px -6px hsl(232 40% 3% / .5);
  }

  /* ---- TIER 1 ---- */
  .tier1{position:sticky;inset-block-start:0;z-index:20;padding:20px 24px;margin-block:24px 16px;border-radius:24px}
  .tier1 .top{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
  .tier1 .issue{color:var(--pg-accent);font-weight:600;font-size:.9rem}
  .facts{display:flex;gap:8px;flex-wrap:wrap;margin-block-start:12px}
  .fact{background:var(--pg-glass-2);border:1px solid hsl(0 0% 100% / .10);border-radius:999px;
        padding:5px 14px;font-size:.8rem;color:var(--pg-muted)}
  .fact b{color:var(--pg-ink);font-weight:650}
  .fact.risk-high b{color:var(--pg-risk)} .fact.risk-medium b{color:var(--pg-warm)}
  .fact.risk-low b{color:var(--pg-ok)}
  .branchline{margin-block-start:10px;color:var(--pg-faint);font-size:.8rem}

  /* ---- TABS ---- */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-block-start:14px}
  .tabs button{
    font:inherit;font-size:.8rem;color:var(--pg-faint);background:none;border:1px solid transparent;
    padding:6px 13px;border-radius:999px;cursor:pointer;
    transition:color 100ms var(--pg-ease),background 100ms var(--pg-ease),border-color 100ms var(--pg-ease);
  }
  .tabs button:hover{color:var(--pg-ink);background:var(--pg-glass-2)}
  .tabs button[aria-selected="true"]{color:var(--pg-ink);background:var(--pg-glass-2);border-color:var(--pg-glass-edge)}
  .tabs button:focus-visible{outline:2px solid var(--pg-accent);outline-offset:3px}
  .tabs .cnt{color:var(--pg-faint);margin-inline-start:6px;font-size:.72rem}
  .panel[hidden]{display:none}
  .panel{animation:fade 300ms var(--pg-ease)}
  @keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

  /* ---- sections ---- */
  details.sec{margin-block-end:16px;padding:0 24px;border-radius:24px;scroll-margin-block-start:170px}
  details.sec>summary{list-style:none;cursor:pointer;padding-block:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  details.sec>summary::-webkit-details-marker{display:none}
  details.sec>summary::before{content:'\25B8';color:var(--pg-accent);font-size:.9rem;
    transition:transform 200ms var(--pg-ease);display:inline-block}
  details.sec[open]>summary::before{transform:rotate(90deg)}
  details.sec>summary:focus-visible{outline:2px solid var(--pg-accent);outline-offset:4px;border-radius:12px}
  .secno{color:var(--pg-faint);font-size:.8rem}
  .seccount{margin-inline-start:auto;color:var(--pg-faint);font-size:.78rem}
  .secbody{padding-block-end:24px}
  .empty{color:var(--pg-faint);font-size:.86rem;font-style:italic}

  /* ---- stat tiles ---- */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-block:16px}
  .tile{background:var(--pg-glass-2);border:1px solid hsl(0 0% 100% / .10);border-radius:16px;padding:14px 16px}
  .tile .k{font-size:.72rem;color:var(--pg-faint);text-transform:uppercase;letter-spacing:.5px}
  .tile .v{font-size:1.7rem;font-weight:700;margin-block-start:4px;font-variant-numeric:tabular-nums}
  .tile .s{font-size:.76rem;color:var(--pg-muted);margin-block-start:2px}

  /* ---- bar meters + table twin ---- */
  .chartbox{margin-block:12px}
  .twinbar{display:flex;gap:8px;align-items:center;margin-block-end:8px}
  .twinbar button{font:inherit;font-size:.74rem;color:var(--pg-faint);background:var(--pg-glass-2);
    border:1px solid hsl(0 0% 100% / .10);border-radius:999px;padding:3px 11px;cursor:pointer;
    transition:color 100ms var(--pg-ease)}
  .twinbar button:hover{color:var(--pg-ink)}
  .twinbar button:focus-visible{outline:2px solid var(--pg-accent);outline-offset:3px}
  .bar{display:grid;grid-template-columns:190px 1fr 54px;gap:10px;align-items:center;margin-block-end:7px;font-size:.82rem}
  .bar .lab{color:var(--pg-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .track{background:hsl(0 0% 100% / .06);border-radius:999px;height:15px;overflow:hidden}
  .bar .fill{height:100%;border-radius:999px}
  .bar .val{text-align:right;color:var(--pg-ink);font-family:ui-monospace,Menlo,monospace;font-size:.8rem}

  table{width:100%;border-collapse:collapse;font-size:.82rem;margin-block:8px}
  th,td{text-align:left;padding:7px 10px;border-block-end:1px solid hsl(0 0% 100% / .07);vertical-align:top}
  th{color:var(--pg-faint);font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.4px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr:hover{background:hsl(0 0% 100% / .03)}

  /* ---- item cards ---- */
  .item{background:var(--pg-glass-2);border:1px solid hsl(0 0% 100% / .10);border-radius:16px;
        padding:16px 18px;margin-block-end:12px}
  .item .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-block-end:8px}
  .item .ttl{font-weight:650;font-size:.95rem}
  .item .body{font-size:.86rem;color:var(--pg-muted)}
  .item .body b{color:var(--pg-ink);font-weight:600}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-block-start:10px;font-size:.8rem}
  .kv dt{color:var(--pg-faint);white-space:nowrap}
  .kv dd{color:var(--pg-muted);font-family:ui-monospace,Menlo,monospace;font-size:.78rem;word-break:break-word}
  .fix{margin-block-start:10px;padding:10px 12px;border-radius:12px;
       background:hsl(152 62% 58% / .07);border:1px solid hsl(152 62% 58% / .22);
       font-size:.83rem;color:var(--pg-muted)}
  .fix b{color:var(--pg-ok)}

  .pill{font-size:.68rem;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
        padding:3px 9px;border-radius:999px;white-space:nowrap}
  .p-critical{background:hsl(0 70% 50% / .18);color:hsl(0 80% 74%);border:1px solid hsl(0 70% 50% / .35)}
  .p-high{background:hsl(20 80% 52% / .16);color:hsl(24 88% 70%);border:1px solid hsl(20 80% 52% / .32)}
  .p-medium{background:hsl(38 90% 55% / .14);color:hsl(40 92% 68%);border:1px solid hsl(38 90% 55% / .30)}
  .p-low{background:hsl(226 14% 64% / .12);color:var(--pg-muted);border:1px solid hsl(0 0% 100% / .12)}
  .p-override{background:hsl(0 70% 50% / .18);color:hsl(0 80% 74%);border:1px solid hsl(0 70% 50% / .35)}
  .p-retire{background:hsl(20 80% 52% / .16);color:hsl(24 88% 70%);border:1px solid hsl(20 80% 52% / .32)}
  .p-extend{background:hsl(214 70% 55% / .16);color:hsl(210 85% 74%);border:1px solid hsl(214 70% 55% / .32)}
  .p-adopt{background:hsl(268 70% 62% / .16);color:hsl(268 80% 78%);border:1px solid hsl(268 70% 62% / .32)}
  .p-keep{background:hsl(152 62% 45% / .15);color:hsl(152 66% 70%);border:1px solid hsl(152 62% 45% / .30)}
  .p-verified{background:hsl(152 62% 45% / .15);color:hsl(152 66% 70%);border:1px solid hsl(152 62% 45% / .30)}
  .p-pending{background:hsl(226 14% 64% / .12);color:var(--pg-muted);border:1px solid hsl(0 0% 100% / .12)}

  .callout{border-radius:16px;padding:16px 18px;margin-block:14px;font-size:.88rem;color:var(--pg-muted)}
  .callout b{color:var(--pg-ink)}
  .c-bad{background:hsl(0 70% 50% / .07);border:1px solid hsl(0 70% 50% / .24)}
  .c-note{background:var(--pg-glass-2);border:1px solid hsl(0 0% 100% / .10)}
  .c-ok{background:hsl(152 62% 58% / .07);border:1px solid hsl(152 62% 58% / .22)}

  pre.ascii{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:.76rem;line-height:1.5;
    color:var(--pg-muted);background:hsl(0 0% 0% / .22);border:1px solid hsl(0 0% 100% / .08);
    border-radius:12px;padding:14px 16px;overflow-x:auto;margin-block:12px}

  /* ---- before/after flow diagrams (self-contained, no external renderer) ---- */
  .dgram{margin-block-end:18px}
  .dgram .lane{padding:14px 16px;border-radius:16px;margin-block-end:10px;
    border:1px solid hsl(0 0% 100% / .10);background:hsl(0 0% 0% / .16)}
  .dgram .lane.before{border-color:hsl(0 70% 50% / .28);background:hsl(0 70% 50% / .05)}
  .dgram .lane.after{border-color:hsl(152 62% 45% / .28);background:hsl(152 62% 45% / .05)}
  .lane .tag{font-size:.68rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    margin-block-end:10px;display:block}
  .lane.before .tag{color:hsl(0 80% 74%)} .lane.after .tag{color:hsl(152 66% 70%)}
  .lane .cap{font-size:.8rem;color:var(--pg-faint);margin-block-start:9px}
  .flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-block-end:6px}
  .nd{padding:6px 12px;border-radius:10px;font-size:.78rem;white-space:nowrap;
    background:var(--pg-glass-2);border:1px solid hsl(0 0% 100% / .12);color:var(--pg-ink)}
  .nd.bad{background:hsl(0 70% 50% / .14);border-color:hsl(0 70% 50% / .34);color:hsl(0 80% 78%)}
  .nd.good{background:hsl(152 62% 45% / .14);border-color:hsl(152 62% 45% / .34);color:hsl(152 66% 74%)}
  .nd.dead{color:var(--pg-faint);text-decoration:line-through;opacity:.7;border-style:dashed}
  .nd.cc{background:hsl(248 84% 68% / .14);border-color:hsl(248 84% 68% / .34);color:hsl(248 90% 84%)}
  .arw{color:var(--pg-accent);font-family:ui-monospace,Menlo,monospace;font-size:.85rem}
  .arw.x{color:hsl(0 80% 70%)}
  .mmd{margin-block-start:8px}
  .mmd summary{cursor:pointer;font-size:.76rem;color:var(--pg-faint);padding-block:5px;list-style:none}
  .mmd summary::-webkit-details-marker{display:none}
  .mmd summary::before{content:'\25B8 ';color:var(--pg-accent)}
  .mmd[open] summary::before{content:'\25BE '}
  .mmd summary:focus-visible{outline:2px solid var(--pg-accent);outline-offset:3px;border-radius:8px}
  .mmd .mrow{display:flex;gap:8px;align-items:flex-start}
  .mmd pre{flex:1}
  .mmd button{font:inherit;font-size:.72rem;color:var(--pg-faint);background:var(--pg-glass-2);
    border:1px solid hsl(0 0% 100% / .10);border-radius:999px;padding:3px 11px;cursor:pointer;
    white-space:nowrap;margin-block-start:12px}
  .mmd button:hover{color:var(--pg-ink)}
  .mmd button:focus-visible{outline:2px solid var(--pg-accent);outline-offset:3px}

  /* ---- copy-prompt bar (tertiary) ---- */
  .copybar{display:flex;gap:10px;align-items:center;margin-block:24px 0;padding:14px 18px;
    border-radius:16px;background:var(--pg-glass-2);border:1px solid hsl(0 0% 100% / .10)}
  .copybar p{flex:1;font-size:.82rem;color:var(--pg-faint)}
  .copybar button{font:inherit;font-size:.8rem;font-weight:600;color:var(--pg-ink);
    background:var(--pg-accent-deep);border:none;border-radius:999px;padding:8px 18px;cursor:pointer;
    transition:filter 100ms var(--pg-ease)}
  .copybar button:hover{filter:brightness(1.14)}
  .copybar button:focus-visible{outline:2px solid var(--pg-accent);outline-offset:3px}

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
  @media (max-width:720px){ .bar{grid-template-columns:130px 1fr 46px} }
</style>
</head>
<body>
<div class="wrap">

  <header class="tier1 glass">
    <div class="top">
      <h1>OrchestKit &times; Claude Code — Convergence Audit</h1>
      <span class="issue mono" id="hd-run"></span>
    </div>
    <div class="facts" id="hd-facts"></div>
    <p class="branchline mono" id="hd-branch"></p>
    <div class="tabs" role="tablist" aria-label="Audit sections" id="tablist"></div>
  </header>

  <p class="sr" id="live" aria-live="polite"></p>
  <main id="panels"></main>

  <div class="copybar">
    <p id="copyhint"></p>
    <button id="copybtn" type="button">Copy fix prompt</button>
  </div>
</div>

<script>
(function(){
  'use strict';
  var S = JSON.parse(document.getElementById('plan-state').textContent);
  var live = document.getElementById('live');

  function add(p,c){ p.appendChild(c); return c; }

  /* ---------- tier 1 ---------- */
  document.getElementById('hd-run').textContent = S.meta.run + '  ·  ' + S.meta.date;

  });

    'binary ' + S.meta.binary + '  ·  ork floor ' + S.meta.orkFloor +
    '  ·  ork latest_known ' + S.meta.orkLatestKnown + '  ·  ' + S.meta.branch;

  /* ---------- helpers ---------- */
  function section(host, no, title, count, open){
    var d = add(host, el('details','sec glass'));

  function tiles(host, arr){
    var g = add(host, el('div','tiles'));

      add(c, el('div','k', t.k));
      var v = add(c, el('div','v', t.v));
      if(t.color) v.style.color = t.color;
      if(t.s) add(c, el('div','s', t.s));
    });
  }
  /* chart + mandatory table twin */
  function barsWithTwin(host, rows, maxOverride, unit, twinCols){
    var box = add(host, el('div','chartbox'));
    var bar = add(box, el('div','twinbar'));
    var btn = add(bar, el('button', null, 'Show table'));
    btn.type='button';
    var chart = add(box, el('div'));
    var table = add(box, el('div'));
    table.hidden = true;
    var max = maxOverride || rows.reduce(function(m,r){ return Math.max(m, r.n); }, 0) || 1;
    rows.forEach(function(r){
      var b = add(chart, el('div','bar'));
      add(b, el('div','lab', r.k));
      var t = add(b, el('div','track'));
      var f = add(t, el('div','fill'));
      f.style.width = Math.max(2, Math.round(r.n/max*100)) + '%';
      f.style.background = r.color || 'var(--series-1)';
      add(b, el('div','val', String(r.n) + (unit||'')));
    });
    var tb = add(table, el('table'));
    var thead = add(tb, el('thead')); var htr = add(thead, el('tr'));
    (twinCols || ['Item','Count']).forEach(function(c,i){
      var th = add(htr, el('th', i>0?'num':null, c));
    });
    var tbody = add(tb, el('tbody'));
    rows.forEach(function(r){
      var tr = add(tbody, el('tr'));
      add(tr, el('td', null, r.k));
      add(tr, el('td','num', String(r.n)));
      if((twinCols||[]).length > 2) add(tr, el('td', null, r.meaning || ''));
    });
    if((twinCols||[]).length > 2){
      var th3 = add(htr, el('th', null, ''));
    }
    btn.addEventListener('click', function(){
      var showTable = table.hidden;
      table.hidden = !showTable; chart.hidden = showTable;
      btn.textContent = showTable ? 'Show chart' : 'Show table';
      live.textContent = showTable ? 'Showing data table' : 'Showing chart';
    });
  }
  function bullets(host, arr){
    var ul = add(host, el('ul'));

    });

    {id:'verdict',  label:'Verdict',    count:S.verdict.grade,             build:tabVerdict},
    {id:'bugs',     label:'Bugs',       count:S.bugs.length,               build:tabBugs},

    {id:'msg',      label:'Cross-session', count:null,                     build:tabMsg},
    {id:'diagrams', label:'Before / After', count:S.diagrams.length,       build:tabDiagrams},
    {id:'fix',      label:'Refactors',  count:S.refactors.length,          build:tabFix},
    {id:'honesty',  label:'Unsettled',  count:S.unsettled.length,          build:tabHonesty}

  function tabVerdict(host){
    var b = section(host,'[0]','The verdict', null, true);
    tiles(b, [
      {k:'Grade', v:S.verdict.grade, color:'var(--status-serious)', s:'objective, not kind'},
      {k:'Confirmed bugs', v:'15', color:'var(--status-critical)', s:'2 critical, 6 high'},
      {k:'Override violations', v:'4', color:'var(--status-critical)', s:'banned by the rule'},
      {k:'Unused CC capability', v:'39', color:'var(--status-warning)', s:'14 rated HIGH'},
      {k:'Inert safety controls', v:'3', color:'var(--status-critical)', s:'sandbox, depth, goal brake'},

    var p = section(host,'[0.3]','The pattern under all of it', null);
    var pre = add(p, el('pre','ascii'));
    pre.textContent =
      'THE SHAPE OF EVERY FINDING\n' +
      '\n' +
      '  a need appears\n' +
      '       |\n' +
      '       +--> did anyone check whether CC already does this?\n' +
      '       |         |\n' +
      '       |         +-- NO  (39 times) --> build it ourselves\n' +
      '       |                                     |\n' +
      '       |                                     +--> it works\n' +
      '       |                                     +--> it drifts\n' +
      '       |                                     +--> CC ships the real one\n' +
      '       |                                     +--> ours is now a liability\n' +
      '       |\n' +
      '       +--> did anyone verify the control actually fires?\n' +
      '                 |\n' +
      '                 +-- NO (3 times) --> sandbox authored, never enabled\n' +
      '                                      depth budget enforced by a sentence\n' +
      '                                      goal brake counting the wrong number\n' +
      '\n' +
      'The cost is not the individual bug. It is that the estate cannot tell\n' +
      'a control that fires from a control that looks like it fires.';
    var corr = section(host,'[0.4]','Where this audit corrected itself', S.corrections.length);
    add(corr, el('p', null, 'Included on purpose. A record that hides where its own process was wrong is not the honest artifact.'));
    S.corrections.forEach(function(c){
      var it = add(corr, el('div','item'));
      var hd = add(it, el('div','hd'));
      add(hd, el('span','pill p-medium','corrected'));
      add(hd, el('span','ttl', c.claimed));
      add(it, el('div','body', c.actual));
    });
  }

  function tabBugs(host){
    var counts = {critical:0, high:0, medium:0, low:0};
    S.bugs.forEach(function(b){ counts[b.sev]++; });
    var b0 = section(host,'[1]','Severity distribution', S.bugs.length + ' confirmed', true);
    barsWithTwin(b0, [
      {k:'critical', n:counts.critical, color:'var(--status-critical)'},
      {k:'high',     n:counts.high,     color:'var(--status-serious)'},
      {k:'medium',   n:counts.medium,   color:'var(--status-warning)'},

    add(b0, el('p', null, 'Every bug below carries a file:line and the command or read that proves it. None is inferred from a filename.'));

    var b1 = section(host,'[1.1]','Every confirmed bug', S.bugs.length, true);
    S.bugs.forEach(function(bug){
      var it = add(b1, el('div','item'));
      var hd = add(it, el('div','hd'));

      add(hd, el('span','mono', bug.id));
      add(hd, el('span','ttl', bug.title));
      add(it, el('div','body', bug.why));
      var dl = add(it, el('dl','kv'));
      add(dl, el('dt', null, 'evidence'));
      add(dl, el('dd', null, bug.evidence));
      add(dl, el('dt', null, 'files'));
      add(dl, el('dd', null, bug.files.join('  ·  ')));

      fx.appendChild(el('b',null,'Fix: '));
      fx.appendChild(document.createTextNode(bug.fix));
      var eng = add(it, el('div','callout c-bad'));
      eng.style.marginBlock = '10px 0';
      eng.appendChild(el('b',null,'Engineering call: '));
      eng.appendChild(document.createTextNode(bug.engineering));

  }

  function tabOverrides(host){
    var b = section(host,'[2]','The rule these break', null, true);
    var c = add(b, el('div','callout c-note'));
    c.appendChild(el('b',null,'The rule: '));
    c.appendChild(document.createTextNode(
      "CC's mechanism is the SUBSTRATE. Our need is a LAYER on it, expressed through CC's own extension points. EXTEND is the default. RETIRE means re-home the opinion FIRST, then delete our pipe. OVERRIDE (intercept CC's mechanism to substitute ours) and DIVERGE (build a second mechanism beside it) are banned."));
    var b1 = section(host,'[2.1]','The four violations', S.overrides.length, true);

  function tabLedger(host){

      null, '', ['Posture','Rows','Meaning']);
    var lg = add(b, el('div'));

      var d = add(lg, el('div','body'));
      d.style.marginBottom = '6px';

    var b1 = section(host,'[3.1]','RETIRE — nine parallel mechanisms CC already owns', S.retire.length, true);

  function tabFix(host){
    var b = section(host,'[6]','Ordered refactor plan', S.refactors.length, true);
    add(b, el('p', null, 'Effort S is under an hour. Every item names the file to open and the check that proves it landed. Nothing here has been applied — this is a proposal against your tree.'));
    var t = add(b, el('table'));
    var hr = add(add(t,el('thead')), el('tr'));
    ['#','Eff','Refactor','Files','Verify','Gate'].forEach(function(h){ add(hr, el('th', null, h)); });
    var tb = add(t, el('tbody'));
    S.refactors.forEach(function(r){
      var tr = add(tb, el('tr'));
      add(tr, el('td','mono', String(r.n)));
      var e = add(tr, el('td'));
      add(e, el('span','pill '+(r.eff==='S'?'p-keep':'p-medium'), r.eff));
      add(tr, el('td', null, r.title));
      var f = add(tr, el('td')); add(f, el('code', null, r.files));
      var v = add(tr, el('td')); add(v, el('code', null, r.verify));
      var g = add(tr, el('td'));
      add(g, el('span','pill '+(r.gate==='none'?'p-keep':'p-high'), r.gate));
    });
    var b2 = section(host,'[6.1]','What to do in the next hour', 3, true);
    bullets(b2, [
      'Refactor 1 (abort-if). Four files, one grep to verify. It is shipped, copy-paste-instructed, and it silently discards the user’s acceptance criteria.',
      'Refactor 3 (sibling worktree path). One line. The hook currently teaches the exact idiom behind platform#9870 at the moment a session learns a peer exists.',
      'Refactor 2 (sandbox enabled). One key in two files, then claude --debug to confirm the seatbelt profile loads. Do NOT relax any regex guard until it does.'
    ]);
  }

  var ARROWS = {'->':'──▶', '-x':'──✕', '..>':'··▶'};
  function flowRow(host, tokens){
    var f = add(host, el('div','flow'));
    tokens.forEach(function(t){
      if(ARROWS[t]){
        var a = add(f, el('span','arw' + (t==='-x'?' x':''), ARROWS[t]));
        a.setAttribute('aria-hidden','true');
        return;
      }
      var cls = 'nd', lab = t;
      if(t.charAt(0)==='!'){ cls+=' bad';  lab=t.slice(1); }
      else if(t.charAt(0)==='+'){ cls+=' good'; lab=t.slice(1); }
      else if(t.charAt(0)==='~'){ cls+=' dead'; lab=t.slice(1); }
      else if(t.indexOf('CC ')===0){ cls+=' cc'; }
      add(f, el('div',cls,lab));
    });
  }
  function lane(host, kind, data){
    var l = add(host, el('div','lane '+kind));
    add(l, el('span','tag', kind==='before'?'Before':'After'));
    data.rows.forEach(function(r){ flowRow(l, r); });
    add(l, el('p','cap', data.caption));
  }
  function tabDiagrams(host){
    var b = section(host,'[8]','Before and after, six mechanisms', S.diagrams.length, true);
    add(b, el('p', null, 'Rendered natively so the file stays self-contained with zero external dependencies, per the house playground standard. Every diagram also ships its Mermaid source, which renders in GitHub, the docs site and Notion — expand and copy.'));
    var legend = add(b, el('div','flow'));
    ['!broken or harmful','~dead or unreachable','+fixed','plain'].forEach(function(t){
      var cls='nd', lab=t;
      if(t.charAt(0)==='!'){cls+=' bad';lab=t.slice(1);}
      else if(t.charAt(0)==='~'){cls+=' dead';lab=t.slice(1);}
      else if(t.charAt(0)==='+'){cls+=' good';lab=t.slice(1);}
      add(legend, el('div',cls,lab));
    });
    S.diagrams.forEach(function(d){
      var s = section(host, '[8.'+(S.diagrams.indexOf(d)+1)+']', d.title, null, true);
      var wrap = add(s, el('div','dgram'));
      lane(wrap,'before',d.before);
      lane(wrap,'after',d.after);
      var det = add(wrap, el('details','mmd'));
      add(det, el('summary', null, 'Mermaid source'));
      var row = add(det, el('div','mrow'));
      var pre = add(row, el('pre','ascii'));
      pre.textContent = d.mermaid;
      var cp = add(row, el('button', null, 'Copy'));
      cp.type='button';
      cp.addEventListener('click', function(){
        navigator.clipboard.writeText(d.mermaid).then(function(){
          cp.textContent='✓';
          live.textContent='Mermaid source copied for ' + d.title;
          setTimeout(function(){ cp.textContent='Copy'; },1500);
        });
      });
    });
  }

  function tabHonesty(host){
    var b = section(host,'[7]','What this audit could not settle', S.unsettled.length, true);
    add(b, el('p', null, 'Each carries the exact probe that settles it. None is a shrug.'));
    S.unsettled.forEach(function(u){
      var it = add(b, el('div','item'));
      var hd = add(it, el('div','hd'));
      add(hd, el('span','pill p-pending','open'));
      add(hd, el('span','ttl', u.q));
      add(it, el('div','body', u.check));
    });
    var b2 = section(host,'[7.1]','What this audit admits about itself', S.limits.length, true);
    bullets(b2, S.limits);
    var b3 = section(host,'[7.2]','Evidence standard', null);
    var c = add(b3, el('div','callout c-note'));
    c.appendChild(el('b', null, 'How every claim here was produced. '));
    c.appendChild(document.createTextNode(S.meta.evidence + '. Each finding passed through an independent adversarial refuter instructed to default to REFUTED when the evidence offered was not reproducible, and specifically to hunt for evidence that was a docstring rather than executed behaviour, a grep matching a test fixture or type name, a hook called registered from hooks.json alone without checking the entries map, and any "the suite passes" with no pasted summary line.'));
    var c2 = add(b3, el('div','callout c-bad'));
    c2.appendChild(el('b', null, 'Still pending: '));
    c2.appendChild(document.createTextNode(S.meta.pending + '.'));
  }

  /* ---------- build tabs ---------- */
  var tablist = document.getElementById('tablist');
  var panels = document.getElementById('panels');
  var btns = [];
  TABS.forEach(function(t, i){
    var btn = add(tablist, el('button', null, t.label));
    btn.type='button'; btn.id = 'tab-'+t.id; btn.setAttribute('role','tab');
    btn.setAttribute('aria-controls','panel-'+t.id);
    btn.setAttribute('aria-selected', i===0 ? 'true':'false');
    btn.tabIndex = i===0 ? 0 : -1;
    if(t.count!=null) add(btn, el('span','cnt', String(t.count)));
    var p = add(panels, el('section','panel'));
    p.id='panel-'+t.id; p.setAttribute('role','tabpanel');
    p.setAttribute('aria-labelledby','tab-'+t.id);
    p.hidden = i!==0;
    t.build(p);
    btns.push({btn:btn, panel:p, t:t});
  });
  function select(i){
    btns.forEach(function(o, j){
      var on = i===j;
      o.btn.setAttribute('aria-selected', on?'true':'false');
      o.btn.tabIndex = on?0:-1;
      o.panel.hidden = !on;
    });
    btns[i].btn.focus();
    live.textContent = btns[i].t.label + ' panel shown';
    if(location.hash.slice(1) !== btns[i].t.id) history.replaceState(null,'','#'+btns[i].t.id);
  }
  btns.forEach(function(o, i){
    o.btn.addEventListener('click', function(){ select(i); });
    o.btn.addEventListener('keydown', function(e){
      var n = null;
      if(e.key==='ArrowRight') n = (i+1)%btns.length;
      else if(e.key==='ArrowLeft') n = (i-1+btns.length)%btns.length;
      else if(e.key==='Home') n = 0;
      else if(e.key==='End') n = btns.length-1;
      if(n!==null){ e.preventDefault(); select(n); }
    });
  });
  var h = location.hash.slice(1);
  if(h){ for(var i=0;i<TABS.length;i++){ if(TABS[i].id===h){ select(i); break; } } }

  /* ---------- copy-prompt ---------- */
  var PROMPT =
    'Fix the three highest-severity findings from the 2026-08-08 CC convergence audit, in this order, each as its own commit on a feature branch:\n\n' +
    '1. Delete the /goal abort-if clause. It is a syntax no Claude Code version has ever supported (0 hits in the 2.1.226 binary, 0 across 357 changelogs, 27 across ork skills), and because CC allows one goal per session with replace-on-set, the second line replaces the first and silently discards the user acceptance criteria. Fold the budget into the single condition. Files: src/skills/prd-to-goal/SKILL.md:73, its references/recipe-library.md (line 12 policy plus the 8 recipes), src/skills/chain-patterns/references/assertion-grader.md, src/skills/verify/references/streak-gate.md. Verify grep -rc "abort-if" src/skills returns 0.\n\n' +
    '2. Fix src/hooks/src/lifecycle/session-registrar.ts:246-247, which ships a remediation command recommending a sibling worktree path. CLAUDE.md documents that the cd silently bounces back to the project root, which is the idiom behind platform#9870. Replace with the worktree-new.sh helper form.\n\n' +
    '3. Turn on the sandbox. src/settings/ork.settings.json:77-125 declares a full policy with no "enabled" key, and ~/.claude/settings.json has no sandbox block at all while carrying skipDangerousModePermissionPrompt and skipAutoPermissionPrompt. Add "enabled": true in both, and add Read(...) denies for the 5 credential paths to permissions.deny, which today holds 21 rules and 0 Read rules. Confirm with claude --debug that the seatbelt profile loads before relaxing any regex guard.\n\n' +
    'Run npm test and npm run typecheck. Do not claim done without pasting the suite summary lines.';
  document.getElementById('copyhint').textContent =
    'Copies a ready prompt for the three highest-severity fixes, with the evidence inline.';
  var cb = document.getElementById('copybtn');
  cb.addEventListener('click', function(){
    navigator.clipboard.writeText(PROMPT).then(function(){
      cb.textContent = '✓ Copied';
      live.textContent = 'Fix prompt copied to clipboard';
      setTimeout(function(){ cb.textContent = 'Copy fix prompt'; }, 1500);
    });
  });
})();
</script>

      "id": "bugs",
      "label": "Bugs",
      "intro": "Four criticals in full, then the highs. Critical 1 is not hypothetical: it destroyed a concurrent live session's Claude Code task list on this machine during the audit.",
      "sections": [
        {
          "id": "b-crit", "no": "0", "title": "Criticals", "count": "4", "open": true,
          "blocks": [
            { "t": "cards", "one": true, "items": [
              { "tag": "critical", "title": "C1 - stale-team-cleanup destroyed a live session's task list", "dl": [
                ["what happened", "At SessionStart, cleanup deleted the CC task directories belonging to a DIFFERENT, concurrently running session. 375 task dirs sat behind 6 team configs with 10 concurrent sessions on the machine."],
                ["misfire path 1", "A missing config.json meant delete at ANY age, which races a session in the window between mkdir and the first write."],
                ["misfire path 2", "Age was read from the directory's OWN mtime, which never moves when a nested file is written. An actively-used dir looks ancient."],
                ["misfire path 3", "A catch block turned an unreadable directory into a delete."],
                ["status", "FIXED in PR #3305. 3 tests failed on the old code, 6 passed on the new, later 10 passed after the logging fix."]
              ]},
              { "tag": "critical", "title": "C2 - a complete sandbox policy that is inert", "dl": [
                ["what happened", "A full sandbox policy authored in CC's own schema, with the 'enabled' key ABSENT. The file parses; the policy never applies."],
                ["blast radius", "20 denied exfiltration domains and 5 credential denies, all dead."],
                ["compounding", "permissions.deny holds 21 rules of which 0 are Read(...), so nothing blocks reading ~/.ssh/id_rsa. skipDangerousModePermissionPrompt is true."],
                ["why it scores F", "This is the exact shape of the root cause: the artifact is correct, well-formed, and reviewed, and has never once run."]
              ]},
              { "tag": "critical", "title": "C3 - /goal abort-if discards the user's acceptance criteria", "dl": [
                ["what happened", "CC allows ONE goal per session with replace-on-set semantics. OrchestKit's recipes emit a second /goal line, which REPLACES the first and silently discards the acceptance criteria the user just wrote."],
                ["blast radius", "Hardened into policy across 8 shipped recipes, so the failure was taught, not accidental."],
                ["related", "abort-if itself has 0 hits in the binary and 0 in 357 changelogs. The syntax never existed at any version."]
              ]},
              { "tag": "critical", "title": "C4 - the subagent spawn cap has never fired", "dl": [
                ["what happened", "context-gate's DENY branch is structurally dead, so the cap it advertises has never once fired."],
                ["compounding", "Its escape valve tests two paths, neither of which is the layout the operator actually mandates, so even the intended bypass is aimed at nothing."],
                ["replacement", "CC ships CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH. Adopting it retires both the dead deny hook and the prose budget that stood in for it."]
              ]}
            ]}
          ]
        },
        {

        {
          "id": "b-test", "no": "2", "title": "The test that proved the bug", "count": "103 passing", "open": true,
          "blocks": [
            { "t": "p", "text": "[[103 unit tests pass on a permission-mode helper that is dead in production.]] CC serialises the envelope key as snake_case [[permission_mode]]. There are 0 camelCase occurrences in the envelope literal or in the schema, confirmed against 366,187 strings dumped from the binary. The helper compares camelCase, so isDontAskMode and isAutoMode had NEVER returned true." },
            { "t": "p", "text": "The tests pass because their fixtures were hand-written in camelCase too. [[The suite did not miss the bug; it encoded it.]] A green suite over a self-authored fixture measures agreement between two files the same author wrote, not agreement with the runtime." },
            { "t": "p", "text": "This is the single strongest argument for move B. No amount of unit-test coverage catches a contract error when the fixture and the code share an author and neither has seen the binary." }
          ]
        }

<script>
(() => {
  'use strict';
  const S = JSON.parse(document.getElementById('audit-state').textContent);
  const live = document.getElementById('av-live');
  const say = (m) => { live.textContent = m; };

  // --- DOM builders. textContent only: state never becomes markup. ---
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = String(text);
    return n;
  };
  const svgEl = (tag, attrs) => {
    const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const k in attrs) n.setAttribute(k, String(attrs[k]));
    return n;
  };

  // Inline emphasis without innerHTML: split on <b>...</b> markers only.
  // Everything else in the string stays literal text.
  const rich = (parent, text) => {
    const parts = String(text).split(/(\[\[|\]\])/);
    let bold = false;
    parts.forEach((p) => {
      if (p === '[[') { bold = true; return; }
      if (p === ']]') { bold = false; return; }
      if (!p) return;
      if (bold) parent.append(el('b', null, p));
      else parent.append(document.createTextNode(p));
    });
    return parent;
  };

  // ------------------------------------------------------------------ tier 1
  document.getElementById('av-title').textContent = S.title;
  document.getElementById('av-issue').textContent = S.issue || '';
  document.getElementById('av-grade').textContent = 'grade ' + S.grade;
  document.title = S.title;

  const facts = document.getElementById('av-facts');
  (S.facts || []).forEach((f) => {
    const n = el('span', 'fact' + (f.cls ? ' ' + f.cls : ''));
    n.append(f.label + ' ', el('b', null, f.value));
    facts.append(n);
  });
  document.getElementById('av-branch').textContent =
    S.branch + ' to ' + S.base + '   |   updated ' + S.updated + '   |   evidence: ' + S.evidence;

  // ------------------------------------------------------------- block types
  const blocks = {
    p(parent, b) { parent.append(rich(el('p', 'body'), b.text)); },

    list(parent, b) {
      const ul = el('ul', 'pts' + (b.cls ? ' ' + b.cls : ''));
      (b.items || []).forEach((t) => ul.append(rich(el('li'), t)));
      parent.append(ul);
    },

    tiles(parent, b) {
      const g = el('div', 'kpis');
      (b.items || []).forEach((k) => {
        const tile = el('div', 'kpi');
        tile.append(el('b', k.cls || null, k.v), el('span', null, k.label));
        g.append(tile);
      });
      parent.append(g);
    },

    table(parent, b) { parent.append(buildTable(b.cols, b.rows)); },

    cards(parent, b) {
      const g = el('div', 'cards' + (b.one ? ' one' : ''));
      (b.items || []).forEach((c) => {
        const card = el('div', 'card');
        const hd = el('h4');
        if (c.tag) hd.append(el('span', 'sev ' + c.tag, c.tagText || c.tag));
        hd.append(el('span', null, c.title));
        card.append(hd);
        if ((c.dl || []).length) {
          const dl = el('dl');
          c.dl.forEach(([k, v]) => { dl.append(el('dt', null, k), rich(el('dd'), v)); });
          card.append(dl);
        }
        g.append(card);
      });
      parent.append(g);
    },

    ba(parent, b) {
      const grid = el('div', 'ba');
      const MARK = { add: '[+]', chg: '[~]', del: '[-]', same: '   ' };
      const col = (heading, nodes, cls) => {
        const c = el('div', 'col' + (cls ? ' ' + cls : ''));
        c.append(el('h3', null, heading));
        (nodes || []).forEach((n) => {
          const row = el('div', 'node ' + (n.mark || 'same'));
          row.append(el('span', 'mk', MARK[n.mark] || MARK.same), el('span', 'mono', n.node));
          c.append(row);
        });
        return c;
      };
      grid.append(col(b.beforeTitle || 'Before', b.before, 'before'),
                  el('div', 'arrow', '→'),
                  col(b.afterTitle || 'After', b.after, 'after'));
      parent.append(grid);
    },

    mermaid(parent, b) {
      const d = el('details', 'mmd');
      const sm = el('summary', null, 'Mermaid source (renders on GitHub and the docs site)');
      d.append(sm);
      const body = el('div', 'mmdbody');
      const pre = el('pre', 'mono', b.code);
      const btn = el('button', 'copy', 'Copy Mermaid');
      btn.type = 'button';
      btn.addEventListener('click', () => copyText(b.code, btn, 'Mermaid source copied'));
      body.append(pre, btn);
      d.append(body);
      parent.append(d);
    },

    chart(parent, b) {
      const cols = [
        { k: 'label', label: b.colLabel || 'Item' },
        { k: 'value', label: b.valLabel || 'Value', num: true },
        { k: 'note', label: 'Detail', cls: 'muted' }
      ];
      withTwin(parent, b.label,
        (host) => drawBars(host, b),
        (host) => host.append(buildTable(cols, b.rows)));
    },

    empty(parent, b) { parent.append(el('p', 'empty', b.text)); }
  };

  function buildTable(cols, rows) {
    const wrap = el('div', 'wrapscroll');
    const tb = el('table');
    const thead = el('thead'); const hr = el('tr');
    cols.forEach((c) => hr.append(el('th', c.num ? 'num' : null, c.label)));
    thead.append(hr); tb.append(thead);
    const body = el('tbody');
    (rows || []).forEach((r) => {
      const tr = el('tr');
      cols.forEach((c) => {
        const classes = [c.num ? 'num' : '', c.cls || ''].filter(Boolean).join(' ');
        const v = r[c.k];
        tr.append(el('td', classes || null, v == null || v === '' ? 'n/a' : v));
      });
      body.append(tr);
    });
    tb.append(body); wrap.append(tb);
    return wrap;
  }

  // The table twin is mandatory: it is the relief channel the chart-encoding
  // standard obligates and the fallback when a chart cannot be read.
  function withTwin(parent, label, drawChart, buildTwin) {
    const toggle = el('div', 'viewtoggle');
    const bC = el('button', null, 'Chart'); bC.type = 'button';
    const bT = el('button', null, 'Table'); bT.type = 'button';
    const chart = el('div', 'chart');
    const table = el('div', 'twin');
    drawChart(chart); buildTwin(table);
    const show = (isChart) => {
      chart.hidden = !isChart; table.hidden = isChart;
      bC.setAttribute('aria-pressed', String(isChart));
      bT.setAttribute('aria-pressed', String(!isChart));
      say(label + ': ' + (isChart ? 'chart' : 'table') + ' view');
    };
    bC.addEventListener('click', () => show(true));
    bT.addEventListener('click', () => show(false));
    toggle.append(bC, bT);
    parent.append(toggle, chart, table);
    show(true);
  }

  // Horizontal categorical bars. One class per row, so a bar is the right form.
  function drawBars(host, b) {
    const rows = b.rows || [];
    const max = b.max || Math.max(1, ...rows.map((r) => r.value || 0));
    const rowH = 34, padL = 210, padR = 90, w = 960;
    const svg = svgEl('svg', {
      viewBox: '0 0 ' + w + ' ' + (rows.length * rowH + 14),
      role: 'img',
      'aria-label': b.label + ', measured in ' + (b.unit || 'units') + '. Same data in the table view.'
    });
    rows.forEach((r, i) => {
      const y = i * rowH + 6;
      const bw = Math.round(((r.value || 0) / max) * (w - padL - padR));
      const lab = svgEl('text', { x: padL - 12, y: y + 17, 'text-anchor': 'end', class: 'lbl' });
      const MAXLBL = 30;
      lab.textContent = r.label.length > MAXLBL ? r.label.slice(0, MAXLBL - 1) + '…' : r.label;
      if (r.label.length > MAXLBL) {
        const full = svgEl('title', {}); full.textContent = r.label; lab.append(full);
      }
      svg.append(lab);
      svg.append(svgEl('rect', { x: padL, y: y + 5, width: Math.max(bw, 2), height: 18, rx: 4,
                                 fill: b.color || 'var(--series-1)' }));
      const v = svgEl('text', { x: padL + Math.max(bw, 2) + 10, y: y + 19 });
      v.textContent = String(r.value) + (b.max === 100 ? '%' : '');
      svg.append(v);
    });
    host.append(svg);
    const lg = el('div', 'legend');
    const sp = el('span'); const sw = el('i'); sw.style.background = b.color || 'var(--series-1)';
    sp.append(sw, document.createTextNode(b.unit || 'units'));
    lg.append(sp);
    host.append(lg);
  }

  // --------------------------------------------------------- tabs and panels
  const tabsHost = document.getElementById('av-tabs');
  const panelsHost = document.getElementById('av-panels');
  const tabs = S.tabs || [];
  const tabButtons = [];
  const panels = [];

  tabs.forEach((t, i) => {
    const btn = el('button');
    btn.type = 'button';
    btn.id = 'tab-' + t.id;
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-controls', 'panel-' + t.id);
    btn.setAttribute('aria-selected', 'false');
    btn.tabIndex = -1;
    btn.append(el('span', 'tno', String(i + 1)), document.createTextNode(t.label));
    tabsHost.append(btn);
    tabButtons.push(btn);

    const panel = el('section', 'panel');
    panel.id = 'panel-' + t.id;
    panel.setAttribute('role', 'tabpanel');
    panel.setAttribute('aria-labelledby', 'tab-' + t.id);
    panel.tabIndex = 0;
    panel.hidden = true;
    if (t.intro) panel.append(rich(el('p', 'panelhead'), t.intro));

    (t.sections || []).forEach((sec) => {
      const d = el('details', 'sec glass');
      d.id = sec.id;
      if (sec.open) d.open = true;
      const sm = el('summary');
      sm.append(el('span', 'secno', '[' + sec.no + ']'), el('h2', null, sec.title));
      if (sec.count) sm.append(el('span', 'seccount', sec.count));
      d.append(sm);
      const body = el('div', 'secbody');
      const list = sec.blocks || [];
      if (!list.length) {
        body.append(el('p', 'empty', 'Nothing measured for this section, so it is left empty rather than padded.'));
      }
      list.forEach((b) => {
        const fn = blocks[b.t];
        if (fn) fn(body, b);
      });
      d.append(body);
      panel.append(d);
    });

    panelsHost.append(panel);
    panels.push(panel);
  });

  let current = 0;
  function select(i, opts) {
    const o = opts || {};
    current = Math.max(0, Math.min(i, tabs.length - 1));
    tabButtons.forEach((b, j) => {
      const on = j === current;
      b.setAttribute('aria-selected', String(on));
      b.tabIndex = on ? 0 : -1;
      panels[j].hidden = !on;
    });
    if (o.focus) tabButtons[current].focus();
    if (o.hash !== false) {
      const h = '#' + tabs[current].id;
      if (location.hash !== h) history.replaceState(null, '', h);
    }
    if (o.announce !== false) say(tabs[current].label + ' tab, ' + (current + 1) + ' of ' + tabs.length);
  }

  tabButtons.forEach((b, i) => b.addEventListener('click', () => select(i)));
  tabsHost.addEventListener('keydown', (e) => {
    let next = null;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next = (current + 1) % tabs.length;
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') next = (current - 1 + tabs.length) % tabs.length;
    else if (e.key === 'Home') next = 0;
    else if (e.key === 'End') next = tabs.length - 1;
    if (next === null) return;
    e.preventDefault();
    select(next, { focus: true });
  });

  // #hash deep-linking: a tab id, or a section id inside a tab.
  function fromHash(announce) {
    const raw = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    if (!raw) { select(0, { hash: false, announce: false }); return; }
    const byTab = tabs.findIndex((t) => t.id === raw);
    if (byTab >= 0) { select(byTab, { hash: false, announce: announce }); return; }
    for (let i = 0; i < tabs.length; i++) {
      const sec = (tabs[i].sections || []).find((s) => s.id === raw);
      if (sec) {
        select(i, { hash: false, announce: announce });
        const node = document.getElementById(raw);
        if (node) { node.open = true; node.scrollIntoView({ block: 'start' }); }
        return;
      }
    }
    select(0, { hash: false, announce: false });
  }
  window.addEventListener('hashchange', () => fromHash(true));
  fromHash(false);

  // ------------------------------------------------- copy: 1 click, no modal
  function copyText(text, btn, msg) {
    const was = btn.textContent;
    const done = () => {
      btn.textContent = '✓ Copied';
      say(msg);
      setTimeout(() => { btn.textContent = was; }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, done);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.append(ta); ta.select();
      try { document.execCommand('copy'); } catch (err) { /* selection is the fallback */ }
      ta.remove(); done();
    }
  }

  const promptText = S.prompt;
  document.getElementById('av-prompt').textContent = promptText;
  const copyBtn = document.getElementById('av-copy');
  copyBtn.addEventListener('click', () => copyText(promptText, copyBtn, 'Prompt copied to clipboard'));
})();
</script>
</body>
</html>

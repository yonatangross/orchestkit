<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two small OrchestKit fixes, before and after</title>
<meta name="description" content="Pick a Codex hook command or a docs MCP query and compare what OrchestKit did with it before and after these fixes.">
<style>
  :root{--bg:#0f1117;--panel:#161922;--edge:#272b38;--ink:#e8eaf2;--dim:#9aa3b8;--ok:#4ade80;--bad:#f87171;--accent:#7dd3fc;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
  *{box-sizing:border-box}
  body{margin:0;padding:2.5rem 1.25rem;background:var(--bg);color:var(--ink);font-family:var(--mono);line-height:1.6}
  main{max-width:56rem;margin-inline:auto}
  h1{font-size:1.35rem;margin:0 0 .3rem}
  .sub{color:var(--dim);margin:0 0 2rem;font-size:.85rem}
  section{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:1.2rem 1.4rem;margin-block:1.1rem}
  h2{font-size:.9rem;margin:0 0 .9rem;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
  label{display:block;color:var(--dim);font-size:.8rem;margin-top:.6rem}
  select{width:100%;background:#0b0d13;color:var(--ink);border:1px solid var(--edge);border-radius:6px;padding:.35rem .5rem;font-family:inherit}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:1rem}
  @media (max-width:640px){.grid{grid-template-columns:1fr}}
  .out{padding:.6rem .8rem;background:#0b0d13;border:1px solid var(--edge);border-radius:6px;font-size:.8rem;min-height:5rem}
  .ok{color:var(--ok)} .bad{color:var(--bad)}
  h3{font-size:.75rem;margin:0 0 .3rem;color:var(--dim);font-weight:400}
</style>
</head>
<body><main>
<h1>Two small OrchestKit fixes, before and after</h1>
<p class="sub">Branch fix/wave1-small-bugs, 2026-11-08. A Codex hook that shipped with a placeholder path, and a docs search that treated a bad query as no query.</p>
<section><h2>Pick a case</h2>
<label for="pick">Case</label>
<select id="pick"></select>
<div class="grid">
  <div><h3>Before</h3><div class="out bad" id="before"></div></div>
  <div><h3>Now</h3><div class="out ok" id="after"></div></div>
</div>
</section>
<script>
const CASES = [
  { name: 'Codex trusts the observer hook', before: 'Runs a command with a placeholder path. The file does not exist, so the hook fails.', after: 'Runs the hook from the plugin folder. It exits at once unless JEV_SHADOW_ROOT is set, so it stays off by default.' },
  { name: 'Docs MCP: query is a number', before: 'The bad value was treated as no filter, and every skill came back as a success.', after: 'Returns an input error saying query must be a string.' },
  { name: 'Docs MCP: query is text', before: 'Filters skills by name and description.', after: 'Unchanged.' },
  { name: 'Docs MCP: no query', before: 'Lists every skill.', after: 'Unchanged.' },
];
const pick = document.getElementById('pick');
pick.replaceChildren(...CASES.map((c, i) => new Option(c.name, String(i))));
function show() {
  const c = CASES[Number(pick.value)];
  document.getElementById('before').textContent = c.before;
  document.getElementById('after').textContent = c.after;
}
pick.addEventListener('change', show);
show();
</script>
</main></body>
</html>

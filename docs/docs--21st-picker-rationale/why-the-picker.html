<!-- Generated by OrchestKit Claude Plugin - 2026-08-16 -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why the picker — rationale vs constraint</title>
<style>
  :root{--bg:#0c0e12;--panel:#14171d;--panel2:#1a1e26;--line:#252b36;--ink:#e9eef7;
        --dim:#93a0b4;--acc:#7cc4ff;--ok:#5ddc9a;--warn:#ffc46b;--bad:#ff8f8f;
        --mono:ui-monospace,SFMono-Regular,Menlo,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.6 -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}
  header{padding:20px 24px 10px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 4px;font-size:19px} .sub{margin:0;color:var(--dim);font-size:13px}
  .wrap{display:grid;grid-template-columns:290px 1fr;gap:20px;padding:20px 24px 30px;
        max-width:1200px;margin:0 auto;align-items:start}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h2{margin:0 0 12px;font-size:12px;letter-spacing:.7px;text-transform:uppercase;color:var(--dim)}
  .row{display:flex;align-items:center;gap:8px;margin:9px 0}
  input[type=checkbox]{accent-color:var(--acc);width:15px;height:15px}
  input[type=range]{width:100%;accent-color:var(--acc)}
  label{font-size:13px}
  .presets{display:flex;flex-wrap:wrap;gap:6px}
  button{background:#212a36;color:var(--ink);border:1px solid #32404f;border-radius:7px;
         padding:6px 11px;font:600 12px inherit;cursor:pointer}
  button:hover{background:#2a3644} button.on{background:#1e4d7a;border-color:#2c6ba5}
  .val{float:right;font-family:var(--mono);font-size:12px}
  .cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:4px}
  .cand{border:1px solid var(--line);border-radius:9px;padding:9px;background:var(--panel2);font-size:12px}
  .cand.pick{border-color:#2c6ba5;background:#16263a}
  .cand.wrong{border-color:#6b2f2f;background:#2c1a1a}
  .cand .n{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
  .verdict{margin-top:14px;padding:11px 13px;border-radius:9px;font-size:13px}
  .verdict.good{background:#12281f;border:1px solid #1f4a37;color:var(--ok)}
  .verdict.bad{background:#2c1a1a;border:1px solid #5a2b2b;color:var(--bad)}
  .tier{margin-top:12px;font-size:12.5px;color:var(--dim)}
  .tier b{color:var(--ink);font-family:var(--mono)}
  .prompt{margin:0 24px 40px;max-width:1200px;background:var(--panel);
          border:1px solid var(--line);border-radius:12px;padding:16px}
  .prompt h2{margin:0 0 10px;font-size:12px;letter-spacing:.7px;text-transform:uppercase;color:var(--dim)}
  #promptText{white-space:pre-wrap;font-family:var(--mono);font-size:12.5px;
              background:#0e1116;border:1px solid var(--line);border-radius:8px;padding:12px}
</style>
</head>
<body>
<header>
  <h1>Why the picker</h1>
  <p class="sub">orchestkit — the flow's reason is <em>choice</em>, not cost. Flip the tier and watch which argument survives.</p>
</header>

<div class="wrap">
  <div class="card">
    <h2>Presets</h2>
    <div class="presets">
      <button data-p="freeGuess">Free + model guesses</button>
      <button data-p="freePick">Free + user picks</button>
      <button data-p="paidGuess">Paid + model guesses</button>
      <button data-p="paidPick">Paid + user picks</button>
    </div>

    <h2 style="margin-top:20px">Flow</h2>
    <div class="row"><input type="checkbox" id="picker"><label for="picker">Use <code>search_picker</code> (user picks)</label></div>
    <label>Candidates returned <span class="val" id="vN">8</span></label>
    <input type="range" id="n" min="2" max="12" value="8">
    <label>Which one the user actually wanted <span class="val" id="vW">4</span></label>
    <input type="range" id="want" min="1" max="12" value="4">

    <h2 style="margin-top:20px">Account tier</h2>
    <div class="presets">
      <button data-t="free" class="on">free</button>
      <button data-t="paid">paid</button>
    </div>
    <div class="tier" id="tierNote"></div>
  </div>

  <div>
    <div class="card">
      <h2>Search results</h2>
      <div class="cands" id="cands"></div>
      <div class="verdict" id="verdict"></div>
    </div>
    <div class="card" style="margin-top:16px">
      <h2>Which argument still holds?</h2>
      <div id="args"></div>
    </div>
  </div>
</div>

<div class="prompt">
  <h2>Prompt <button id="copy" style="float:right">Copy</button></h2>
  <div id="promptText"></div>
</div>

<script>
const DEF = {picker:false, n:8, want:4, tier:'free'};
const state = {...DEF};
const $ = id => document.getElementById(id);

function render(){
  // the model, guessing, always takes the top-ranked result
  const guess = 1;
  const hit = state.picker || guess === state.want;
  let html = '';
  for(let i=1;i<=state.n;i++){
    let cls = '';
    if(state.picker && i===state.want) cls='pick';
    else if(!state.picker && i===1) cls = (i===state.want?'pick':'wrong');
    html += `<div class="cand ${cls}">
      <div class="n">#${i}</div>command palette ${i}
      ${state.picker && i===state.want ? '<div style="color:#7cc4ff">user picked</div>' : ''}
      ${!state.picker && i===1 ? `<div style="color:${i===state.want?'#5ddc9a':'#ff8f8f'}">model guessed</div>` : ''}
    </div>`;
  }
  $('cands').innerHTML = html;

  const v = $('verdict');
  if(state.picker){
    v.className='verdict good';
    v.textContent = `The user chose #${state.want}. Correct by construction — no guessing involved.`;
  } else if(hit){
    v.className='verdict good';
    v.textContent = `The model guessed #1 and happened to be right. It had a 1-in-${state.n} chance.`;
  } else {
    v.className='verdict bad';
    v.textContent = `The model guessed #1; the user wanted #${state.want}. Wrong component retrieved — and on a paid tier nothing stops it, because cost was never the guard.`;
  }

  const unlimited = state.tier === 'paid';
  $('tierNote').innerHTML = unlimited
    ? 'get_usage → <b>tier=paid</b>, freeRetrievalsRemaining <b>null</b> (unlimited)'
    : 'get_usage → <b>tier=free</b>, <b>2</b> retrievals/day';

  $('args').innerHTML = `
    <div style="margin-bottom:8px">💰 <b>Cost argument</b> — "browse free, spend one retrieval":
      ${unlimited ? '<span style="color:#ff8f8f">DEAD on this tier</span>' : '<span style="color:#5ddc9a">holds (2/day)</span>'}</div>
    <div>🎯 <b>Choice argument</b> — "the user recognises the right one, the model cannot":
      <span style="color:#5ddc9a">holds on every tier</span></div>
    <div style="margin-top:10px;color:#93a0b4;font-size:12.5px">
      The original SKILL.md argued the flow from cost alone, so it read as obsolete the
      moment the account went paid. Rewritten to lead with choice and demote metering to
      a "call <code>get_usage</code>, don't assume" footnote.</div>`;

  const p = [];
  p.push(state.picker
    ? "Keep component-search on search_picker -> user picks -> get_component."
    : `Without search_picker the model retrieves the top-ranked result; here the user wanted #${state.want} of ${state.n}.`);
  p.push(unlimited
    ? "On a paid tier the metering argument for browsing first no longer applies — the picker must be justified by user choice, not cost."
    : "On the free tier get_component is capped at 2/day, so a wrong guess also costs half the day's budget.");
  p.push("Call get_usage to read tier and freeRetrievalsRemaining rather than hardcoding a cap.");
  $('promptText').textContent = p.join('\n\n');
}

$('picker').addEventListener('change', e => { state.picker = e.target.checked; render(); });
$('n').addEventListener('input', e => { state.n = +e.target.value; $('vN').textContent = e.target.value;
  if(state.want > state.n){ state.want = state.n; $('want').value = state.n; $('vW').textContent = state.n; } render(); });
$('want').addEventListener('input', e => { state.want = Math.min(+e.target.value, state.n);
  $('vW').textContent = state.want; e.target.value = state.want; render(); });
document.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => {
  state.tier = b.dataset.t;
  document.querySelectorAll('[data-t]').forEach(x => x.classList.toggle('on', x===b));
  render();
}));
const P = {
  freeGuess:{picker:false,n:8,want:4,tier:'free'}, freePick:{picker:true,n:8,want:4,tier:'free'},
  paidGuess:{picker:false,n:8,want:4,tier:'paid'}, paidPick:{picker:true,n:8,want:4,tier:'paid'},
};
document.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => {
  Object.assign(state, P[b.dataset.p]);
  $('picker').checked = state.picker; $('n').value = state.n; $('vN').textContent = state.n;
  $('want').value = state.want; $('vW').textContent = state.want;
  document.querySelectorAll('[data-t]').forEach(x => x.classList.toggle('on', x.dataset.t===state.tier));
  render();
}));
$('copy').addEventListener('click', () => {
  navigator.clipboard.writeText($('promptText').textContent);
  const o=$('copy').textContent; $('copy').textContent='Copied!';
  setTimeout(()=>$('copy').textContent=o,1200);
});
render();
</script>
</body>
</html>

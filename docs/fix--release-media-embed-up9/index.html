<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Release notes that show their media</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#16181d; --mute:#5b6270; --line:#d9dce3; --stop:#b42318; --card:#f6f7f9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#101216; --fg:#e8eaf0; --mute:#9aa2b1; --line:#2b303a; --stop:#ff8a7a; --card:#181b21; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:820px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; } .mute { color:var(--mute); }
  label { display:inline-flex; gap:6px; align-items:center; margin:0 16px 8px 0; }
  pre { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:12px; white-space:pre-wrap; overflow-wrap:anywhere; }
  pre.stop { color:var(--stop); }
  button { font:inherit; padding:6px 14px; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:6px; cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>Release notes that show their media</h1>
  <p class="mute">A model of the new workflow step. Untick an asset to see the step fail.</p>
  <div id="assets"></div>
  <pre id="out" aria-live="polite"></pre>
  <button id="copy" type="button">Copy as prompt</button> <span id="copied" class="mute" role="status"></span>
</main>
<script>
  const names = ['release-1.2.3-preview.gif', 'release-1.2.3-landscape.mp4', 'release-1.2.3-square.mp4'];
  const box = document.getElementById('assets');
  const out = document.getElementById('out');
  for (const name of names) {
    const label = document.createElement('label');
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = true;
    input.value = name;
    input.addEventListener('change', draw);
    label.append(input, name);
    box.append(label);
  }
  function missing() { return [...box.querySelectorAll('input')].filter(i => !i.checked).map(i => i.value); }
  function draw() {
    const gone = missing();
    out.className = gone.length ? 'stop' : '';
    out.textContent = gone.length
      ? 'The step fails and the notes stay as they were:\nrelease asset ' + gone[0] + ' is missing, empty or not uploaded'
      : '![Release v1.2.3 preview](.../' + names[0] + ')\n\nVideo: [landscape mp4](.../' + names[1] + ') · [square mp4](.../' + names[2] + ')\n\n## 1.2.3 (the notes, unchanged)';
  }
  document.getElementById('copy').addEventListener('click', async () => {
    const text = 'Check scripts/ci/release-media-body.mjs with these assets missing: ' + (missing().join(', ') || 'none');
    try { await navigator.clipboard.writeText(text); document.getElementById('copied').textContent = 'Copied'; }
    catch { document.getElementById('copied').textContent = text; }
  });
  draw();
</script>
</body>
</html>

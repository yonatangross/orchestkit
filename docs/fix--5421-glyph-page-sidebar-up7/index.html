<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glyph page sidebar: thin rail vs chip row (#5421)</title>
<style>
  /* Root variables and the sidebar block are copied from
     src/skills/glyph/templates/explainer.html at this PR's head, so the
     demo shows the shipped CSS, not a re-draw of it. */
  :root{
    --ink:#1a1a1a; --muted:#6b6b6b; --line:#e2e2e2; --bg:#fbfbf9;
    --accent:#2f6f4e; --warn:#b45309; --stop:#b91c1c; --soft:#eef4f0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:17px/1.6 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;}
  .wrap{max-width:820px;margin:0 auto;padding:64px 24px 96px}

  .layout{display:grid;grid-template-columns:168px minmax(0,1fr);gap:22px;
          max-width:1040px;margin:0 auto;padding:0 24px}
  .layout .wrap{padding-left:0;padding-right:0;margin:0}
  .rail{position:sticky;top:12px;align-self:start;width:168px;margin-top:64px;
        max-height:calc(100vh - 24px);overflow-y:auto;font-size:12.5px;line-height:1.3}
  .rail a{display:block;font-size:12.5px;padding:4px 8px;border-radius:6px;
          color:var(--muted);text-decoration:none}
  .rail a:hover,.rail a[aria-current="true"]{color:var(--ink);background:var(--soft)}
  .rail.chips{position:static;width:auto;max-height:none;overflow:visible;
              display:flex;flex-wrap:wrap;gap:6px;margin:24px 0 0}
  .rail.chips a{border:1px solid var(--line);border-radius:999px}
  .layout.wide{display:block;max-width:820px}
  @media(max-width:900px){.layout{display:block}
    .rail{position:static;width:auto;max-height:none;display:flex;flex-wrap:wrap;gap:6px;margin:24px 0 0}
    .rail a{border:1px solid var(--line);border-radius:999px}}

  /* playground chrome only */
  .bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);
       padding:10px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
  .bar button{font:inherit;padding:6px 12px;border:1px solid var(--line);border-radius:8px;
              background:#fff;cursor:pointer}
  .bar button[aria-pressed="true"]{background:var(--soft);border-color:var(--accent)}
  .bar .note{color:var(--muted)}
  .measure{font:13px ui-monospace,Menlo,monospace;color:var(--accent)}
  h1{font-size:clamp(28px,5vw,42px);line-height:1.1;margin:0 0 12px}
  section{padding:28px 0;border-top:1px solid var(--line)}
  section h2{margin:0 0 8px;font-size:22px}
  section p{margin:0;color:var(--muted)}
</style>
</head>
<body>
<div class="bar">
  <strong>#5421 glyph page sidebar</strong>
  <button id="b12" aria-pressed="true">12 sections: thin rail</button>
  <button id="b13" aria-pressed="false">13 sections: chip row</button>
  <span class="measure" id="m"></span>
  <span class="note">Resize under 900 px: the rail folds into chips too.</span>
</div>
<div id="root"></div>
<script>
  var topics = ['Why it matters','The old rail','What went wrong','The width limit',
    'The link size','The height limit','Scrolling on its own','The chip row',
    'When to switch','Small screens','How it is tested','What stays the same','One more section'];
  function render(n){
    var links = '', body = '';
    for (var i = 0; i < n; i++){
      links += '<a href="#s' + i + '"' + (i === 0 ? ' aria-current="true"' : '') + '>' + (i + 1) + '. ' + topics[i] + '</a>';
      body += '<section id="s' + i + '"><h2>' + (i + 1) + '. ' + topics[i] + '</h2>' +
        '<p>Body text for section ' + (i + 1) + '. The content column keeps its full reading width; the index never becomes a second column of content.</p></section>';
    }
    var head = '<h1>' + n + '-section page</h1><p class="lede">' +
      (n <= 12 ? 'Up to 12 sections: a sticky rail, at most 170 px wide, never taller than the screen.'
               : 'Past 12 sections: one wrapping chip row above the content, no column.') + '</p>';
    var html = n <= 12
      ? '<div class="layout"><nav class="rail" aria-label="Sections">' + links + '</nav><div class="wrap">' + head + body + '</div></div>'
      : '<div class="layout wide"><div class="wrap">' + head + '<nav class="rail chips" aria-label="Sections">' + links + '</nav>' + body + '</div></div>';
    document.getElementById('root').innerHTML = html;
    document.getElementById('b12').setAttribute('aria-pressed', String(n === 12));
    document.getElementById('b13').setAttribute('aria-pressed', String(n === 13));
    var rail = document.querySelector('.rail'), a = rail.querySelector('a');
    var r = rail.getBoundingClientRect();
    document.getElementById('m').textContent = 'rail ' + Math.round(r.width) + ' x ' + Math.round(r.height) +
      ' px, viewport h ' + window.innerHeight + ', link ' + getComputedStyle(a).fontSize;
  }
  document.getElementById('b12').onclick = function(){ render(12); };
  document.getElementById('b13').onclick = function(){ render(13); };
  render(12);
</script>
</body>
</html>

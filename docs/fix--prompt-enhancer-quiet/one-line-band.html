<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Prompt Enhancer 0.1.2: one line until there is something to review</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#f4f5f7;color:#14161a;font:15px/1.55 -apple-system,Segoe UI,Inter,sans-serif}
main{max-width:860px;margin:0 auto;padding:40px 20px}
.card{background:#fff;border:1px solid #e2e5ea;border-radius:12px;padding:16px 18px;margin:12px 0}
.term{background:#161b26;color:#e8ecf1;border-radius:10px;padding:12px 14px;font:12.5px/1.6 ui-monospace,Menlo,monospace;white-space:pre-wrap}
code{font:12.5px ui-monospace,Menlo,monospace;background:#f0f2f5;padding:1px 5px;border-radius:4px}
fieldset{border:0;padding:0;margin:8px 0}
label{margin-right:14px}
</style></head><body><main>
<h1>Prompt Enhancer 0.1.2: one line until there is something to review</h1>
<p>0.1.1 drew four lines above the prompt on every screen and never passed <code>await next(e)</code>, so other mods' bands disappeared. 0.1.2 starts as one line, opens itself when a rewrite is ready, and keeps the band below it.</p>
<div class="card">
<fieldset>state
<label><input type="radio" name="s" value="idle" checked> idle</label>
<label><input type="radio" name="s" value="review"> a rewrite waits for review</label>
</fieldset>
<fieldset>version
<label><input type="radio" name="v" value="011"> 0.1.1</label>
<label><input type="radio" name="v" value="012" checked> 0.1.2</label>
</fieldset>
<div class="term" id="out"></div>
</div>
</main>
<script>
const pick=n=>document.querySelector('input[name='+n+']:checked').value;
function run(){
  const s=pick('s'), v=pick('v');
  const other='\u25cf promote #4165  Build \u2713  Static Analysis \u2713';
  let lines;
  if(v==='011') lines=['\u2728 Prompt Enhancer [ - ]','[ Enhance ][ Undo ][ Send ]','Enhanced below: edit it, then Send (or Enter). Undo puts your original back.','Keys: ctrl+x tab, then e Enhance, u Undo, s Send. Esc goes back to the prompt.','(the other band is gone)'];
  else if(s==='idle') lines=['\u2728 Prompt Enhancer [ Enhance ][ Undo ][ Send ][ + ]  ctrl+x tab: e u s',other];
  else lines=['\u2728 Prompt Enhancer [ - ]','[ Enhance ][ Undo ][ Send ]','Enhanced below: edit it, then Send (or Enter). Undo puts your original back.','Keys: ctrl+x tab, then e Enhance, u Undo, s Send. Esc goes back to the prompt.',other];
  lines.push('','lines above the prompt: '+lines.filter(l=>l&&!l.startsWith('(')).length);
  document.getElementById('out').textContent=lines.join('\n');
}
document.querySelectorAll('input').forEach(i=>i.onchange=run); run();
</script>
</body></html>

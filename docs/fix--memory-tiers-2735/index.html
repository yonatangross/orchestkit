<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which memory hooks still exist</title>
<style>
:root { color-scheme: light dark; font-family: system-ui, sans-serif; }
body { max-width: 42rem; margin: 3rem auto; padding: 0 1.25rem; line-height: 1.5; }
fieldset { border: 1px solid currentColor; border-radius: 6px; margin: 1.5rem 0; padding: 1rem; }
label { display: block; margin: .25rem 0; }
output { display: block; padding: .75rem 1rem; border-left: 4px solid; font-weight: 600; }
output[data-state="red"] { border-color: #c62828; }
output[data-state="green"] { border-color: #2e7d32; }
code { font-size: .95em; }
</style>
</head>
<body>
<main>
<h1>Which memory hooks still exist</h1>
<p>One docs page said these hooks were removed, while 13 others described them as live. Pick a name to see what is true now, and where memory really comes from.</p>

<fieldset>
<legend>The hook or writer the old docs named</legend>
<label><input type="radio" name="hook" value="context" checked> <code>memory-context</code> (every prompt)</label>
<label><input type="radio" name="hook" value="loader"> <code>memory-context-loader</code> (session start)</label>
<label><input type="radio" name="hook" value="continuity"> <code>auto-remember-continuity</code> (stop)</label>
<label><input type="radio" name="hook" value="writer"> <code>memory-writer</code> (the write path)</label>
<label><input type="radio" name="hook" value="summary"> <code>session-summary</code> (stop)</label>
</fieldset>

<output id="result" aria-live="polite"></output>
</main>
<script>
const result = document.getElementById("result");
const answers = {
  context: [true, "Removed. Claude reads the graph when it calls the graph MCP, for example through /ork:memory search."],
  loader: [true, "Removed. Claude Code injects MEMORY.md itself, and no hook loads recent decisions."],
  continuity: [true, "Removed. Nothing stores decisions at session end on its own."],
  writer: [true, "Removed. /ork:remember writes through the graph MCP."],
  summary: [false, "Live. It suggests what to capture at the end of a busy session, and you decide."],
};
function render() {
  const [gone, text] = answers[document.querySelector('input[name="hook"]:checked').value];
  result.dataset.state = gone ? "red" : "green";
  result.textContent = text;
}
document.querySelectorAll("input").forEach((input) => input.addEventListener("input", render));
render();
</script>
</body>
</html>

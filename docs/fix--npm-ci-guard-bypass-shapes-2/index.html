<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The npm ci guard missed eight ways to write npm ci</title>
<meta name="description" content="Pick a command shape and see whether the npm ci symlink guard checked it, before and after the review follow-up.">
<style>
  :root{--pg-bg:oklch(19% .012 265);--pg-panel:oklch(23% .014 265);--pg-edge:oklch(32% .016 265);--pg-ink:oklch(94% .006 265);--pg-dim:oklch(72% .02 265);--pg-accent:oklch(83% .09 225);--pg-well:oklch(16% .01 265);--status-ok:#4ade80;--status-bad:#f87171;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
  *{box-sizing:border-box}
  body{margin:0;padding:2.5rem 1.25rem;background:var(--pg-bg);color:var(--pg-ink);font-family:var(--mono);line-height:1.6}
  main{max-width:56rem;margin-inline:auto}
  h1{font-size:1.35rem;margin:0 0 .3rem}
  .sub{color:var(--pg-dim);margin:0 0 2rem;font-size:.85rem}
  section{background:var(--pg-panel);border:1px solid var(--pg-edge);border-radius:10px;padding:1.2rem 1.4rem;margin-block:1.1rem}
  h2{font-size:.9rem;margin:0 0 .9rem;color:var(--pg-accent);text-transform:uppercase;letter-spacing:.06em}
  label{display:block;color:var(--pg-dim);font-size:.8rem;margin-top:.6rem}
  select,button{background:var(--pg-well);color:var(--pg-ink);border:1px solid var(--pg-edge);border-radius:6px;padding:.35rem .5rem;font-family:inherit}
  select{width:100%}
  button{margin-top:1rem;cursor:pointer}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:1rem}
  @media (max-width:640px){.grid{grid-template-columns:1fr}}
  .out{padding:.6rem .8rem;background:var(--pg-well);border:1px solid var(--pg-edge);border-radius:6px;font-size:.8rem;min-height:5rem}
  .ok{color:var(--status-ok)} .bad{color:var(--status-bad)}
  h3{font-size:.75rem;margin:0 0 .3rem;color:var(--pg-dim);font-weight:400}
  @media (prefers-reduced-motion:reduce){*{transition:none;animation:none}}
</style>
</head>
<body><main>
<h1>The npm ci guard missed eight ways to write npm ci</h1>
<p class="sub">Branch fix/npm-ci-guard-bypass-shapes-2, 2026-11-10. Found in review of #5166. Each case assumes node_modules at the target is a symlink.</p>
<section><h2>Pick a command shape</h2>
<label for="pick">Command</label>
<select id="pick"></select>
<div class="grid">
  <div><h3>Before (#5166)</h3><div class="out bad" id="before"></div></div>
  <div><h3>Now</h3><div class="out ok" id="after"></div></div>
</div>
<button id="copy" type="button">Copy prompt</button>
</section>
<script>
const CASES = [
  ["npm --loglevel warn ci", "Allowed: 'warn' was read as the subcommand.", "Denied: the option value is skipped, ci is found."],
  ["npm -w api ci", "Allowed: 'api' was read as the subcommand.", "Denied."],
  ["npm -C src/hooks ci", "Allowed: -C was not known as the prefix.", "Denied: src/hooks/node_modules is checked."],
  ["(cd /w/wt && npm ci)", "Allowed: the '(' hid both cd and npm.", "Denied: /w/wt/node_modules is checked."],
  ["cd ~/wt && npm ci", "Allowed: looked for <cwd>/~/wt, which does not exist.", "Denied: ~ is expanded against HOME."],
  ["cd \"/my wt\" && npm ci", "Allowed: the quoted path with a space was missed.", "Denied."],
  ["env CI=1 npm ci, time npm ci", "Allowed: the wrapper hid npm.", "Denied: env, time, command, exec, nohup and nice are stripped."],
  ["sleep 1 & npm ci", "Allowed: a single & did not split the command.", "Denied."],
  ["node_modules cannot be read (EACCES)", "Allowed: every lstat error read as not-a-link.", "Denied: only a missing path reads as not-a-link."],
  ["npm -w api run ci", "Allowed.", "Allowed: not a clean install."]
];
const pick = document.getElementById('pick');
pick.replaceChildren(...CASES.map((c, i) => new Option(c[0], String(i))));
function show() {
  const c = CASES[Number(pick.value)];
  document.getElementById('before').textContent = c[1];
  document.getElementById('after').textContent = c[2];
}
pick.addEventListener('change', show);
document.getElementById('copy').addEventListener('click', () => {
  const c = CASES[Number(pick.value)];
  navigator.clipboard.writeText('Check this case in OrchestKit: ' + c[0] + '. Before: ' + c[1] + ' Now: ' + c[2]);
});
show();
</script>
</main></body>
</html>

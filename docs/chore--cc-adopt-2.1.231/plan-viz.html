  const live = document.getElementById('pv-live');
  const say = (m) => { live.textContent = m; };

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = String(text);
    return n;
  };
  const svgEl = (tag, attrs) => {
    const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const k in attrs) n.setAttribute(k, String(attrs[k]));
    return n;
  };

  document.getElementById('pv-title').textContent = S.title;
  document.getElementById('pv-issue').textContent = S.issue || '';
  document.title = S.title + ' — plan';

  const t = S.totals || {};
  const facts = document.getElementById('pv-facts');
  const fact = (label, value, cls) => {
    const f = el('span', 'fact' + (cls ? ' ' + cls : ''));
    f.append(label + ' ', el('b', null, value));
    facts.append(f);
  };
  fact('Phases', t.phases ?? '—');
  fact('Files', t.files ?? '—');
  fact('Lines', '+' + (t.added ?? 0) + ' / -' + (t.removed ?? 0));
  fact('Risk', S.risk ?? '—', 'risk-' + (S.risk || 'low'));
  fact('Confidence', S.confidence ?? '—');
  fact('Reversible until', S.reversibleUntil ?? '—');
  document.getElementById('pv-branch').textContent =
    S.branch + ' → ' + S.base + (S.updated ? '   ·   updated ' + S.updated : '');

  const host = document.getElementById('pv-sections');
  const section = (id, no, title, count, build) => {
    const d = el('details', 'sec glass');
    d.id = id;
    if (no === 0 || no === 3) d.open = true;
    const sm = el('summary');
    sm.append(el('span', 'secno', '[' + no + ']'), el('h2', null, title));
    if (count != null) sm.append(el('span', 'seccount', count));
    d.append(sm);
    const body = el('div', 'secbody');
    build(body);
    d.append(body);
    host.append(d);
  };

  const MARK = { add: '[+]', chg: '[~]', del: '[-]', same: '   ' };
  section('s0', 0, 'Version state before / after', null, (b) => {
    const a = S.arch || {};
    if (!(a.before || []).length && !(a.after || []).length) {
      b.append(el('p', 'empty', 'Nothing structural changed — section skipped.')); return;
    }
    const grid = el('div', 'ba');
    const col = (heading, nodes) => {
      const c = el('div', 'col');
      c.append(el('h3', null, heading));
      (nodes || []).forEach((n) => {
        const row = el('div', 'node ' + (n.mark || 'same'));
        row.append(el('span', 'mk', MARK[n.mark] || MARK.same), el('span', 'mono', n.node));
        c.append(row);
      });
      return c;
    };
    grid.append(col('Base (' + S.base + ')', a.before), el('div', 'arrow', '→'),
                col('Head (' + S.branch + ')', a.after));
    b.append(grid);
  });

  const withTwin = (parent, label, drawChart, buildTable) => {
    const toggle = el('div', 'viewtoggle');
    const bC = el('button', null, 'Chart'); bC.type = 'button';
    const bT = el('button', null, 'Table'); bT.type = 'button';
    const chart = el('div', 'chart');
    const table = el('div', 'table');
    drawChart(chart); buildTable(table);
    const show = (isChart) => {
      chart.hidden = !isChart; table.hidden = isChart;
      bC.setAttribute('aria-pressed', String(isChart));
      bT.setAttribute('aria-pressed', String(!isChart));
      say(label + ': ' + (isChart ? 'chart' : 'table') + ' view');
    };
    bC.addEventListener('click', () => show(true));
    bT.addEventListener('click', () => show(false));
    toggle.append(bC, bT);
    parent.append(toggle, chart, table);
    show(true);
  };

  const files = S.files || [];
  section('s1', 1, 'Change manifest', files.length + ' files', (b) => {
    if (!files.length) { b.append(el('p', 'empty', 'No file changes detected.')); return; }
    withTwin(b, 'Change manifest', (host2) => {
      const max = Math.max(1, ...files.map((f) => Math.max(f.added || 0, f.removed || 0)));
      const rowH = 30, padL = 300, padR = 60, w = 980;
      const svg = svgEl('svg', {
        viewBox: '0 0 ' + w + ' ' + (files.length * rowH + 26),
        role: 'img',
        'aria-label': 'Lines added and removed per file. Same data in the table view.'
      });
      files.forEach((f, i) => {
        const y = i * rowH + 8;
        const barW = (v) => Math.round((v / max) * (w - padL - padR));
        svg.append(svgEl('line', { x1: padL, x2: w - padR, y1: y + rowH - 4, y2: y + rowH - 4,
                                   stroke: 'var(--mark-grid)', 'stroke-width': 1 }));
        const name = svgEl('text', { x: padL - 12, y: y + 14, 'text-anchor': 'end', class: 'lbl' });
        const MAXLBL = 40;
        name.textContent = f.path.length > MAXLBL ? '…' + f.path.slice(-(MAXLBL - 1)) : f.path;
        if (f.path.length > MAXLBL) {
          const full = svgEl('title', {});
          full.textContent = f.path;
          name.append(full);
        }
        svg.append(name);
        svg.append(svgEl('rect', { x: padL, y: y + 3, width: barW(f.added || 0), height: 9,
                                   rx: 3, fill: 'var(--series-3)' }));
        svg.append(svgEl('rect', { x: padL, y: y + 14, width: barW(f.removed || 0), height: 9,
                                   rx: 3, fill: 'var(--series-2)' }));
        const val = svgEl('text', { x: w - padR + 8, y: y + 16 });
        val.textContent = '+' + (f.added || 0) + ' -' + (f.removed || 0);
        svg.append(val);
      });
      host2.append(svg);
      const lg = el('div', 'legend');
      [['var(--series-3)', 'added'], ['var(--series-2)', 'removed']].forEach(([c, n]) => {
        const s = el('span'); const i = el('i'); i.style.background = c;
        s.append(i, document.createTextNode(n)); lg.append(s);
      });
      host2.append(lg);
    }, (host2) => {
      const tb = el('table');
      const thead = el('thead'); const hr = el('tr');
      ['', 'File', 'Area', 'Added', 'Removed'].forEach((h, i) => {
        const th = el('th', i >= 3 ? 'num' : null, h); hr.append(th);
      });
      thead.append(hr); tb.append(thead);
      const body = el('tbody');
      files.forEach((f) => {
        const tr = el('tr');
        const tag = el('td'); tag.append(el('span', 'tag ' + f.action, '[' + f.action + ']'));
        tr.append(tag, el('td', 'mono', f.path), el('td', null, f.area || '—'),
                  el('td', 'num', '+' + (f.added || 0)), el('td', 'num', '-' + (f.removed || 0)));
        body.append(tr);
      });
      tb.append(body);
      host2.append(tb);
    });
  });

  const phases = S.phases || [];
  section('s2', 2, 'Execution order', phases.length + ' phases', (b) => {
    if (!phases.length) { b.append(el('p', 'empty', 'No phase breakdown provided.')); return; }
    phases.forEach((p) => {
      const lane = el('div', 'lane ' + (p.status || 'planned'));
      lane.append(el('div', 'pid', p.id));
      const bar = el('div', 'bar');
      bar.append(el('span', null, p.title));
      if ((p.deps || []).length) bar.append(el('span', 'deps', 'after ' + p.deps.join(', ')));
      lane.append(bar);
      b.append(lane);
      if (p.detail) {
        const d = el('div', 'lane');
        d.style.borderBlockEnd = 'none';
        d.append(el('div'), el('div', 'empty', p.detail));
        b.append(d);
      }
    });
  });

  const risks = S.risks || [];
  const SEV_ORDER = ['good', 'warning', 'serious', 'critical'];
  section('s3', 3, 'Risks', risks.length + ' tracked', (b) => {
    if (!risks.length) { b.append(el('p', 'empty', 'No risks recorded — say why, do not pad.')); return; }
    withTwin(b, 'Risk map', (host2) => {
      const w = 940, h = 300, padL = 56, padB = 44;
      const svg = svgEl('svg', { viewBox: '0 0 ' + w + ' ' + h, role: 'img',
        'aria-label': 'Risk likelihood against impact, 1 to 5 each. Same data in the table view.' });
      for (let i = 1; i <= 5; i++) {
        const x = padL + ((i - 1) / 4) * (w - padL - 40);
        const y = h - padB - ((i - 1) / 4) * (h - padB - 30);
        svg.append(svgEl('line', { x1: x, x2: x, y1: 20, y2: h - padB,
                                   stroke: 'var(--mark-grid)', 'stroke-width': 1 }));
        svg.append(svgEl('line', { x1: padL, x2: w - 40, y1: y, y2: y,
                                   stroke: 'var(--mark-grid)', 'stroke-width': 1 }));
        const xt = svgEl('text', { x: x, y: h - padB + 18, 'text-anchor': 'middle' });
        xt.textContent = String(i); svg.append(xt);
        const yt = svgEl('text', { x: padL - 12, y: y + 4, 'text-anchor': 'end' });
        yt.textContent = String(i); svg.append(yt);
      }
      const ax = svgEl('text', { x: (w + padL) / 2, y: h - 8, 'text-anchor': 'middle', class: 'lbl' });
      ax.textContent = 'likelihood →'; svg.append(ax);
      const ay = svgEl('text', { x: 14, y: 16, class: 'lbl' });
      ay.textContent = 'impact ↑'; svg.append(ay);
      risks.forEach((r) => {
        const x = padL + (((r.likelihood || 1) - 1) / 4) * (w - padL - 40);
        const y = h - padB - (((r.impact || 1) - 1) / 4) * (h - padB - 30);
        svg.append(svgEl('circle', { cx: x, cy: y, r: 11,
          fill: 'var(--status-' + (r.severity || 'warning') + ')' }));
        const lab = svgEl('text', { x: x, y: y + 4, 'text-anchor': 'middle',
                                    fill: 'var(--pg-bg)', 'font-weight': '700' });
        lab.textContent = r.id; svg.append(lab);
      });
      host2.append(svg);
      const lg = el('div', 'legend');
      SEV_ORDER.slice().reverse().forEach((s) => {
        const sp = el('span'); const i = el('i');
        i.style.background = 'var(--status-' + s + ')';
        sp.append(i, document.createTextNode(s)); lg.append(sp);
      });
      host2.append(lg);
    }, (host2) => {
      const tb = el('table');
      const hr = el('tr');
      ['ID', 'Risk', 'Severity', 'Likelihood', 'Impact'].forEach((hh, i) => hr.append(el('th', i >= 3 ? 'num' : null, hh)));
      const thead = el('thead'); thead.append(hr); tb.append(thead);
      const body = el('tbody');
      risks.forEach((r) => {
        const tr = el('tr');
        const sv = el('td'); sv.append(el('span', 'sev ' + (r.severity || 'warning'), r.severity || 'warning'));
        tr.append(el('td', 'mono', r.id), el('td', null, r.title), sv,
                  el('td', 'num', r.likelihood ?? '—'), el('td', 'num', r.impact ?? '—'));
        body.append(tr);
      });
      tb.append(body); host2.append(tb);
    });

    const cards = el('div', 'cards');
    cards.style.marginBlockStart = '16px';
    risks.forEach((r) => {
      const c = el('div', 'card');
      const hd = el('h4');
      hd.append(el('span', 'sev ' + (r.severity || 'warning'), r.severity || 'warning'),
                el('span', null, r.title));
      c.append(hd);
      const dl = el('dl');
      if (r.premortem) { dl.append(el('dt', null, 'pre-mortem'), el('dd', null, r.premortem)); }
      if (r.containment) { dl.append(el('dt', null, 'containment'), el('dd', null, r.containment)); }
      c.append(dl);
      cards.append(c);
    });
    b.append(cards);
  });

  const decisions = S.decisions || [];
  section('s4', 4, 'Decisions', decisions.length + ' recorded', (b) => {
    if (!decisions.length) { b.append(el('p', 'empty', 'No decisions recorded.')); return; }
    const cards = el('div', 'cards');
    decisions.forEach((d) => {
      const c = el('div', 'card');
      const hd = el('h4');
      hd.append(el('span', 'mono', d.id), el('span', null, d.title));
      c.append(hd);
      const dl = el('dl');
      [['context', d.context], ['decision', d.decision],
       ['alternatives', d.alternatives], ['tradeoff', d.tradeoff]].forEach(([k, v]) => {
        if (v) { dl.append(el('dt', null, k), el('dd', null, v)); }
      });
      c.append(dl);
      cards.append(c);
    });
    b.append(cards);
  });

  section('s5', 5, 'Impact', null, (b) => {
    const kpis = el('div', 'kpis');
    const kpi = (value, label, cls) => {
      const k = el('div', 'kpi');
      k.append(el('b', cls, value), el('span', null, label));
      kpis.append(k);
    };
    const net = (t.added || 0) - (t.removed || 0);
    kpi('+' + (t.added || 0), 'lines added', 'up');
    kpi('-' + (t.removed || 0), 'lines removed', 'down');
    kpi((net >= 0 ? '+' : '') + net, 'net', 'acc');
    kpi(String(t.files ?? '—'), 'files touched');
    kpi(String(t.tests ?? '—'), 'test files');
    b.append(kpis);

    const byArea = {};
    files.forEach((f) => {
      const a = f.area || 'other';
      byArea[a] = (byArea[a] || 0) + (f.added || 0) + (f.removed || 0);
    });
    const areas = Object.keys(byArea).sort((x, y) => byArea[y] - byArea[x]);
    if (areas.length > 1) {
      withTwin(b, 'Churn by area', (host2) => {
        const max = Math.max(1, ...areas.map((a) => byArea[a]));
        const rowH = 32, padL = 220, padR = 70, w = 980;
        const svg = svgEl('svg', { viewBox: '0 0 ' + w + ' ' + (areas.length * rowH + 10),
          role: 'img', 'aria-label': 'Total changed lines per area. Same data in the table view.' });
        areas.forEach((a, i) => {
          const y = i * rowH + 6;
          const bw = Math.round((byArea[a] / max) * (w - padL - padR));
          const lab = svgEl('text', { x: padL - 12, y: y + 15, 'text-anchor': 'end', class: 'lbl' });
          lab.textContent = a; svg.append(lab);
          svg.append(svgEl('rect', { x: padL, y: y + 4, width: bw, height: 16, rx: 4,
                                     fill: 'var(--series-1)' }));
          const v = svgEl('text', { x: padL + bw + 10, y: y + 17 });
          v.textContent = String(byArea[a]); svg.append(v);
        });
        host2.append(svg);
      }, (host2) => {
        const tb = el('table');
        const hr = el('tr'); hr.append(el('th', null, 'Area'), el('th', 'num', 'Changed lines'));
        const thead = el('thead'); thead.append(hr); tb.append(thead);
        const body = el('tbody');
        areas.forEach((a) => {
          const tr = el('tr');
          tr.append(el('td', null, a), el('td', 'num', String(byArea[a])));
          body.append(tr);
        });
        tb.append(body); host2.append(tb);
      });
    }

    const imp = S.impact || {};
    if ((imp.api || []).length) {
      b.append(el('h2', null, 'ork surface'));
      const tb = el('table');
      const hr = el('tr'); hr.append(el('th', null, 'Surface'), el('th', null, 'Change'));
      const thead = el('thead'); thead.append(hr); tb.append(thead);
      const body = el('tbody');
      imp.api.forEach((a) => {
        const tr = el('tr');
        tr.append(el('td', 'mono', a.surface), el('td', null, a.change));
        body.append(tr);
      });
      tb.append(body); b.append(tb);
    }
    if ((imp.deps || []).length) {
      b.append(el('h2', null, 'Version tracked'));
      const tb = el('table');
      const hr = el('tr');
      ['Package', 'From', 'To', 'Note'].forEach((h) => hr.append(el('th', null, h)));
      const thead = el('thead'); thead.append(hr); tb.append(thead);
      const body = el('tbody');
      imp.deps.forEach((d) => {
        const tr = el('tr');
        tr.append(el('td', 'mono', d.name), el('td', 'mono', d.from),
                  el('td', 'mono', d.to), el('td', null, d.note || ''));
        body.append(tr);
      });
      tb.append(body); b.append(tb);
    }
  });

  const promptText = S.prompt || ('Implement the plan for ' + S.title + '.');
  document.getElementById('pv-prompt').textContent = promptText;
  const btn = document.getElementById('pv-copy');
  btn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(promptText); }
    catch { const r = document.createRange(); r.selectNode(document.getElementById('pv-prompt'));
            getSelection().removeAllRanges(); getSelection().addRange(r); }
    const was = btn.textContent;
    btn.textContent = '✓ Copied';
    say('Prompt copied to clipboard');
    setTimeout(() => { btn.textContent = was; }, 1500);
  });
})();
</script>
</body>
</html>

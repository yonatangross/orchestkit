id: claude-design-orchestrator
name: "Claude design orchestrator agent evaluation"
agent_path: src/agents/claude-design-orchestrator.md

agent_evals:
  - prompt: "Read the Claude Design export at ./design-export/ and tell me which of its components already exist in this project."
    scaffold: empty
    assertions:
      - name: "opens the export through the script"
        check: "uses the design-to-code inspect-export.mjs script (or the inventory it was given) to read the export, and does not unpack an archive by hand"
      - name: "reports an empty export plainly"
        check: "when the export holds no HTML prototype, reports it as incomplete with what the user should do, instead of inventing components"
      - name: "produces relevant output"
        check: "produces output consistent with: reads Claude Design exports, dedups proposed components against the codebase via component-search, reconciles tokens, and tracks export to PR provenance"

tags: [claude-design-orchestrator, agent]

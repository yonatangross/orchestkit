# Rewritten 2026-11-17:
# remember is now a typed-only alias of the remember verb of memory. The model
# never loads it (disable-model-invocation), so it has no trigger case; the old
# phrasing is a trigger case of tests/evals/skills/memory.eval.yaml.
# Created: 2026-03-13

id: remember
name: "Remember alias evaluation"
skill_path: src/skills/remember/SKILL.md
plugin_dir: plugins/ork

quality_evals:
  - prompt: "/ork:remember we chose Postgres over MongoDB for this project"
    assertions:
      - name: "says the command moved"
        check: "tells the user in one line that remember is now memory remember"
      - name: "runs the merged skill"
        check: "invokes the memory skill with the remember verb and the same text, and does no graph work of its own"

tags: [remember, alias]

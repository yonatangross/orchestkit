# Rewritten 2026-11-17:
# dream is now a typed-only alias of the dream verb of memory. The model never
# loads it (disable-model-invocation), so it has no trigger case; the old
# phrasing is a trigger case of tests/evals/skills/memory.eval.yaml.
# Created: 2026-04-01

id: dream
name: "Dream alias evaluation"
skill_path: src/skills/dream/SKILL.md
plugin_dir: plugins/ork

quality_evals:
  - prompt: "/ork:dream --dry-run"
    assertions:
      - name: "says the command moved"
        check: "tells the user in one line that dream is now memory dream"
      - name: "runs the merged skill"
        check: "invokes the memory skill with the dream verb and the --dry-run flag, and does no consolidation work of its own"

tags: [dream, alias]

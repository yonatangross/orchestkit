# Generated by OrchestKit Claude Plugin
# Created: 2026-03-14

id: quickviz
name: "Quickviz evaluation"
skill_path: src/skills/quickviz/SKILL.md
plugin_dir: plugins/ork

quality_evals:
  - prompt: |
      Draw me an architecture diagram showing a React frontend connecting
      to a FastAPI backend, which connects to both PostgreSQL and Redis.
    assertions:
      - name: "box-drawing characters"
        check: "uses Unicode box-drawing characters (like borders, connectors) for the diagram"
      - name: "all components present"
        check: "includes all four components: React, FastAPI, PostgreSQL, and Redis"
      - name: "directional arrows"
        check: "uses arrows to show data flow direction between components"

  - prompt: |
      Show the blast radius of changing the auth middleware file.
      Direct imports: 3 files. Transitive: 5 files. Test files: 8 files.
    assertions:
      - name: "concentric ring pattern"
        check: "uses a concentric ring or layered box pattern showing direct, transitive, and test impact zones"
      - name: "file counts shown"
        check: "displays the file counts (3, 5, 8) in the appropriate rings"
      - name: "changed file at center"
        check: "places the changed file (auth middleware) at the center of the diagram"

  - prompt: |
      Visualize a 4-phase migration timeline where phases 1-2 are fully
      reversible, phase 3 is partially reversible, and phase 4 is
      irreversible with a point of no return.
    assertions:
      - name: "timeline bars"
        check: "uses horizontal bars or progress indicators for each phase"
      - name: "reversibility labels"
        check: "labels each phase with its reversibility status (fully, partially, irreversible)"
      - name: "point of no return"
        check: "marks a clear point of no return between the reversible and irreversible phases"

# Trigger cases. Every positive is VERBATIM from a real 13-prompt session
# (2026-07-26) rather than invented — that replay is also what showed the skill
# is asked for as a modifier on an existing question, never as a self-contained
# topic, so the phrasing here is deliberately scrappy and mid-conversation.
#
# The negatives carry most of the value: quickviz was made invocable alongside
# visualize-plan, and the two are only separated by whether the deliverable is
# an inline chat answer or a file. These pin that boundary.
trigger_evals:
  # --- the canonical ask, six times in one session -------------------------
  - prompt: "vis in ascii emojies"
    should_trigger: true
  - prompt: "status? vis in ascii emojies"
    should_trigger: true
  - prompt: "so whats next? vis ascii emojies"
    should_trigger: true
  - prompt: "explain whats left on track b in ascii emojies"
    should_trigger: true

  # --- implicit shape: wants structure without naming the format -----------
  - prompt: "show me the options and what is most correct"
    should_trigger: true
  - prompt: "draw me a quick diagram of how the auth flow works"
    should_trigger: true
  - prompt: "compare these two approaches visually"
    should_trigger: true

  # --- the visualize-plan boundary: deliverable is a FILE, not a reply -----
  - prompt: "Build me an interactive HTML playground comparing these four migration options"
    should_trigger: false
  - prompt: "Create a plan playground with before/after architecture and a risk heat map"
    should_trigger: false

  # --- wrong medium: quickviz renders monospace terminal output only -------
  - prompt: "Generate a PNG diagram of our microservices architecture for the README"
    should_trigger: false

  # --- no shape to render --------------------------------------------------
  - prompt: "rename this variable to userCount"
    should_trigger: false
  - prompt: "run the tests and tell me if they pass"
    should_trigger: false

tags: [quickviz, background, visualization]

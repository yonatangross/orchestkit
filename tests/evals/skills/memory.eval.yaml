quality_evals:
  - prompt: |
      i want to search my project's knowledge graph for any past
      decisions about authentication. how does the memory system
      work and what should i search for?
    assertions:
      - name: "explains search mechanism"
        check: "describes using mcp__memory__search_nodes or similar MCP tools to query the knowledge graph"
      - name: "suggests search terms"
        check: "recommends searching with authentication/session/auth-related query terms"
      - name: "describes result format"
        check: "explains that results include entity names, types, observations, and relationships"
      - name: "no fabricated memories"
        check: "does NOT invent specific memories — explains the search process without hallucinating results"

  - prompt: |
      how can i visualize the knowledge graph for my project?
      what format does it use?
    assertions:
      - name: "Mermaid visualization"
        check: "mentions Mermaid diagrams as the visualization format for the knowledge graph"
      - name: "entity types"
        check: "describes entity types in the graph (Technology, Pattern, Decision, etc.)"
      - name: "empty graph handling"
        check: "mentions that an empty graph should show a helpful message rather than an error"

  - prompt: |
      we used Redis with a 5-minute TTL for session caching and it
      reduced latency by 40%. how would this be stored in the
      knowledge graph? what entities and relationships would be created?
    assertions:
      - name: "entity extraction"
        check: "identifies Redis, session caching, and latency as entities to store in the knowledge graph"
      - name: "relationship modeling"
        check: "describes relationships like project USES Redis, Redis IMPROVES latency"
      - name: "success categorization"
        check: "marks or categorizes this as a success pattern or positive outcome"
      - name: "confirmation step"
        check: "mentions confirming with the user what was stored, not silently saving"

  - prompt: |
      using a single global database connection caused connection
      exhaustion under load. we should have used connection pooling.
      how do i store this lesson so we don't repeat it?
    assertions:
      - name: "anti-pattern storage"
        check: "recommends storing as a failed/anti-pattern outcome in the knowledge graph"
      - name: "lesson extraction"
        check: "captures the corrective lesson: use connection pooling instead of single global connection"
      - name: "category detection"
        check: "categorizes as database-related based on content"

  - prompt: |
      I have about 30 memory files that have accumulated over the last
      few months. Some reference files that were deleted during a refactor.
      How would you consolidate them?
    assertions:
      - name: "staleness detection"
        check: "describes checking whether referenced file paths still exist using Glob or filesystem checks"
      - name: "deterministic approach"
        check: "emphasizes deterministic verification (file exists, symbol exists) rather than LLM judgment for pruning decisions"
      - name: "dry run option"
        check: "mentions or offers a --dry-run flag to preview changes before applying"
      - name: "index rebuild"
        check: "mentions rebuilding MEMORY.md index after pruning"


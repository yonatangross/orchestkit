# Generated by OrchestKit Claude Plugin
# Created: 2026-03-14

id: langgraph
name: "LangGraph workflow patterns evaluation"
skill_path: src/skills/langgraph/SKILL.md
plugin_dir: plugins/ork

quality_evals:
  - prompt: |
      I'm building a LangGraph workflow where multiple agents process
      data in parallel and I need to collect all their results into a
      single list. How do I set up the state schema?
    assertions:
      - name: "Annotated list with add reducer"
        check: "uses Annotated[list, add] or equivalent reducer to accumulate results instead of overwriting"
      - name: "TypedDict state"
        check: "uses TypedDict for the state schema definition"
      - name: "Send API for fan-out"
        check: "recommends the Send API for dynamic parallel branches with fan-out"

  - prompt: |
      My LangGraph workflow sometimes gets stuck in an infinite loop
      when the LLM keeps calling tools without reaching a final answer.
      How do I prevent this?
    assertions:
      - name: "max retry counter"
        check: "recommends adding a maximum step or retry counter to prevent infinite loops"
      - name: "END fallback"
        check: "ensures routing always includes an END fallback to prevent workflow hangs"
      - name: "RemainingSteps"
        check: "mentions RemainingSteps or recursion limit handling for proactive loop prevention"

  - prompt: |
      I need to add a human approval step to my LangGraph pipeline
      before executing a dangerous tool call. How do I implement
      human-in-the-loop?
    assertions:
      - name: "interrupt function"
        check: "uses interrupt() function for pausing the workflow at the approval point"
      - name: "checkpointer required"
        check: "mentions that a checkpointer is required for state persistence during human-in-loop"
      - name: "Command resume"
        check: "uses Command(resume=...) to resume the workflow after human approval"

  # --- 1.2 resilience surface (added 2026-07-25 alongside rules/resilience-*.md) ---

  - prompt: |
      One node in my LangGraph pipeline calls a vendor API that
      occasionally hangs forever. I already set a RetryPolicy with
      max_attempts=3 but the run still gets stuck. Why, and how do I
      fix it?
    assertions:
      - name: "explains retry cannot fire without a failure"
        check: "explains that a retry policy only engages on a raised error, so a hung call never triggers it"
      - name: "recommends timeout= on add_node"
        check: "recommends the timeout= parameter on add_node, or TimeoutPolicy with run_timeout/idle_timeout"
      - name: "cooperative cancellation caveat"
        check: "warns that timeouts rely on asyncio cancellation, so synchronous GIL-blocking work is not interrupted"

  - prompt: |
      When a node in my graph exhausts its retries I want to record the
      failure in state and route to a fallback branch instead of
      killing the whole run. What is the current way to do that?
    assertions:
      - name: "error_handler parameter"
        check: "recommends the error_handler= parameter on add_node rather than a try/except inside the node body"
      - name: "NodeError injection by type"
        check: "shows the handler receiving failure context via a parameter typed NodeError"
      - name: "returns Command to reroute"
        check: "returns a Command to update state and goto a different node"

  - prompt: |
      My LangGraph thread accumulates a long message list. Checkpoint
      writes keep getting slower the longer the conversation runs.
      What can I change?
    assertions:
      - name: "identifies full re-serialization"
        check: "explains that a normal accumulator channel rewrites its entire value into every checkpoint"
      - name: "DeltaChannel with snapshot_frequency"
        check: "recommends DeltaChannel and mentions the snapshot_frequency knob"
      - name: "batching-invariant reducer"
        check: "warns the reducer receives a batch of writes and must be deterministic and batching-invariant"

  - prompt: |
      Our deploys send SIGTERM and kill LangGraph runs mid-execution,
      so work gets redone on restart. How do I shut down cleanly?
    assertions:
      - name: "RunControl request_drain"
        check: "recommends RunControl and request_drain() rather than exiting on the signal directly"
      - name: "nodes poll drain_requested"
        check: "shows a node checking runtime.drain_requested and stopping at a safe boundary"
      - name: "cooperative, not preemptive"
        check: "notes that draining is cooperative so a node that never checks will run to completion"

tags: [langgraph, background, workflow, resilience]

# Rewritten 2026-11-17:
# ci-sentinel is now a typed-only alias of the sweep mode of ci-debug. The model
# never loads it (disable-model-invocation), so it has no trigger case; the old
# phrasing is a trigger case of tests/evals/skills/ci-debug.eval.yaml.
# Created: 2026-07-18

id: ci-sentinel
name: "Ci sentinel alias evaluation"
skill_path: src/skills/ci-sentinel/SKILL.md
plugin_dir: plugins/ork

quality_evals:
  - prompt: "/ork:ci-sentinel status"
    assertions:
      - name: "says the command moved"
        check: "tells the user in one line that ci-sentinel is now ci-debug sweep"
      - name: "runs the merged skill"
        check: "invokes the ci-debug skill with the sweep argument and the same subcommand, and does no CI work of its own"

tags: [ci-sentinel, alias]

# Generated by OrchestKit Claude Plugin
# Created: 2026-03-13

id: visualize-plan
name: "Visualize plan skill evaluation"
skill_path: src/skills/visualize-plan/SKILL.md
plugin_dir: plugins/ork

trigger_evals:
  # Should trigger — direct requests
  - prompt: "visualize the plan for the billing module redesign"
    should_trigger: true
  - prompt: "show me a before and after diagram for this migration"
    should_trigger: true
  - prompt: "render the execution order for the changes on this branch"
    should_trigger: true
  # Should trigger — casual/indirect phrasing
  - prompt: "whats the risk and impact of the changes im about to make"
    should_trigger: true
  - prompt: "break down this plan into phases with a swimlane view"
    should_trigger: true
  - prompt: "i want to see what files will change and in what order for issue #234"
    should_trigger: true
  # Should NOT trigger — brainstorm confusion pair (both planning phase)
  - prompt: "brainstorm some ideas for the notification system"
    should_trigger: false
  - prompt: "lets explore different approaches for caching"
    should_trigger: false
  - prompt: "compare three auth strategies before we start building"
    should_trigger: false
  # Should NOT trigger — adjacent tasks
  - prompt: "implement the billing module"
    should_trigger: false
  - prompt: "assess the quality of this code"
    should_trigger: false
  # Should trigger — terse phrasing
  - prompt: "visualize plan"
    should_trigger: true
  # Should NOT trigger — multi-intent, primary is implement
  - prompt: "implement the migration and show me a plan for the next phase"
    should_trigger: false

quality_evals:
  - prompt: |
      visualize the plan for migrating our auth from session cookies
      to JWT. the branch has changes to 8 files across the auth
      middleware, user service, and frontend login.
    scaffold: git-repo
    assertions:
      - name: "renders change manifest"
        check: "shows a file tree with [A]/[M]/[D] markers and line counts per file"
      - name: "shows execution swimlane"
        check: "renders an ASCII swimlane diagram showing execution phases and dependencies"
      - name: "includes risk analysis"
        check: "provides a risk dashboard with severity levels and at least one pre-mortem scenario"
      - name: "offers next actions"
        check: "presents options like save to file, generate GitHub issues, or drill deeper"
      - name: "no estimated counts"
        check: "does NOT estimate file or line counts — must use actual git data"

  - prompt: |
      just show me the file diff for whats on this branch, nothing fancy
    assertions:
      - name: "quick file diff only"
        check: "shows the change manifest with file counts and line deltas without risk analysis or swimlanes"
      - name: "uses precise counts"
        check: "runs git commands to get actual file and line counts rather than estimates"
      - name: "no unnecessary sections"
        check: "skips execution swimlane, risk dashboard, and decision log"
      - name: "no hallucinated files"
        check: "does NOT list files that are not actually changed on the branch"

  # ===========================================================================
  # ⚠️ READ THIS BEFORE TRUSTING ANY SCORE FROM THIS FILE (2026-08-04)
  #
  # The "with skill" arm DOES NOT LOAD THE SKILL. Proven with three probes using
  # the harness's exact flags, grepping output for markers only this skill emits
  # (PLAN: header, "[0] Before", POINT OF NO RETURN, [A]/[M]/[D] manifest):
  #
  #   natural language + --plugin-dir      -> 0/5 markers
  #   /ork:visualize-plan + --plugin-dir   -> 0/5 markers
  #   /ork:visualize-plan, installed, none -> 0/4, turns=0, and the model said
  #                                           "I don't see an actual request in
  #                                           your message" — in headless -p the
  #                                           slash command is DROPPED, never
  #                                           expanded into a prompt.
  #
  # Consequences, measured not assumed:
  #   - Both arms are the baseline, which is why 17 of 19 assertions came back
  #     identical between them.
  #   - Editing SKILL.md changed the skill arm by EXACTLY ZERO: a before/after
  #     run on 2026-08-04 scored 20/50/16/75 per case both times.
  #   - The delta that "improved" +5 -> +21 was baseline noise (31% -> 15%,
  #     with one case swinging 40% -> 0%). n=1 haiku variance, nothing more.
  #
  # So a low score here is NOT evidence the skill is bad, and a positive delta
  # is NOT evidence it is good. Fix the loading problem before quoting numbers.
  # Only --force-skill puts skill text in front of the model, and it runs with
  # no tools, so it tests prose rather than behavior.
  # ===========================================================================

  # ===========================================================================
  # CASES BELOW ADDED 2026-08-04. The two cases above are unchanged golden
  # ground truth (.claude/rules/eval-golden.md: add tests, do not modify old
  # ones), including their known weaknesses, which are documented here instead.
  #
  # WHY THESE EXIST. The 2026-03-14 result scored 66% PARTIAL with
  # discriminating_assertions: 0, i.e. it never demonstrated the skill beats a
  # plain model. Two causes, both addressable in the SPEC rather than the code:
  #
  #  1. NON-DISCRIMINATING ASSERTIONS. "uses precise counts" and "no
  #     hallucinated files" are things a competent baseline model already does
  #     when asked for a diff; it will just run `git diff --stat`. An assertion
  #     the baseline also passes measures the model, not the skill. Assertions
  #     below are tagged tier1 (only the skill produces this), tier2 (generic
  #     quality, kept for regression, NOT expected to discriminate) and tier3
  #     (decision quality, a circularity check on the other two). This split is
  #     the fix for the classic failure where a generic-quality rubric shows the
  #     baseline winning and the skill looking useless.
  #
  #  2. ASKUSERQUESTION TRUNCATION. "offers next actions" in case 1 is an
  #     AskUserQuestion-shaped output. In headless runs an unanswered
  #     AskUserQuestion burns turns until max_turns and everything not yet
  #     emitted grades FAIL. That mechanism is on the record in
  #     tests/evals/results/skills/setup.quality.json, grader_reason: "The
  #     session was cut short by max_turns and permission denial on
  #     AskUserQuestion". As of 2026-08-04 visualize-plan asks NOTHING before
  #     rendering (sections default to all, format moved after the ASCII floor),
  #     so all six sections are emitted before the single trailing question.
  #     The cases below deliberately assert on pre-question output only.
  #
  # RUN WITH THE BASELINE ARM. SKIP_BASELINE defaults to false, so a plain
  # `npm run eval:quality -- visualize-plan` runs both arms. The March run
  # opted out (--skip-baseline or --force-skill) and the artifact recorded no
  # flags, which is fixed separately. Use --reps 3 or more: a single sample of a
  # non-deterministic agent is not a verdict.
  # ===========================================================================

  # tier1 focus: the process discipline the skill uniquely teaches.
  - prompt: |
      visualize the plan for this branch
    scaffold: git-repo
    assertions:
      # NOTE: do NOT write assertions about tool CALLS here. The grader is fed
      # only the extracted `.result` text (run-quality-eval.sh:404) and never
      # sees the tool-call trace, so "runs analyze-impact.sh" is unfalsifiable —
      # it can only ever FAIL, permanently understating the skill. Assert on
      # what the OUTPUT shows instead. (Learned the hard way: the first version
      # of this assertion was exactly that unfalsifiable shape.)
      - name: "tier1: reports exact counts, not round or hedged numbers"
        check: "file and line counts are exact integers (e.g. '7 files, +1240 -486'). Round numbers used as estimates, ranges, or hedges such as 'roughly', 'about', '~', 'several' FAIL — those are the signature of a guess rather than a measurement."
      - name: "tier1: reversibility has an explicit point of no return"
        check: "names the specific phase after which the change can no longer be undone, as a distinct labelled point. A general statement that the change is risky or hard to reverse FAILS."
      - name: "tier1: pre-mortems state a MECHANISM, not a category"
        check: "each risk describes HOW the failure occurs as a concrete causal sequence (what runs, in what order, producing what bad state). A risk named only by category, such as 'migration risk' or 'data loss', FAILS."
      - name: "tier1: empty sections are skipped with a stated reason"
        check: "any section with no content is omitted with a one-line reason, and is NOT padded with filler or generic advice"
      - name: "tier2: renders the six canonical sections in order"
        check: "emits Before/After, Changes, Execution, Risks, Decisions, Impact, using those labels in that order"
      - name: "tier3: execution order is justified by the risk analysis"
        check: "the phase ordering is explained by reference to reversibility or a named risk, rather than presented as an arbitrary sequence. This is the circularity check: correct sections with an unjustified order means the skill produced shape without judgment."

  # Guards the 2026-08-04 ergonomics change: zero blocking questions pre-render.
  - prompt: |
      visualize the plan for this branch --quick
    scaffold: git-repo
    assertions:
      - name: "tier1: honors --quick by rendering only changes and impact"
        check: "emits the tier-1 header plus the change manifest and impact summary ONLY. Emitting the execution swimlane, risk dashboard or decision log FAILS."
      - name: "tier1: asks nothing at all"
        check: "the run completes without asking the user any question. Any question posed to the user before or after rendering FAILS this assertion."
      - name: "tier1: omits rather than fabricates the fields it skipped"
        check: "does NOT report a confidence level or reversibility point, because --quick skips the analysis that would establish them. Stating either one FAILS: an invented field is worse than a blank one."
      - name: "tier2: still reports precise counts"
        check: "file and line counts come from a command, not an estimate"

tags: [visualize-plan, user-invocable, core]

# Generated by OrchestKit Claude Plugin
# Created: 2026-08-22 — coverage for #3664 (skill was uncovered: uncovered_total=1)
# NOTE: paired-probe is a verification GATE. Its quality evals test the
# discrimination it teaches (does a check disagree when the fault is absent?),
# not orchestration.

id: paired-probe
name: "Paired-probe skill evaluation"
skill_path: src/skills/paired-probe/SKILL.md
plugin_dir: plugins/ork

trigger_evals:
  # Should trigger — direct requests
  - prompt: "is this check actually measuring anything?"
    should_trigger: true
  - prompt: "my sweep found zero issues, verify that's real"
    should_trigger: true
  - prompt: "this test passed unexpectedly, I don't trust it"
    should_trigger: true
  # Should trigger — the audit/status shapes the skill guards
  - prompt: "before I report this audit as clean, sanity-check the probe"
    should_trigger: true
  - prompt: "prove this grep would fail if the bug were present"
    should_trigger: true
  - prompt: "the scan returned nothing, is that a real zero or a broken scan"
    should_trigger: true
  # Should NOT trigger — verify confusion pair (verify GRADES work,
  # paired-probe interrogates the INSTRUMENT that produced a verdict)
  - prompt: "grade this implementation and tell me if it can merge"
    should_trigger: false
  - prompt: "run the test suite and report coverage"
    should_trigger: false
  # Should NOT trigger — writing tests is cover, not probing an existing check
  - prompt: "write unit tests for the payment module"
    should_trigger: false
  - prompt: "fix the failing CI job"
    should_trigger: false

quality_evals:
  - id: differential-gate
    prompt: |
      A script checks for leaked secrets:
        grep -r "API_KEY" src/ 2>/dev/null | wc -l
      It printed 0. Is that evidence there are no leaked keys?
    rubric:
      - "Identifies that an unreadable path or a failed grep also prints 0"
      - "States the could-not-observe case is indistinguishable from a real zero"
      - "Asks what the check prints when a secret IS present (differential arm)"
      - "Does not accept the 0 as evidence on its own"

  - id: non-empty-gate
    prompt: |
      A sweep reports "all 0 repositories have stale dependencies — clean".
      What is wrong with reporting this as clean?
    rubric:
      - "Flags that zero items were examined, so nothing was measured"
      - "Distinguishes 'examined N, found 0' from 'examined 0'"
      - "Requires the sample size be reported alongside the verdict"

  - id: exit-aware-gate
    prompt: |
      A CI step runs `verify.sh 2>/dev/null || true` and the job is green.
      What does the green tell you?
    rubric:
      - "States the green is uninformative because failure was swallowed"
      - "Notes exit status was discarded, so 'ran and passed' and 'never ran' look identical"
      - "Recommends capturing the exit code and treating could-not-observe as its own outcome"

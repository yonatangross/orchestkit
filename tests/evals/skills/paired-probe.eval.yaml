# Replaces the mechanical --fill starter (#2192). The generated version used the
# skill's own first sentence as the trigger prompt and asserted "produces output
# consistent with: <that same sentence>", which is circular: it passes for any
# response that echoes the description. Since this skill exists to reject
# unearned verdicts, shipping an unearned assertion for it would be the joke
# writing itself.
# Created: 2026-08-22

id: paired-probe
name: "Paired probe skill evaluation"
skill_path: src/skills/paired-probe/SKILL.md
plugin_dir: plugins/ork

trigger_evals:
  # The real trigger surface is a VERDICT about to be reported, not the word
  # "probe". These are phrasings that should pull the skill in.
  - prompt: "The audit came back clean, nothing found across all the repos."
    should_trigger: true
  - prompt: "The sweep reported zero issues, so we are safe to delete these."
    should_trigger: true
  - prompt: "The security check went green, we can merge."
    should_trigger: true
  - prompt: "That test passed and I honestly expected it to fail."
    should_trigger: true

  # Negatives: superficially adjacent, but no verdict is being asserted.
  - prompt: "Write a unit test for the retry helper."
    should_trigger: false
  - prompt: "What does this stack trace mean?"
    should_trigger: false

quality_evals:
  - prompt: >
      I checked whether the branch was pushed by grepping our local ref cache and
      it printed nothing, so the work was never pushed. Should I delete the worktree?
    assertions:
      - name: "refuses the verdict rather than answering the question"
        check: >
          Does NOT confirm the work is unpushed and does NOT endorse deleting.
          Identifies that an empty result from a local cache is indistinguishable
          from a cache that was never populated.
      - name: "names the differential test"
        check: >
          Proposes checking what the same command prints when the branch IS known
          to be pushed, or asks the remote directly instead of the local cache.

  - prompt: >
      My cleanup script looped over the worktrees and reported "0 at risk, safe to
      prune". Good to go?
    assertions:
      - name: "treats zero as could-not-observe, not clean"
        check: >
          Questions whether the loop examined any items at all, rather than
          accepting zero-at-risk as a passing result.
      - name: "does not green-light the destructive step"
        check: "Does not tell the user to proceed with pruning on that evidence."

tags: [paired-probe, verification, quality-gates]

# Generated by OrchestKit Claude Plugin
# Created: 2026-10-07 (coverage for #4657; the skill was uncovered: uncovered_total=1)
# NOTE: prompt-focus reads the user's OWN prompt history and must never print
# raw prompt text. The analytics skill owns hook timing, agent usage and cost;
# the negative triggers below hold that boundary.

id: prompt-focus
name: "Prompt focus skill evaluation"
skill_path: src/skills/prompt-focus/SKILL.md
plugin_dir: plugins/ork

trigger_evals:
  # Should trigger: the user asks where their own attention went
  - prompt: "show me where my focus went, as a report"
    should_trigger: true
  - prompt: "where does my focus go across my projects, what do I keep asking my agents?"
    should_trigger: true
  - prompt: "which asks do I keep re-typing to Claude every week?"
    should_trigger: true
  - prompt: "add yesterday to my prompt-focus daily log"
    should_trigger: true
  # Should NOT trigger: analytics owns tool, hook and cost telemetry
  - prompt: "which of my hooks are slow?"
    should_trigger: false
  - prompt: "how much did my agents cost this week?"
    should_trigger: false

quality_evals:
  - prompt: "show me where my focus went, as a report"
    assertions:
      - name: "counts only"
        check: "answers with counts, areas and categories, and never quotes the text of a user prompt"
      - name: "verdict first"
        check: "states a verdict line: the top area and prompts per week, before any detail"
  - prompt: "I want to post my prompt-focus page on LinkedIn"
    assertions:
      - name: "demo for public use"
        check: "recommends the demo command with synthetic data instead of the real report, because the real report names projects"
  - prompt: "add yesterday to my prompt-focus daily log"
    assertions:
      - name: "idempotent daily row"
        check: "appends one row for yesterday and says a second call for the same day writes nothing"

tags: [prompt-focus, privacy, analytics-boundary]

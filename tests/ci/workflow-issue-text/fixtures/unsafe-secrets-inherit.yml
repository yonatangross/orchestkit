# PLANTED UNSAFE FIXTURE. A reusable-workflow caller job hands issue text to
# a callee that inherits every secret. `secrets: inherit` with no value list
# must count as holding a credential.
name: Unsafe secrets inherit fixture
on:
  workflow_dispatch:

jobs:
  call-reviewer:
    uses: ./.github/workflows/reusable-review.yml
    secrets: inherit
    with:
      issue_body: ${{ github.event.issue.body }}

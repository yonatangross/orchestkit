[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchestkit"
version = "0.1.0"
description = "Official Python client for the OrchestKit public docs API (search, ask, read)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Yonatan Gross" }]
keywords = ["claude-code", "orchestkit", "yonyon", "docs", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://orchestkit.yonyon.ai"
Documentation = "https://orchestkit.yonyon.ai/sdk"
Repository = "https://github.com/yonatangross/orchestkit"
Issues = "https://github.com/yonatangross/orchestkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestkit"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "README.md",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

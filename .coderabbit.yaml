# Generated by OrchestKit Claude Plugin
# Created: 2026-08-25

# CodeRabbit review configuration for yonatangross/orchestkit.
#
# ADVISORY lane, never a required check: the required contexts are listed in
# branch protection on main and CodeRabbit is deliberately not among them. It
# is a second independent reader beside the Claude Code lane, which matters
# here more than in most repos because this codebase reviews itself: on
# 2026-08-25 the in-repo reviewer agent returned no report five times in a row
# (#3739), and the author ended up reviewing their own diffs.
#
# Ported from Yonatan-HQ/platform's .coderabbit.yaml, with the defect classes
# rewritten for this stack: TypeScript hooks, shell test harnesses, and
# markdown skills/agents rather than a Python API.
#
# The app reviews this repo (installed on the yonatangross account). Public
# repos get CodeRabbit's free OSS reviews, which run out ("Review limit
# reached ... free OSS reviews"), so settings below spend them sparingly.
# This is a personal-account repo, so it cannot inherit the Yonatan-HQ central
# config (Yonatan-HQ/coderabbit); the shared settings are mirrored by hand:
# quiet profile, pause after one reviewed commit, CI linters off, no
# auto-reply. History of the 2026-09-03 zero-review diagnosis:
# src/skills/create-pr/references/coderabbit-zero-reviews.md

language: "en-US"

# HARD LIMIT 250 CHARACTERS. CodeRabbit REJECTS the whole file above it, and
# the rejection is SILENT from our side: reviews still post, but on DEFAULT
# settings, so every rule below this line stops applying. Platform learned this
# the expensive way, with a 342-char value that made its first day of reviews
# ignore the policy entirely. Count before editing, by PARSING the yaml:
#   python3 -c "import yaml;t=yaml.safe_load(open('.coderabbit.yaml'))['tone_instructions'];print(len(' '.join(t.split())))"
#
# Do not use the text-splitting variant platform carries. It splits the raw
# file on the literal 'tone_instructions: >-', which also appears inside this
# comment block, so it measures the comment instead of the value: it reported
# 13 for a value that is really 221. Current value: 221 of 250.
tone_instructions: >-
  Report defects only, never style: biome and shellcheck are authoritative.
  Give file:line, a one-sentence defect claim, and a concrete failure
  scenario. Prefer one verified defect over three speculative ones. No
  em-dashes.

reviews:
  profile: "quiet"
  request_changes_workflow: false
  high_level_summary: true
  in_progress_fortune: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  suggested_reviewers: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    # Free OSS reviews run out; fix pushes do not each spend one.
    # Ask again with `@coderabbitai review`.
    auto_pause_after_reviewed_commits: 1
    labels:
      - "!no-review"
    base_branches:
      - "main"
      - "dev"
    # Substring matching, not regex. Release-please PRs are generated version
    # bumps plus a changelog, and a bot cannot act on a review.
    ignore_title_keywords:
      - "chore(main): release"
      - "chore(deps"
      - "autobump"
    ignore_usernames:
      - "dependabot[bot]"
      - "release-please[bot]"
      - "orchestkit-release-bot[bot]"
      - "github-actions[bot]"

  # Generated or inert surfaces. plugins/ is a build artifact of src/ and
  # src/hooks/dist/ is a compiled bundle: reviewing either produces findings
  # against code nobody edits by hand, and the real change is always in src/.
  path_filters:
    - "!plugins/**"
    - "!src/hooks/dist/**"
    - "!docs/*--*/**"
    - "!docs/site/lib/generated/**"
    - "!docs/site/public/lab/**"
    - "!**/package-lock.json"
    - "!**/*.svg"

  path_instructions:
    - path: "src/hooks/src/**/*.ts"
      instructions: >-
        Defect classes that recur here, ranked by what has actually shipped.
        (1) DEAD REGISTRATION, the #959 class: a hook must appear in BOTH
        src/hooks/hooks.json and the entries map in src/hooks/src/entries/,
        or be reached through a dispatcher that is itself registered. One
        without the other is a hook that never fires, and it fails silently.
        Verify the dispatch path reaches every new handler.
        (2) RAW-TEXT PARSING OF SHELL: a guard that asks a question about a
        command must not answer it by substring-scanning the raw string.
        Quoting decides meaning, so `grep -E "a|b"` is one process and a
        quoted heredoc body is inert payload. Use blankQuotedContent or
        blankQuotedHeredocBodies before scanning (#3731, #3732, #3736).
        (3) UNOBSERVABLE CONFLATED WITH EMPTY: a missing payload field, an
        unreadable file, or a denied syscall is NOT the same as a zero value.
        Reporting the first as the second is what made output-validator a
        kill-switch on every row (#3200). Keep could-not-observe a distinct
        outcome.
        (4) A BLOCKING RESULT INSIDE A DISPATCHER: sync dispatchers
        short-circuit on continue:false, starving every hook behind them.
        Stop and SubagentStop hooks that re-feed the model caused an infinite
        loop in CC 2.1.78, so prefer systemMessage over blocking.
        (5) SWALLOWED FAILURE READ AS DATA: `2>/dev/null | wc -l` and
        `grep -c ... || true` yield 0 or an empty string on failure,
        indistinguishable from a real measurement. Capture the exit code and
        report could-not-observe separately.
        Performance: PreToolUse under 50ms, PostToolUse under 100ms,
        Permission under 10ms; no file I/O in pretool or permission hooks.
    - path: "src/hooks/src/__tests__/**"
      instructions: >-
        VACUOUS TESTS: ask whether reverting the fix would make this test
        fail. A test asserting a constant, or one that stubs the very thing it
        claims to verify, is a defect. New guards should carry a positive
        control proving the detector can fire at all.
        BOTH DIRECTIONS: a change that loosens a guard needs a test that the
        guard still catches the real case, not only that it stopped catching
        the false positive.
        A test asserting a COUNT (hooks, skills, agents) is a registry
        assertion: raising it needs a one-line provenance comment saying what
        was added and why, matching the convention already in the file.
    - path: "src/skills/**/*.md"
      instructions: >-
        SKILL.md body stays under 500 lines. Frontmatter needs name,
        description, tags, user-invocable and complexity. A new skill must be
        added to manifests/ork.json in the same PR, and a new frontmatter key
        does not reach the built plugin without a passthrough entry. Skills
        and agents are edited in src/ only: a change that appears solely in
        plugins/ is an edit in the wrong layer and will be overwritten by the
        next build.
    - path: "tests/**/*.sh"
      instructions: >-
        Shell tests gate push, so a test that cannot fail is worse than none.
        Use awk for counts rather than `grep -c`, which exits 1 on zero
        matches and yields an empty string under `|| true`. Never pipe into
        `grep -q`: it early-exits and SIGPIPEs the producer, and under
        pipefail that 141 flips the enclosing condition non-deterministically
        (#603). Use a here-string or grep a file.
    - path: ".github/workflows/**"
      instructions: >-
        Untrusted input (github.head_ref, PR titles and bodies) goes through
        `env:` and is quoted in the shell, never interpolated into `run:`.
        Multi-line python or heredocs at column zero inside a `run: |` block
        terminate the YAML block scalar and break the whole workflow rather
        than the one step. A gate whose failure text carries the fix is not a
        control: assert the thing the text asks for.

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  # Schema v2 reads linters from reviews.tools. A root-level `tools:` key is
  # rejected ("Unrecognized key: tools") and every setting in it is ignored.
  # biome, shellcheck and actionlint already run in CI (.github/workflows),
  # so CodeRabbit copies would only repeat CI as comments. Security scanners
  # (gitleaks, trufflehog, zizmor, osvScanner) stay on their defaults.
  tools:
    ruff:
      enabled: false
    eslint:
      enabled: false
    biome:
      enabled: false
    shellcheck:
      enabled: false
    actionlint:
      enabled: false
    oxc:
      enabled: false
    languagetool:
      enabled: false
    yamllint:
      enabled: false
    semgrep:
      enabled: false
    markdownlint:
      enabled: false

chat:
  art: false
  auto_reply: false

knowledge_base:
  opt_out: false
  learnings:
    scope: "local"
  code_guidelines:
    enabled: true
    filePatterns:
      - "CLAUDE.md"
      - ".claude/rules/*.md"
      - "src/skills/CONTRIBUTING-SKILLS.md"

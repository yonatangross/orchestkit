[project]
name = "orchestkit"
version = "10.0.0-beta.97" # x-release-please-version
description = "OrchestKit Complete - AI-assisted development toolkit for Claude Code with 108 skills, 36 agents, and 171 hooks"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Yonatan Gross"}
]
keywords = ["claude", "claude-code", "ai", "development", "skills", "agents"]

# Minimal dependencies for template validation
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]
# Memory Fabric Agent SDK (for guaranteed MCP execution)
memory = [
    "anthropic>=0.40.0,<2",
]
# Template dependencies (for validating skill templates)
templates = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "sqlalchemy>=2.0.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "redis>=5.0.0",
]

[tool.ruff]
# Every package declares requires-python >=3.11, so the lint target is the
# same floor. Under py313 the UP rules treated PEP 695 generics
# (`def f[T: BaseModel]`, Python 3.12+) as the legal modern form, and #4265's
# lint pass rewrote one into a >=3.11 codebase. At py311 the UP046/UP047
# family can never emit syntax the declared floor cannot parse.
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".claude",
    "node_modules",
    "__pycache__",
    # Educational examples: prioritize clarity over strict linting.
    # Not root-anchored. The trees are src/skills/ and plugins/ork/skills/.
    "**/skills/*/templates",
    "**/skills/*/examples",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]
ignore = [
    "E501",  # Line too long (templates may have long lines for clarity)
    "B008",  # Function call in default argument (FastAPI Depends pattern is intentional)
]
[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = [
    "skills/**/*.py",
    "bin/*.py",
    ".claude/scripts/*.py",
]
exclude = [
    "**/__pycache__",
    "**/node_modules",
]
reportMissingImports = "warning"
reportMissingTypeStubs = false

[tool.ty.environment]
python-version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"

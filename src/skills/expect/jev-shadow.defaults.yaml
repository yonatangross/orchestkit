# Bundled fallback for the Jev shadow step (references/jev-shadow.md).
# .expect/config.yaml `jev_shadow:` overrides this whole section.
# Values live here, not in code: scripts/jev_shadow.py refuses to run
# without a resolved config.
jev_shadow:
  # POST target for the single per-step evaluation request.
  endpoint: "https://api.typesafe.ai/v1/systemone"
  # Pinned model id. `jev-latest` moves; a shadow comparison needs a fixed
  # model so agreement rates stay comparable across runs.
  model: "jev-1.13.0"
  # Max interactive elements sent per request (ref + role + name only).
  element_cap: 60
  # Max chars kept per accessible name after redaction.
  name_max_chars: 80
  # Max chars kept for step_goal and last_verify after redaction.
  context_max_chars: 300
  # Abort budget for the one request per step.
  latency_budget_ms: 400
  # Act mode only (ORK_EXPECT_JEV=1|act): a Choice confidence below this
  # floor falls back to the agent's own pick. Same scale as
  # thresholds.low_confidence, which only marks the record flag. Tuned on
  # the form-bench calibration split (r01/r04/r06/r07, formfill-v2-neg):
  # every observed raw-pick error sat at conf <= 0.40 and every pick
  # >= 0.45 was correct, so 0.5 defers the whole error band.
  act_confidence_floor: 0.5
  # Raised floor for list fields (checkboxes). The sealed split showed
  # list-membership errors riding at conf 0.60-0.77, inside the 0.5 gate;
  # 0.7 defers the middle band to the incumbent while clear picks still
  # decide. Checkbox decisions also carry a consistency gate: the list
  # answer and the final-state answer must agree or the field defers.
  act_list_confidence_floor: 0.7
  # Form path (requires --task-doc): max form-field questions added to the
  # per-step request (value Choice for fillable elements; checkboxes emit
  # two questions, a list-membership Choice plus a final-state Choice).
  field_cap: 12
  # Max chars kept for --task-doc after redaction.
  doc_max_chars: 1200
  # Prompt version stamped on every record as `prompt_id`.
  prompt_id: "jev-shadow-v4"
  thresholds:
    # Choice confidence below this marks the pick low_confidence in the log.
    low_confidence: 0.5
    # A noul at or above its threshold raises the matching flag in the record.
    goal_reached: 0.7
    page_changed_as_expected: 0.7
    blocked: 0.7

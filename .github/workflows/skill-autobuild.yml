# Generated by OrchestKit Claude Plugin
# Created: 2026-06-19

# Auto-build heal — regenerate committed build output for src-only PRs.
#
# Problem (#2528): editing a skill via the web UI / `gh api` / a one-line commit
# leaves plugins/{skills,commands} + src/hooks/dist + the docs reference mirror
# stale, so the "Build drift detected" gate fails — a correct source edit is
# rejected purely because the build artifacts weren't regenerated locally.
#
# Fix: on a PR that touches src/**, rebuild and commit the regenerated
# artifacts back to the PR branch, so the drift gate self-heals instead of
# failing.
#
# SECURITY MODEL (read before changing the triggers):
#   - Trigger is `pull_request`, NOT `pull_request_target`. A `pull_request`
#     run uses the workflow file from the PR's merge commit (not main), so a
#     PR CAN alter this file and scripts/ci/api-commit.mjs; the same-repo
#     check below is the real boundary (only people with push access).
#   - The job runs ONLY for same-repo PRs
#     (`head.repo.full_name == github.repository`). Fork PRs are skipped, so
#     untrusted PR code never executes with a write token, and forks have no
#     access to the App secrets anyway. This deliberately scopes auto-heal to
#     maintainer/bot branches (incl. web / `gh api` edits on this repo — the
#     actual #2528 pain). Fork contributors still build locally.
#
# CI RE-TRIGGER (#2528-A): the heal commit is written with a GitHub App token
# (RELEASE_BOT), NOT the default GITHUB_TOKEN. GitHub's recursion guard means a
# GITHUB_TOKEN write does NOT re-trigger required checks, so a bot heal-commit
# would leave the PR stuck "Expected, waiting for status" on the new HEAD.
# Writing as the App (a distinct actor) re-fires the `pull_request` required
# checks against the healed commit, so the Build drift gate re-runs and passes.
#
# SIGNED COMMITS (#5012): the heal commit is created through the Git Data API
# (scripts/ci/api-commit.mjs: blobs, tree, commit, fast-forward ref update),
# never by pushing from the runner. A commit the App creates through the API
# with no author or committer set is signed by GitHub (verification.verified
# true); the old runner-built commit was unsigned and got flagged by security
# review. The script refuses to move the branch if GitHub reports the new
# commit as unverified, and the ref update is fast-forward only (force=false).
#
# TOKEN BOUNDARY (#5016 review): two jobs on two runners. `build` runs the
# PR's code (npm ci + build) with no secret and hands over only a patch of
# the gated paths. `autoheal` mints the App token and runs no PR code: the
# PR head is checked out as data, the patch is applied, and api-commit.mjs
# comes from the base commit. A PR's build step cannot reach the token
# through GITHUB_ENV, NODE_OPTIONS or a background process, because none of
# those cross a job boundary. What the PR still controls: this workflow file
# itself (see SECURITY MODEL) and the patch content, which is the build
# output the commit is meant to carry; --strict refuses anything outside the
# gated paths. No checkout persists a credential.
#
#   - No loop: the heal commit touches plugins/ + docs, never src/** or
#     manifests/**, so THIS workflow's `paths:` filter does not re-fire even
#     though the App-token write is re-trigger-capable. It re-fires only the
#     drift-gated checks (ci.yml Build, Docs Site Build), which is the point.

name: Skill Build Autoheal

on:
  pull_request:
    paths:
      - 'src/**'
      - 'manifests/**'

# Default-deny; the job's only write path is the App token below.
permissions:
  contents: read

concurrency:
  group: skill-autobuild-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Job 1 runs the PR's code (npm ci + build) and holds NO secret. Its only
  # output is a patch of the gated paths plus a drift flag.
  build:
    name: autoheal-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SAME-REPO ONLY — never run (or grant write) for fork PRs.
    #
    # DEPENDABOT IS EXCLUDED ON PURPOSE. Dependabot-triggered runs read from
    # GitHub's separate *Dependabot* secret store, so `secrets.RELEASE_BOT_*`
    # resolve to empty strings and the token mint below dies in ~4s with
    # "'app-id' input must be set to a non-empty string". That surfaced as a
    # red `autoheal` check claiming the heal failed when it had never run,
    # which is actively misleading during triage.
    #
    # Skipping keeps the signal honest. When Dependabot bumps a dep under
    # src/** (e.g. src/hooks/package.json), the generated mirror in plugins/
    # goes stale and ci.yml's "Build drift detected" gate fails correctly.
    # Fix it by hand: check out the PR branch, `npm run build`, commit the
    # regenerated artifacts. See the PR that added this comment for the full
    # write-up of why the alternatives were rejected.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    outputs:
      drift: ${{ steps.diff.outputs.drift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.3
        with:
          # The exact head commit; the commit job builds on this same sha and
          # refuses if the branch has moved since.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Build (regenerate plugins/ + dist + docs mirrors)
        run: npm run build

      - name: Diff the gated paths into a patch
        id: diff
        run: |
          set -euo pipefail
          # Gated paths only (mirrors the Build + Docs Site drift gates); the
          # ungated docs/site/lib/generated churn is intentionally left out.
          # Hook bundles (src/hooks/dist, plugins/ork/hooks/dist) are excluded
          # since #3578: they are release-owned and a heal commit carrying them
          # would fail ci.yml's "release-owned" gate on the very PR it healed.
          GATED=(plugins/ ':!plugins/ork/hooks/dist' docs/site/content/docs/reference docs/site/content/docs/skills/by-category)
          mkdir -p "${RUNNER_TEMP}/heal"
          git add -A -- "${GATED[@]}"
          if git diff --cached --quiet -- "${GATED[@]}"; then
            echo "::notice::No build drift, source and committed artifacts already in sync."
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            git diff --cached --binary --full-index --no-renames -- "${GATED[@]}" > "${RUNNER_TEMP}/heal/heal.patch"
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the heal patch
        if: steps.diff.outputs.drift == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: skill-autoheal-patch
          path: ${{ runner.temp }}/heal/heal.patch
          if-no-files-found: error
          retention-days: 1

  # Job 2 holds the App token and runs NO code from the PR: it checks the PR
  # head out as data only, applies the patch, and runs api-commit.mjs taken
  # from the base commit (b35 HOLD on #5016: a token minted in the build job
  # was reachable from the PR's build steps through GITHUB_ENV / NODE_OPTIONS).
  autoheal:
    needs: build
    if: >-
      needs.build.outputs.drift == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GITHUB_TOKEN stays read-only; the heal commit is written with the App
    # token (#2528-A) so required checks re-trigger on the healed SHA.
    permissions:
      contents: read
    steps:
      - name: Check out the PR head (data only, nothing from it runs)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - name: Check out the base commit (source of api-commit.mjs)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.3
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: base/.nvmrc

      - name: Download the heal patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: skill-autoheal-patch
          path: ${{ runner.temp }}/heal

      - name: Apply the patch to the PR head
        working-directory: pr
        run: |
          set -euo pipefail
          # git apply refuses paths that leave the tree or go through a
          # symlink; --strict in api-commit.mjs then refuses any change
          # outside the gated paths.
          git apply --check --binary "${RUNNER_TEMP}/heal/heal.patch"
          git apply --binary "${RUNNER_TEMP}/heal/heal.patch"

      - name: Mint Release Bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: orchestkit
          permission-contents: write

      - name: Commit regenerated artifacts through the API (signed)
        working-directory: pr
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          MSG_FILE="${RUNNER_TEMP}/skill-autoheal-msg.txt"
          {
            echo "chore(build): regenerate skill artifacts [skill-autoheal]"
            echo
            echo "Auto-regenerated by .github/workflows/skill-autobuild.yml after a"
            echo "src-only edit left the committed build output stale (#2528)."
          } > "$MSG_FILE"
          node ../base/scripts/ci/api-commit.mjs --strict --branch "$HEAD_REF" --message-file "$MSG_FILE" -- \
            plugins/ ':!plugins/ork/hooks/dist' docs/site/content/docs/reference docs/site/content/docs/skills/by-category

# Generated by OrchestKit Claude Plugin
# Created: 2026-07-18

# Weekly sweep for stale forward-looking claims in skill/agent prose.
# Finds "see #N for ..." / "pending #N" style references whose issues are
# already CLOSED, and maintains a single rolling report issue.
# Companion to check-docs-facts (counts) — this one covers narrative claims.
name: Skill Claims Audit

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Run audit
        id: audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node scripts/audit-skill-claims.mjs --json > /tmp/claims.json
          # Two counts, not one. `stale` alone cannot tell a clean sweep from a
          # blind one: when every gh lookup fails the script used to emit
          # `stale: []`, this step wrote stale=0, and the step below marked the
          # rolling issue "clean". An empty array is byte-identical to a
          # triaged one (#3933). `unresolved` counts lookups that failed, and
          # an empty or unparseable claims file counts as blind too.
          STALE=$(jq -r '.stale | length' /tmp/claims.json 2>/dev/null)
          UNRESOLVED=$(jq -r '.unresolved // 0' /tmp/claims.json 2>/dev/null)
          SCANNED=$(jq -r '.scanned // 0' /tmp/claims.json 2>/dev/null)
          if [ -z "$STALE" ] || [ -z "$UNRESOLVED" ]; then
            echo "::error::audit-skill-claims produced no parseable JSON; treating the sweep as blind, not clean."
            STALE=0; UNRESOLVED=1; SCANNED=0
          fi
          if [ "$SCANNED" = "0" ]; then
            echo "::error::audit-skill-claims scanned zero files; treating the sweep as blind, not clean."
            UNRESOLVED=$((UNRESOLVED + 1))
          fi
          {
            echo "stale=$STALE"
            echo "unresolved=$UNRESOLVED"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Fail loudly when the sweep was blind
        if: ${{ steps.audit.outputs.unresolved != '0' }}
        env:
          UNRESOLVED: ${{ steps.audit.outputs.unresolved }}
        run: |
          echo "::error::${UNRESOLVED} issue lookup(s) failed; this run proves nothing about stale claims. Check GH_TOKEN, rate limits, and the /tmp/claims.json unresolved_refs list."
          jq -r '.unresolved_refs[]? | "  #\(.ref): \(.error)"' /tmp/claims.json || true
          exit 1

      - name: Update or create report issue
        if: ${{ steps.audit.outputs.stale != '0' && steps.audit.outputs.unresolved == '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="skill-claims audit: stale forward-looking issue references"
          BODY_FILE=/tmp/report.md
          {
            printf 'Weekly sweep found skill/agent prose describing CLOSED issues as pending. Fix the prose (state what shipped) rather than deleting the reference.\n\n'
            printf '```\n'
            jq -r '.stale[] | "\(.file):\(.line) -> #\(.refs | join(", #")): \(.excerpt)"' /tmp/claims.json
            printf '```\n\nGenerated by skill-claims-audit workflow.\n'
          } > "$BODY_FILE"
          EXISTING=$(gh issue list --state open --search "in:title skill-claims audit" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
          else
            gh issue create --title "$TITLE" --label docs --body-file "$BODY_FILE"
          fi

      - name: Mark report issue clean
        # Clean means swept AND every lookup answered. A blind sweep never
        # reaches this step (the fail-loud step above exits 1 first).
        if: ${{ steps.audit.outputs.stale == '0' && steps.audit.outputs.unresolved == '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Repo convention: issues close via PR merge, never gh issue close.
          # A clean sweep just gets noted on the rolling report issue.
          EXISTING=$(gh issue list --state open --search "in:title skill-claims audit" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Sweep is clean as of this run; safe to close via the next docs PR."
          fi

name: Tests & Security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  merge_group:
  workflow_dispatch:
  schedule:
    # Nightly at 2 AM UTC
    - cron: '0 2 * * *'

permissions: {}

# Cancel in-progress runs on new commits to same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAUDE_PROJECT_DIR: ${{ github.workspace }}

jobs:
  # ============================================================================
  # STAGE 0: Build + Artifacts (< 1m)
  # Single build, shared via artifacts to avoid rebuilding
  # ============================================================================
  build-plugins:
    name: Build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          build-plugins: 'true'
          run-ci-setup: 'false'
          install-hooks-deps: 'true'  # #2003: install src/hooks deps BEFORE build so hook dist is rebuilt into the shared artifact

      - name: Validate no symlinks
        run: |
          if find plugins/ -type l | grep -q .; then
            echo "ERROR: Found symlinks in plugins/"
            exit 1
          fi

      - name: Validate passive indexes
        run: bash tests/indexes/test-index-generation.sh

      # Drift gate covers BOTH committed dist copies (#2360): the setup step
      # above installs src/hooks deps, so build-plugins.sh rebuilds the hook
      # bundles from source before this diff — a stale committed lifecycle.mjs
      # (src/hooks/dist OR plugins/ork/hooks/dist) now fails here, including on
      # push to main (cross-PR staleness, the #2360 incident class).
      #
      # README.md and docs/site/lib/generated/ were ADDED to this list after
      # v9.3.0 shipped with all three stale. `npm run build` also runs
      # stamp-whats-new.mjs (README what's-new block) and the docs-site codegen
      # (changelog-data.ts, skills-data.ts, skill-graph-data.ts), but the gate
      # only diffed plugins/ and src/hooks/dist/, so those outputs could sit
      # stale indefinitely. They surfaced only because an unrelated change
      # forced a local rebuild. Same failure shape as #2360, wider blast radius.
      #
      # NOT covered here: package-lock.json. Its `version` field drifts from
      # release-please bumping package.json without running npm install, which
      # `npm run build` does not regenerate, so gating it here would fail for a
      # reason this job cannot fix.
      - name: Check for uncommitted build changes
        run: |
          GENERATED=(plugins/ src/hooks/dist/ README.md docs/site/lib/generated/)
          if ! git diff --quiet -- "${GENERATED[@]}"; then
            echo "::error::Build drift detected! Run 'npm run build' and commit the changes (${GENERATED[*]})."
            git diff --stat -- "${GENERATED[@]}"
            exit 1
          fi

      - name: Upload built plugins
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: built-plugins
          path: plugins/
          retention-days: 1

  # ============================================================================
  # STAGE 1: Fast Checks (< 30s)
  # ============================================================================
  lint:
    name: Static Analysis
    permissions:
      contents: read
    needs: build-plugins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download built plugins
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: built-plugins
          path: plugins/

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          build-plugins: 'false'
          ci-setup-flags: '--with-shellcheck'

      - name: Run lint checks
        run: bash tests/ci/lint.sh

      - name: Biome lint
        run: cd src/hooks && npx biome check src/

      - name: TypeScript typecheck
        run: cd src/hooks && npx tsc --noEmit -p tsconfig.test.json

      # Registry closure gate (#959 / #2886 bug class): every hook registered in
      # the entries maps must be reachable from hooks.json, agent/skill
      # frontmatter, or dispatcher fan-out. Fails on NEW dead hooks (ratchet
      # baseline in src/hooks/scripts/known-dead-hooks.json only shrinks), on
      # ghost references, and on count drift in the hooks.json description.
      - name: Hook registry closure
        run: cd src/hooks && node scripts/validate-registry.mjs

  # ============================================================================
  # STAGE 1b: Dependency Security Audit (BLOCKING)
  # ============================================================================
  security-audit:
    name: Dependency Audit
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: '22'

      - name: Audit root dependencies
        run: npm audit --audit-level=critical

      - name: Audit hooks dependencies
        working-directory: src/hooks
        run: npm audit --audit-level=critical

  # ============================================================================
  # STAGE 1c: Secret Scanning
  # ============================================================================
  secret-scanning:
    name: Secret Scanning
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # STAGE 1d: PR Playground Validation (PRs only)
  # Ensures every non-trivial PR includes an interactive playground
  # ============================================================================
  playground-check:
    name: PR Playground
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # One decision, consumed by both steps below. It used to be copy-pasted
      # into each of them, which is how they drift.
      - name: Decide whether a playground is required
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -uo pipefail

          skip() {
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$1"
            exit 0
          }

          # Bot PRs never carry a playground.
          if [[ "$PR_AUTHOR" == "dependabot[bot]" || "$PR_AUTHOR" == "release-please[bot]" || "$PR_AUTHOR" == "github-actions[bot]" || "$PR_AUTHOR" == "orchestkit-release-bot[bot]" ]]; then
            skip "Skipping playground check for bot PR ($PR_AUTHOR)"
          fi

          # Automated branches, kept as a cheap fast path.
          if [[ "$HEAD_REF" =~ ^(dependabot/|release-please|renovate/|chore/cc-snapshot-|ci/) ]]; then
            skip "Skipping playground check for automated branch ($HEAD_REF)"
          fi

          # Path-based inertness.
          #
          # The branch rule above already encodes this intent ("vercel.json,
          # .github/, *.toml have nothing user-facing to playground") but keys it
          # on a branch NAME, which only works for branches we name ourselves. An
          # outside contributor fixing a typo in README.md has no such prefix, so
          # the gate demanded a hand-authored interactive playground for a
          # one-line docs diff — and being a REQUIRED check, it hard-blocked the
          # PR with no path forward. Hit for real on #3193.
          #
          # Fail-closed on purpose: a changed file matching nothing here still
          # REQUIRES a playground, so a new user-facing directory is never
          # silently exempted just because this list predates it.
          # NOTE the `.*` after `\.github/`: the trailing `$` anchors the whole
          # alternation, so a bare `\.github/` would only match a file literally
          # named ".github/" and every real workflow path would fall through to
          # "playground required".
          INERT='^(README\.md|CHANGELOG\.md|CONTRIBUTING\.md|SECURITY\.md|CODE_OF_CONDUCT\.md|LICENSE|\.github/.*|vercel\.json|[^/]*\.toml)$'

          FILES=$(gh pr diff "$PR_NUMBER" --name-only 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Could not read the PR diff; requiring a playground (fail-closed)."
            exit 0
          fi

          # grep -v exits 0 when SOME line fails to match, i.e. a non-inert file
          # exists. Negating it means "every changed file is inert".
          #
          # Here-string, NOT `printf ... | grep -q`. grep -q early-exits on the
          # first match, which SIGPIPEs the producer; under `pipefail` that 141
          # propagates and flips this `if` non-deterministically (#603). In a
          # REQUIRED gate that races fail-OPEN: a user-facing PR would sometimes
          # be waved through with no playground. A here-string has no producer
          # process, so there is nothing to signal.
          if ! grep -qvE "$INERT" <<< "$FILES"; then
            skip "Skipping playground check: every changed file is docs or config only"
          fi

          echo "required=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Playground required (PR touches user-facing paths)"

      - name: Check playground exists
        if: steps.gate.outputs.required == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Derive docs directory from branch name (/ → --)
          BRANCH_DIR=$(echo "$HEAD_REF" | sed 's|/|--|g')
          DOCS_DIR="docs/${BRANCH_DIR}"

          if [ ! -d "$DOCS_DIR" ]; then
            echo "::error::Missing PR playground directory: ${DOCS_DIR}/"
            echo "::error::Create an interactive HTML playground for this PR."
            echo "::error::Run: /playground:playground <description of changes>"
            echo "::error::Then commit to: ${DOCS_DIR}/<name>.html"
            exit 1
          fi

          HTML_COUNT=$(find "$DOCS_DIR" -name '*.html' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$HTML_COUNT" -eq 0 ]; then
            echo "::error::No .html files found in ${DOCS_DIR}/"
            echo "::error::Create an interactive HTML playground for this PR."
            exit 1
          fi

          echo "::notice::Found ${HTML_COUNT} playground file(s) in ${DOCS_DIR}/"

      - name: Check playground link in PR body
        if: steps.gate.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_BODY=$(gh pr view "$PR_NUMBER" --json body -q .body 2>/dev/null || echo "")
          if ! echo "$PR_BODY" | grep -qi "playground"; then
            echo "::error::PR body is missing a Playground section."
            echo "::error::Add an '## Interactive Playground' section with a link to the HTML file."
            echo "::error::Example: **[Open Playground](https://htmlpreview.github.io/?https://github.com/...)**"
            exit 1
          fi
          echo "::notice::PR body contains playground reference"

  # ============================================================================
  # STAGE 2: Unit Tests (< 5m)
  # Node versions: 20 (LTS), 22 (Current LTS)
  # Uses dynamic test discovery
  # ============================================================================
  unit-tests:
    name: Unit Tests (node ${{ matrix.node-version }})
    permissions:
      contents: read
    needs: build-plugins
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download built plugins
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: built-plugins
          path: plugins/

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
          build-plugins: 'false'

      - name: Run unit tests
        shell: bash
        run: |
          export CLAUDE_PROJECT_DIR="${{ github.workspace }}"
          bash scripts/ci/run-tests.sh tests/unit --verbose

  # ============================================================================
  # STAGE 2b: TypeScript Hook Tests (vitest)
  # Node version matrix
  # ============================================================================
  hook-typescript-tests:
    name: TypeScript Tests (node ${{ matrix.node-version }}, shard ${{ matrix.shard }})
    permissions:
      contents: read
    needs: build-plugins
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # node:sqlite (M168 session registry, #2005) requires Node >= 22.5, so
        # hooks no longer support Node 20. Matrix dropped to 22+ accordingly.
        node-version: ['22']
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
          build-plugins: 'false'
          run-ci-setup: 'false'
          install-hooks-deps: 'true'

      - name: Run vitest
        shell: bash
        working-directory: src/hooks
        run: npx vitest run --reporter=verbose --shard=${{ matrix.shard }} --retry 2

  # ============================================================================
  # STAGE 3: Security Tests (< 3m)
  # ZERO TOLERANCE: Any failure blocks merge
  # ============================================================================
  security-tests:
    name: Security Tests
    permissions:
      contents: read
    needs: [build-plugins]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download built plugins
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: built-plugins
          path: plugins/

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          build-plugins: 'false'

      # No extra installs needed for the npm audit gate: it now audits every tree
      # --package-lock-only, so it reads lockfiles instead of requiring node_modules.
      # An install-based fix was tried first and is wrong here — docs/site pulls
      # @yonatan-hq/analytics from GitHub Packages and NPM_TOKEN is deliberately
      # withheld on pull_request runs (#2536), so `npm ci` 401s on every PR.
      - name: Run security tests
        shell: bash
        run: |
          export CLAUDE_PROJECT_DIR="${{ github.workspace }}"
          bash scripts/ci/run-tests.sh tests/security --verbose

      # A green security suite is not evidence: 47 of 103 functions could not
      # fail and it stayed green for months. This inverts one deny/ask
      # expectation per file and demands the file notice. A new security test
      # must be either mutation-provable or explicitly declared static.
      # Deliberately a step in THIS job, not a job of its own: the runtime is a
      # small fraction of the suite it follows, and integration-tests already
      # `needs: security-tests`, so a separate job would cost a runner and a
      # checkout to gate the same thing.
      - name: Security mutation gate (can these tests fail?)
        shell: bash
        run: |
          export CLAUDE_PROJECT_DIR="${{ github.workspace }}"
          bash tests/security/mutation-gate.sh

  # ============================================================================
  # STAGE 4: Integration Tests (< 5m)
  # Uses dynamic test discovery
  # ============================================================================
  integration-tests:
    name: Integration Tests
    permissions:
      contents: read
    needs: [unit-tests, security-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download built plugins
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: built-plugins
          path: plugins/

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          build-plugins: 'false'

      - name: Run integration tests
        shell: bash
        run: |
          export CLAUDE_PROJECT_DIR="${{ github.workspace }}"
          bash scripts/ci/run-tests.sh tests/integration --verbose

      - name: Run e2e tests
        shell: bash
        run: |
          export CLAUDE_PROJECT_DIR="${{ github.workspace }}"
          bash scripts/ci/run-tests.sh tests/e2e --verbose

  # ============================================================================
  # STAGE 5: Performance Tests (< 2m)
  # Uses dynamic test discovery
  # ============================================================================
  performance-tests:
    name: Performance Tests
    permissions:
      contents: read
    needs: [build-plugins]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download built plugins
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: built-plugins
          path: plugins/

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          build-plugins: 'false'

      - name: Run performance tests
        shell: bash
        run: |
          export CLAUDE_PROJECT_DIR="${{ github.workspace }}"
          bash scripts/ci/run-tests.sh tests/performance --verbose

  # ============================================================================
  # STAGE 6: Compliance Tests
  # Uses dynamic test discovery
  # ============================================================================
  compliance-tests:
    name: Compliance Tests
    permissions:
      contents: read
    needs: [build-plugins]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download built plugins
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: built-plugins
          path: plugins/

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          build-plugins: 'false'

      - name: Run compliance tests
        shell: bash
        run: |
          export CLAUDE_PROJECT_DIR="${{ github.workspace }}"
          bash scripts/ci/run-tests.sh tests/compliance --verbose

      # tests/evals was never in this list, so its four guards (quality-index,
      # dead-generation #3036, eval-coverage, effective-recall) all passed
      # locally and gated nothing. Same dead-gate shape as the islands suite.
      # These are pure logic/arithmetic and make no model calls.
      - name: Run eval-harness guard tests
        shell: bash
        run: |
          export CLAUDE_PROJECT_DIR="${{ github.workspace }}"
          bash scripts/ci/run-tests.sh tests/evals --verbose

  # ============================================================================
  # STAGE 7: Agent & Skill Validation
  # Uses dynamic test discovery
  # ============================================================================
  agent-skill-tests:
    name: Agents & Skills
    permissions:
      contents: read
    needs: [build-plugins]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download built plugins
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: built-plugins
          path: plugins/

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          build-plugins: 'false'

      - name: Run agent tests
        shell: bash
        run: |
          export CLAUDE_PROJECT_DIR="${{ github.workspace }}"
          bash scripts/ci/run-tests.sh tests/agents --verbose

      - name: Run skill tests
        shell: bash
        run: |
          export CLAUDE_PROJECT_DIR="${{ github.workspace }}"
          bash scripts/ci/run-tests.sh tests/skills --verbose

      # HISTORY, do not re-add explicit .mjs lines here: run-tests.sh once
      # globbed only `test-*.sh`, so two .mjs structure tests were invoked
      # explicitly at this spot to make upstream drift block merges (#2699).
      # The runner's default glob has covered `test-*.mjs` since #3228, which
      # made those explicit lines run the same tests twice in this job — they
      # were removed 2026-08-01. The glob above is now the single execution
      # path, and the tests still block merges through it.

      - name: Run subagent definition tests
        shell: bash
        run: |
          export CLAUDE_PROJECT_DIR="${{ github.workspace }}"
          bash scripts/ci/run-tests.sh tests/subagents --verbose

  # ============================================================================
  # STAGE 7b: Manifest, Schema & Hook Compliance
  # Tests not previously covered in CI
  # ============================================================================
  manifest-schema-tests:
    name: Manifests & Schemas
    permissions:
      contents: read
    # No `needs: [build-plugins]` and no artifact download (#2036): this job BUILDS
    # plugins fresh from its OWN checkout so src/ and the compiled dist/ are
    # guaranteed in sync. Trusting the built-plugins artifact let a stale dist
    # (built from a commit predating a src change) fail tests/hooks
    # test-run-hook-dispatcher.sh 7c DETERMINISTICALLY — the recurring family
    # #1794/#1797/#1990/#2003. (The old comment here blamed a better-sqlite3 static
    # import; that was the pre-#2003 failure mode, not this src↔dist divergence.)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment (build plugins fresh from source)
        uses: ./.github/actions/setup
        with:
          build-plugins: 'true'   # rebuild plugins/ from this checkout's src/ (not a stale artifact)
          run-ci-setup: 'false'
          install-hooks-deps: 'true'  # npm ci in src/hooks BEFORE build → src/hooks/dist rebuilt from src

      - name: Run manifest tests
        run: bash scripts/ci/run-tests.sh tests/manifests --verbose

      - name: Run schema tests
        run: bash scripts/ci/run-tests.sh tests/schemas --verbose

      - name: Run hook compliance tests
        run: bash scripts/ci/run-tests.sh tests/hooks --verbose

      - name: Run index tests
        run: bash scripts/ci/run-tests.sh tests/indexes --verbose

      # The five dirs below had ZERO blocking coverage until 2026-08-02: they sat
      # outside every run-tests.sh glob, so their gates could go red on main with
      # nothing failing. tests/plugins/test-command-frontmatter-passthrough.sh did
      # exactly that — it was red on main naming the dropped `background` key
      # (#3243) and nobody saw it. tests/fixtures is deliberately NOT globbed:
      # test-helpers.sh is a sourced helper library whose standalone exit 0 would
      # read as fake coverage.
      - name: Run plugin structure tests
        run: bash scripts/ci/run-tests.sh tests/plugins --verbose

      # tests/quality gates the playground visual standard. Exemplars are BLOCKING
      # (they are what every artifact is copied from); shipped artifacts are advisory
      # until PLAYGROUND_STANDARD_ENFORCE=1. Note CI sees only TRACKED artifacts
      # (171 on 2026-08-04) while a local run scans the working tree (192), so the
      # advisory denominator here is legitimately smaller than a dev's. Wired here AND in
      # tests/run-all-tests.sh — a dir in one roster but not the other is the
      # silently-dead-gate class this comment block already documents.
      - name: Run quality tests
        run: bash scripts/ci/run-tests.sh tests/quality --verbose

      - name: Run orphan tests
        env:
          # unreachable-skills holds a 21-skill baseline tracked in #3313 (was 29
          # until the gates learned the agent-body Read() activation path);
          # advisory here so wiring the OTHER three orphan gates does not import
          # that debt as a permanent red. The detector exits 1 on ANY unreachable
          # skill, so this env can only drop once the count reaches 0, which
          # needs the 20-skill product decision in #3313.
          ORK_UNREACHABLE_SKILLS_ADVISORY: '1'
        run: bash scripts/ci/run-tests.sh tests/orphans --verbose

      - name: Run build, ci, worktree, external tests
        run: |
          bash scripts/ci/run-tests.sh tests/build --verbose
          bash scripts/ci/run-tests.sh tests/ci --verbose
          bash scripts/ci/run-tests.sh tests/worktree --verbose
          bash scripts/ci/run-tests.sh tests/external --verbose

  # ============================================================================
  # STAGE 7c: Static Analysis Pipeline (eval:static)
  # ============================================================================
  eval-static:
    name: Static Analysis Pipeline
    permissions:
      contents: read
    needs: [build-plugins]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download built plugins
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: built-plugins
          path: plugins/

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          build-plugins: 'false'

      - name: Run eval:static
        run: npm run eval:static

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: static-analysis-results
          path: tests/evals/results/static-analysis.json
          retention-days: 30
        if: always()

  # ============================================================================
  # STAGE 8: System Tests
  # Uses dynamic test discovery
  # ============================================================================
  system-tests:
    name: System Tests
    permissions:
      contents: read
    needs: [build-plugins]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download built plugins
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: built-plugins
          path: plugins/

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          build-plugins: 'false'

      - name: Run config tests
        shell: bash
        run: |
          export CLAUDE_PROJECT_DIR="${{ github.workspace }}"
          bash scripts/ci/run-tests.sh tests/config --verbose

      - name: Run feedback tests
        shell: bash
        run: |
          export CLAUDE_PROJECT_DIR="${{ github.workspace }}"
          bash scripts/ci/run-tests.sh tests/feedback --verbose


  # ============================================================================
  # STAGE 9: Coverage Report
  # ============================================================================
  coverage-report:
    name: Hook Coverage
    permissions:
      contents: read
    needs: [unit-tests, security-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download built plugins
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: built-plugins
          path: plugins/

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          build-plugins: 'false'
          install-hooks-deps: 'true'  # vitest coverage run below needs src/hooks/node_modules

      # Produce coverage/coverage-summary.json so hook-coverage-report.sh takes
      # its real-JSON path instead of silently falling back to the filename-grep
      # heuristic (which measured "a test file mentions the hook", not coverage).
      # This run also enforces the vitest.config.ts coverage thresholds
      # (lines 70 / functions 72 / branches 65 / statements 70).
      - name: Run vitest with coverage
        shell: bash
        working-directory: src/hooks
        run: npx vitest run --coverage

      - name: Generate hook coverage report
        shell: bash
        run: |
          set -o pipefail  # tee must not mask the report script's exit code
          export CLAUDE_PROJECT_DIR="${{ github.workspace }}"
          # Gates on REAL vitest line coverage now that the step above writes
          # coverage-summary.json (real lines ≈84% as of 2026-07; the ~73% note
          # in vitest.config.ts is stale). Stricter than vitest thresholds.lines=70.
          export COVERAGE_THRESHOLD=75
          bash tests/coverage/hook-coverage-report.sh | tee coverage-report.txt

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: hook-coverage-report
          path: coverage-report.txt
          retention-days: 30


  # ============================================================================
  # Final Summary
  # ============================================================================
  summary:
    name: CI Summary
    permissions:
      contents: read
    needs: [build-plugins, lint, security-audit, secret-scanning, playground-check, unit-tests, hook-typescript-tests, security-tests, integration-tests, performance-tests, compliance-tests, agent-skill-tests, manifest-schema-tests, eval-static, system-tests, coverage-report]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "=== CI Summary ==="
          echo "Build: ${{ needs.build-plugins.result }}"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Security Audit: ${{ needs.security-audit.result }}"
          echo "Secret Scanning: ${{ needs.secret-scanning.result }}"
          echo "PR Playground: ${{ needs.playground-check.result }}  (required check — gates merge on its own; not re-aggregated here)"
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Hook TS Tests: ${{ needs.hook-typescript-tests.result }}"
          echo "Security Tests: ${{ needs.security-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "Performance Tests: ${{ needs.performance-tests.result }}"
          echo "Compliance Tests: ${{ needs.compliance-tests.result }}"
          echo "Agent & Skill Tests: ${{ needs.agent-skill-tests.result }}"
          echo "Manifests & Schemas: ${{ needs.manifest-schema-tests.result }}"
          echo "Static Analysis Pipeline: ${{ needs.eval-static.result }}"
          echo "System Tests: ${{ needs.system-tests.result }}"
          echo "Coverage Report: ${{ needs.coverage-report.result }}"

          # ADVISORY jobs are reported above but MUST NOT fail this summary.
          #
          # playground-check asks for a hand-authored HTML playground per PR.
          # It IS in the repo's required-status-checks list, so a red
          # playground-check already makes the PR unmergeable on its own.
          # This summary is ALSO required, so counting playground-check in the
          # blocking loop below would fail the same PR twice for one cause and
          # obscure which gate actually needs attention. It is therefore
          # reported here but deliberately NOT re-aggregated.
          #
          # Do not describe this gate as "advisory" — it blocks. The exemptions
          # are branch-based (bot PRs, and the dependabot/ release-please/
          # renovate/ chore-cc-snapshot-/ ci/ prefixes), not severity-based.
          if [[ "${{ needs.playground-check.result }}" == "failure" ]]; then
            echo "::warning title=PR Playground::No playground found for this PR. The PR Playground check is REQUIRED and will block merge until this is resolved (this summary does not re-aggregate it). Add docs/<branch-slug>/*.html, or use a documented exempt branch prefix if the change has no user-visible surface."
          fi

          # Fail only on explicit failures (skipped jobs are OK - they use path filters)
          FAILED=0
          for result in \
            "${{ needs.build-plugins.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.security-audit.result }}" \
            "${{ needs.secret-scanning.result }}" \
            "${{ needs.unit-tests.result }}" \
            "${{ needs.hook-typescript-tests.result }}" \
            "${{ needs.security-tests.result }}" \
            "${{ needs.integration-tests.result }}" \
            "${{ needs.performance-tests.result }}" \
            "${{ needs.compliance-tests.result }}" \
            "${{ needs.agent-skill-tests.result }}" \
            "${{ needs.manifest-schema-tests.result }}" \
            "${{ needs.eval-static.result }}" \
            "${{ needs.system-tests.result }}" \
            "${{ needs.coverage-report.result }}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              FAILED=1
            fi
          done

          if [[ "$FAILED" == "1" ]]; then
            echo "::error::One or more CI stages failed"
            exit 1
          fi

          echo "::notice::All CI stages passed!"

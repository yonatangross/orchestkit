# Generated by OrchestKit Claude Plugin
# Created: 2026-04-27
# M125 #7: weekly upstream version watcher.
#
# 2026-07-25: no longer npm-only. scripts/check-labs-versions.mjs now resolves npm AND PyPI, so
# this also watches the LangChain ecosystem (langgraph, langfuse, and the dormant
# langgraph-supervisor / langgraph-swarm in the track-only tier). Before that, every PyPI package
# was structurally invisible to the only currency gate the repo has.

name: Upstream Version Watch
on:
  # POLICY: real `claude -p` calls run LOCALLY during dev, never automatically
  # in CI. Max-plan OAuth costs $0 in dollars but draws on the SHARED WEEKLY
  # QUOTA, the same pool as interactive sessions, so an automatic run silently
  # competes with the operator for their own capacity. Measured 2026-07-28: one
  # 51-skill sweep fired ~904 API calls in a single run and exhausted the cap.
  # Manual dispatch only. Do NOT re-add schedule/pull_request/issues triggers.
  workflow_dispatch:

# Default-deny at workflow level; writes scoped to the check-and-pr job.
permissions:
  contents: read

concurrency:
  group: labs-version-watch
  cancel-in-progress: false

jobs:
  check-and-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # push branch
      pull-requests: write  # gh pr create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.3 # zizmor: ignore[artipacked] - persisted GITHUB_TOKEN is required for the git push in the Open PR step

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: '20'

      - name: Detect drift
        id: detect
        run: |
          if node scripts/check-labs-versions.mjs --check; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply updates
        if: steps.detect.outputs.drift == 'true'
        run: node scripts/check-labs-versions.mjs --apply

      # Regenerate plugins/ so the committed twins match the bumped src/skills/
      # frontmatter. Without this the build-drift gate fails on the resulting PR.
      - name: Rebuild plugins
        if: steps.detect.outputs.drift == 'true'
        run: |
          npm ci
          npm run build

      - name: Build summary
        if: steps.detect.outputs.drift == 'true'
        id: summary
        run: |
          {
            echo 'body<<EOF'
            echo 'Auto-generated by `.github/workflows/labs-version-watch.yml` (M125 #7).'
            echo ''
            echo 'Bumped `upstream-version-tested:` frontmatter in skills that drifted from registry latest (npm + PyPI):'
            echo ''
            echo '```'
            git diff --stat src/skills/ || true
            echo '```'
            echo ''
            echo 'Body version mentions in skill content may need manual review — this PR only updates the frontmatter pin.'
            echo ''
            echo '## Interactive Playground'
            echo ''
            echo '**[Open Playground](https://htmlpreview.github.io/?https://github.com/yonatangross/orchestkit/blob/main/docs/playgrounds/vercel-labs-integration.html)** — see how the four packages compose.'
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: steps.detect.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ steps.summary.outputs.body }}
        run: |
          set -euo pipefail
          BRANCH="chore/labs-version-watch-$(date -u +%Y-%m-%d)"
          git config user.name "orchestkit-release-bot"
          git config user.email "orchestkit-release-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/skills/ plugins/
          git commit -m "chore(labs): bump upstream-version-tested pins for drifted skills"
          git push -u origin "$BRANCH"

          # Assert the OUTPUT side, not the exit code. A scheduled job that runs green while
          # writing nothing is indistinguishable from "nothing to do" — that is how ci-sentinel
          # burned a claude -p call per PR for months and produced no comment and no ledger row.
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "::error::push reported success but origin/$BRANCH does not exist"
            exit 1
          fi

          if gh pr create \
            --title "chore(deps): weekly upstream pin sync" \
            --body "$PR_BODY" \
            --label "chore" \
            --label "vercel-labs"; then
            echo "opened PR for $BRANCH"
          else
            # Non-fatal (a PR may already exist for this branch) but it must be VISIBLE in the
            # Actions UI, not swallowed by `|| true`.
            echo "::warning::gh pr create failed for $BRANCH — branch is pushed, open the PR manually"
          fi

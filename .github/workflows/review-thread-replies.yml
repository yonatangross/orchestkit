# Generated by OrchestKit Claude Plugin
# Created: 2026-10-22
#
# Review threads replied: fails while any review thread a BOT started
# (CodeRabbit, Codex, any `[bot]` author) has no reply from a person or an
# agent, resolved or not. Operator word GROK-REVIEW-2121 (2026-10-22):
#   1. No silent resolves: every bot thread gets an in-thread reply (the fix
#      commit link + file:line + the test, or won't-fix + the reason), and is
#      resolved only after the fix is verified.
#   2. This check is the repo-side gate for item 1. It is meant to be a
#      REQUIRED status check; the operator adds it to branch protection.
#
# It reruns on every event that can change the answer: a push, a bot review
# landing after the first run, and a reply. Resolving a thread does not change
# it (a resolved bot thread with no reply still fails), and Actions has no
# thread-resolve trigger anyway.
#
# The script runs from the BASE branch, never the PR head, so a PR cannot
# weaken its own gate by editing it. Only while the base does not carry the
# script yet (the PR that introduces it) does the head copy run, with a notice.

name: Review Threads Replied

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: review-thread-replies-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  replied:
    name: Review threads replied
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the base branch (the gate's own code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: Check out the PR head (only when the base lacks the script)
        id: head
        if: ${{ hashFiles('base/scripts/ci/review-thread-replies.py') == '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: Every bot review thread has a reply
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          FROM_HEAD: ${{ steps.head.outcome == 'success' }}
        run: |
          script=base/scripts/ci/review-thread-replies.py
          if [ "$FROM_HEAD" = "true" ]; then
            echo "::notice::The base branch does not carry the script yet; running the PR head copy (this PR introduces it)."
            script=head/scripts/ci/review-thread-replies.py
          fi
          python3 "$script" --repo "$REPO" --pr "$PR"

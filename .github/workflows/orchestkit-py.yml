name: orchestkit-py

on:
  push:
    branches: [main]
    paths:
      - "packages/orchestkit-py/**"
      - ".github/workflows/orchestkit-py.yml"
  pull_request:
    paths:
      - "packages/orchestkit-py/**"
      - ".github/workflows/orchestkit-py.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: mypy · pytest · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: packages/orchestkit-py/pyproject.toml
      - name: Install
        working-directory: packages/orchestkit-py
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build
      - name: Typecheck
        working-directory: packages/orchestkit-py
        run: mypy src/
      - name: Lint
        working-directory: packages/orchestkit-py
        run: ruff check src/ tests/
      - name: Test
        working-directory: packages/orchestkit-py
        run: pytest -v --tb=short
      - name: Build
        working-directory: packages/orchestkit-py
        run: python -m build --outdir dist/
      - name: Import from wheel
        working-directory: packages/orchestkit-py
        run: |
          python -m venv /tmp/ork-py
          /tmp/ork-py/bin/pip install dist/*.whl
          /tmp/ork-py/bin/python -c "from orchestkit import create_client, __version__; assert __version__ == '0.1.0'"

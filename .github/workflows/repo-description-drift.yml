# Generated by OrchestKit Claude Plugin
# Created: 2026-11-01
# Issue: #3667, repo description counts drift silently.
#
# The GitHub repo description carries skill, agent and hook counts. It is
# repository metadata, not a file, so stamp-counts.sh cannot rewrite it and no
# PR check can read it; it aged to "217 hooks" while the truth was 171.
# This workflow compares the live description with README's stamped markers
# (themselves gated against src/ by stamp-counts.sh --check) and fails on
# drift, printing the fragment to paste. Read-only: GITHUB_TOKEN can read a
# public repo's description, and nothing here writes it.
#
# Not a per-PR check: a PR cannot change repository metadata, so a red check
# there would block work nobody in the PR can fix. It runs when README's
# counts change on main, weekly, and on demand.
name: Repo description drift

on:
  push:
    branches: [main]
    paths: [README.md]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-description-drift
  cancel-in-progress: true

jobs:
  check:
    name: Repo description counts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the description with README's stamped counts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/check-repo-description.sh --repo "$REPO"

# Generated by OrchestKit Claude Plugin
# Created: 2026-08-10

# CC hook-output-key contract probe. READ ONLY.
#
# THE HOLE THIS FILLS
#
# scripts/derive-cc-output-keys.mjs derives the hook-output-key contract from the
# shipped Claude Code binary and writes src/hooks/bin/cc-output-keys.generated.mjs.
# CI then validates OrchestKit against that COMMITTED file. Measured 2026-08-10:
# grepping all 31 workflows for the derive script returned ZERO hits, so nothing
# ever re-derived the snapshot. CI has been checking OrchestKit against a file no
# process refreshes — green for as long as the snapshot happens to be current.
#
# WHY @latest AND NOT THE SUPPORT FLOOR
#
# Every other CC install in this repo is pinned to the support floor. That pin is
# correct for jobs that must be reproducible, and fatal here. The drift check at
# derive-cc-output-keys.mjs:141 is missing-only:
#
#     binaryEvents.filter(e => !allowed.has(e))
#
# An OLDER binary names a SUBSET of the events, so the difference is empty and the
# gate prints OK. A floor-pinned host does not merely fail to see newer drift, it
# PASSES VACUOUSLY. Probing the newest published release is the entire point, so
# this job installs the newest and accepts that its version moves under it.
#
# WHY A SEPARATE FILE, AND WHY IT MUST STAY ONE
#
# tests/unit/test-no-llm-in-ci.sh forbids an automatic trigger in any workflow FILE
# whose text matches its signature list. The match is textual: a file that merely
# QUOTES those strings trips the guard, even in a comment. So this file describes
# that policy strictly by reference and never reproduces the pattern. Do not paste
# the signature here, and do not merge this job into a file that spends quota.
#
# This job may be scheduled because it cannot spend quota: it installs the CLI,
# reads version strings out of the binary, and compares them to a committed file.
# No model is invoked. Do not add a step that invokes one.
#
# WHY FAILURE IS LOUD, UNLIKE labs-version-probe.yml
#
# That probe deliberately never fails the nightly, because pin drift is
# informational. Here BOTH non-zero exits are actionable and both fail the job:
#
#   1  drift            the binary names an event our allow-list lacks, so hooks
#                       are writing to a contract the binary contradicts
#   2  CANNOT-OBSERVE   the binary was not found, so the gate saw nothing. A
#                       contract gate that cannot observe must never look green;
#                       that failure mode is the reason this workflow exists.
#
# OPEN QUESTION ON FIRST RUN
#
# derive-cc-output-keys.mjs finds the binary only under
# ~/.local/share/claude/versions/<x.y.z>. Whether the npm install populates that
# path on a GitHub runner was NOT verifiable from the repo, so the first dispatch
# is the experiment. The "Report where the binary landed" step below prints the
# directory listing unconditionally, so a CANNOT-OBSERVE result names the actual
# layout instead of leaving someone to guess.

name: CC Contract Probe

on:
  schedule:
    - cron: "0 7 * * *"  # daily 07:00 UTC, offset from labs-version-probe (05:00)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cc-contract-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: '22'

      # --ignore-scripts then an explicit install.cjs run: the npm postinstall is
      # what fetches the native binary, and skipping it leaves a CLI that cannot
      # start. Same two-step used by the other CC-installing workflows here.
      - name: Install the newest published CLI
        run: |
          set -uo pipefail
          npm install -g @anthropic-ai/claude-code@latest --ignore-scripts
          node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs"
          claude --version

      # Unconditional, and printed BEFORE the check runs. If the check reports
      # CANNOT-OBSERVE, this listing is the only evidence of where the binary
      # actually went, and without it the next person repeats this experiment.
      - name: Report where the binary landed
        run: |
          set -uo pipefail
          {
            echo '## Binary layout'
            echo '```'
            echo "which: $(command -v claude || echo '<not on PATH>')"
            for d in "$HOME/.local/share/claude/versions" "$HOME/.local/share/claude" "$HOME/.claude"; do
              if [ -d "$d" ]; then
                echo "$d:"
                ls -1 "$d" 2>&1 || true
              else
                echo "$d: ABSENT"
              fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Derive the contract and compare to the committed snapshot
        run: |
          # `|| rc=$?` is required, not stylistic: Actions runs this with `bash -e`,
          # so a non-zero exit would kill the step before the summary is written and
          # the operator would see a red X with no explanation of which failure it was.
          set -uo pipefail
          rc=0
          node scripts/derive-cc-output-keys.mjs --check > /tmp/contract.txt 2>&1 || rc=$?
          {
            echo '## CC hook-output-key contract'
            echo ''
            if [ "$rc" -eq 0 ]; then
              echo 'OK — every event the binary names is present in the committed allow-list.'
            elif [ "$rc" -eq 1 ]; then
              echo 'DRIFT — the binary names an event the allow-list lacks, so hooks are writing'
              echo 'to a contract the binary contradicts. Re-run the derive locally and commit'
              echo 'the regenerated module.'
            elif [ "$rc" -eq 2 ]; then
              echo 'CANNOT-OBSERVE — the binary was not found, so nothing was verified. Read the'
              echo 'binary-layout summary above and fix the install or the lookup path. A contract'
              echo 'gate that cannot observe must never look green.'
            else
              echo "Unexpected exit ${rc}."
            fi
            echo ''
            echo '```'
            cat /tmp/contract.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

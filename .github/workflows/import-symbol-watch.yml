# Generated by OrchestKit Claude Plugin
# Created: 2026-07-25

# Nightly import-symbol watch.
#
# Closes the gap no version gate can: a symbol that never existed at ANY version.
# `import { LangfuseExporter } from "@langfuse/otel"` shipped in four skill files and passed lint,
# structure tests, floor agreement and the upstream-drift linter, because all of those compare
# VERSIONS. This compares SYMBOLS against the published type declarations.
#
# Deliberately NOT a PR gate: it needs the network, and a gate that flakes when a registry has a
# bad afternoon is a gate people learn to ignore. It reports; humans triage.

name: Import Symbol Watch
on:
  schedule:
    - cron: "0 6 * * *"  # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-symbol-watch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Least privilege: this job only reads the repo and writes to the step summary.
      # It does NOT open issues — an earlier draft declared `issues: write` for a
      # file-an-issue step that was never built. Add the scope back with the feature,
      # not before it.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.3

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: '20'

      - name: Scan skill imports
        id: scan
        run: |
          set -o pipefail
          # Report mode: capture findings without failing the job, so the summary step always runs.
          node scripts/check-import-symbols.mjs | tee /tmp/import-scan.txt
          if grep -qE '^[0-9]+ broken import' /tmp/import-scan.txt; then
            echo "broken=true" >> "$GITHUB_OUTPUT"
          else
            echo "broken=false" >> "$GITHUB_OUTPUT"
          fi

      # Always publish the report, including the skipped counts. A scan that silently drops what
      # it cannot resolve reads as "all clear" for work it never did.
      - name: Publish report
        if: always()
        run: |
          {
            echo '### Import symbol scan'
            echo ''
            echo '```'
            cat /tmp/import-scan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Warn on findings
        if: steps.scan.outputs.broken == 'true'
        run: |
          echo "::warning::Skill docs import symbols that are not exported by their packages — see the job summary"

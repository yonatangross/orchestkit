# Generated by OrchestKit Claude Plugin
# Created: 2026-11-13

# Scheduled whole-tree npm audit (orchestkit row 10, part 1; conductor335's ruling, condition 1).
#
# The pre-push hook and the PR rows audit the whole tree today, and a red there blocks the
# author. A red on main or overnight used to open nothing anyone could see: ci.yml already runs
# a nightly cron, but a failure there is a red run in a list, not an item.
#
# This job audits EVERY tracked lockfile at moderate and up with the same allowlist
# (.claude/audit-allowlist.json), on a daily schedule, on every push to main and on demand.
# On a hit it opens or updates ONE issue per advisory set (.github/scripts/open-audit-issue.sh), then
# goes red. A run that could not audit (registry down, no report, zero packages) goes red too,
# with its own message, and opens no advisory issue: it is not a pass and not a hit.
#
# Proof that the audit step is red on a known-vulnerable pin, and that the issue step opens one
# item and never a duplicate, lives in tests/security/test-audit-whole-tree.sh.

name: Scheduled npm audit

on:
  schedule:
    - cron: '17 3 * * *'  # daily 03:17 UTC, off the top of the hour (ci.yml's nightly is 02:00)
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One audit at a time, and a newer trigger waits instead of cancelling a running audit:
# a cancelled run must not be read as a failed or a clean one.
concurrency:
  group: npm-audit-scheduled
  cancel-in-progress: false

jobs:
  audit:
    name: Whole-tree npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write  # open or edit the one issue per advisory set; nothing else is written
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc

      # Reads the lockfiles (--package-lock-only), so no install and no registry token. The step
      # records the outcome instead of failing, so the issue step below still runs; the last step
      # turns the recorded status into the job's result. Each npm audit call is bounded by the
      # retry wrapper (60 s per attempt, 3 attempts), and the job by timeout-minutes.
      - name: Audit every tracked lockfile
        id: audit
        run: |
          set +e
          bash .github/scripts/audit-whole-tree.sh --summary-out "$RUNNER_TEMP/audit-summary.json"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          hits=0
          if [ -s "$RUNNER_TEMP/audit-summary.json" ]; then
            hits="$(jq '.hits | length' "$RUNNER_TEMP/audit-summary.json")"
          fi
          echo "hits=$hits" >> "$GITHUB_OUTPUT"

      - name: Publish the summary
        if: always()
        run: |
          {
            echo '### Whole-tree npm audit'
            echo ''
            if [ -s "$RUNNER_TEMP/audit-summary.json" ]; then
              echo '```json'
              jq '.' "$RUNNER_TEMP/audit-summary.json"
              echo '```'
            else
              echo 'No summary was written: the audit script did not get as far as auditing. See the step log.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Only advisory hits open an issue. The script finds the open issue for this exact advisory
      # set and edits it, or opens a new one; it never closes anything.
      - name: Open or update the issue for this advisory set
        if: steps.audit.outputs.hits != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUDIT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash .github/scripts/open-audit-issue.sh \
            --summary "$RUNNER_TEMP/audit-summary.json" \
            --label security \
            --run-url "$AUDIT_RUN_URL"

      - name: Fail the job when the audit was not clean
        if: steps.audit.outputs.status != '0'
        env:
          AUDIT_STATUS: ${{ steps.audit.outputs.status }}
        run: |
          if [ "$AUDIT_STATUS" = "1" ]; then
            echo "::error::npm audit found advisories at moderate or above that are not allowlisted. One issue per advisory set was opened or updated."
          else
            echo "::error::npm audit could not complete (status $AUDIT_STATUS), so nothing here is a pass. See the audit step."
          fi
          exit 1

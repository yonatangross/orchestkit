# Generated by OrchestKit Claude Plugin
# Created: 2026-11-13

# Scheduled whole-tree npm audit (orchestkit row 10, part 1; conductor335's ruling, condition 1).
#
# The pre-push hook and the PR rows audit the whole tree today, and a red there blocks the
# author. A red on main or overnight used to open nothing anyone could see: ci.yml already runs
# a nightly cron, but a failure there is a red run in a list, not an item.
#
# This job audits EVERY tracked lockfile at moderate and up with the same allowlist
# (.claude/audit-allowlist.json), on a daily schedule, on every push to main and on demand.
# It has three outcomes that stay distinct, and each red one opens a visible item:
#   - advisory hits: ONE issue per advisory set (.github/scripts/open-audit-issue.sh), title key "[set ...]"
#   - could not audit (registry down, no report, zero packages in any lockfile, an issue step that
#     failed): ONE issue with its own title key "[cannot-audit]", never claiming a hit
#   - clean: nothing is opened
# The job goes red on both red outcomes.
#
# workflow_dispatch has one input, plant_fixture (default off). On, it ADDS the committed vulnerable
# fixture (tests/security/fixtures/npm-audit-planted, lodash 4.17.20) to the audit so a dispatched
# run can show a real red and the item it opens. It never skips, narrows or replaces the real tree
# audit, and it reaches the script through env, never inside a run: line.
#
# Proof that the audit step is red on a known-vulnerable pin, and that the issue step opens one
# item and never a duplicate, lives in tests/security/test-audit-whole-tree.sh.

name: Scheduled npm audit

on:
  schedule:
    - cron: '17 3 * * *'  # daily 03:17 UTC, off the top of the hour (ci.yml's nightly is 02:00)
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      plant_fixture:
        description: 'Also audit the planted vulnerable fixture (lodash 4.17.20) to prove the red path. Adds to the real audit, never replaces it.'
        type: boolean
        default: false

permissions: {}

# One audit at a time, and a newer trigger waits instead of cancelling a running audit:
# a cancelled run must not be read as a failed or a clean one.
concurrency:
  group: npm-audit-scheduled
  cancel-in-progress: false

jobs:
  audit:
    name: Whole-tree npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write  # open or edit the advisory-set issue and the cannot-audit issue; nothing else is written
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc

      # Reads the lockfiles (--package-lock-only), so no install and no registry token. The step
      # records the outcome instead of failing, so the issue steps below still run; the last step
      # turns the recorded outcome into the job's result. Each npm audit call is bounded by the
      # retry wrapper (60 s per attempt, 3 attempts), and the job by timeout-minutes.
      # cannot_audit is true for everything except a clean run (status 0, no hits) and a real hit
      # run (status 1 with at least one hit): status 1 with no hit is an unexpected failure, not a pass.
      - name: Audit every tracked lockfile
        id: audit
        env:
          PLANT_FIXTURE: ${{ inputs.plant_fixture }}
        run: |
          set +e
          args=(--summary-out "$RUNNER_TEMP/audit-summary.json")
          invalid=0
          case "${PLANT_FIXTURE:-false}" in
            true) args+=(--with-fixture) ;;
            false) ;;
            *) echo "::error::plant_fixture must be true or false"; invalid=1 ;;
          esac
          if [ "$invalid" = "1" ]; then
            status=2
          else
            bash .github/scripts/audit-whole-tree.sh "${args[@]}"
            status=$?
          fi
          hits=0
          if [ -s "$RUNNER_TEMP/audit-summary.json" ]; then
            if ! hits="$(jq -e '.hits | length' "$RUNNER_TEMP/audit-summary.json")"; then
              hits=0
              status=2
            fi
          fi
          cannot_audit=true
          if [ "$status" = "0" ] && [ "$hits" = "0" ]; then cannot_audit=false; fi
          if [ "$status" = "1" ] && [ "$hits" != "0" ]; then cannot_audit=false; fi
          set -e
          {
            echo "status=$status"
            echo "hits=$hits"
            echo "cannot_audit=$cannot_audit"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the summary
        if: always()
        run: |
          {
            echo '### Whole-tree npm audit'
            echo ''
            if [ -s "$RUNNER_TEMP/audit-summary.json" ]; then
              echo '```json'
              jq '.' "$RUNNER_TEMP/audit-summary.json"
              echo '```'
            else
              echo 'No summary was written: the audit script did not get as far as auditing. See the step log.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Advisory hits open an issue. The script finds the open issue for this exact advisory
      # set and edits it, or opens a new one; it never closes anything.
      - name: Open or update the issue for this advisory set
        id: advisories
        if: steps.audit.outputs.hits != '0' && steps.audit.outputs.hits != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUDIT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash .github/scripts/open-audit-issue.sh \
            --mode advisories \
            --summary "$RUNNER_TEMP/audit-summary.json" \
            --label security \
            --run-url "$AUDIT_RUN_URL"

      # A red run that is not (only) an advisory hit must not be a silent log line either: the
      # audit could not complete, or the advisory issue step above failed. One item with its own
      # title key, apart from the advisory-set issues, so the three states stay distinct.
      - name: Open or update the cannot-audit issue
        id: cannot
        if: always() && (steps.audit.outputs.cannot_audit != 'false' || steps.advisories.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUDIT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUDIT_STATUS: ${{ steps.audit.outputs.status }}
          CANNOT_AUDIT: ${{ steps.audit.outputs.cannot_audit }}
          ADVISORY_OUTCOME: ${{ steps.advisories.outcome }}
        run: |
          reason=""
          if [ "$CANNOT_AUDIT" != "false" ]; then
            reason="the audit did not complete (status ${AUDIT_STATUS:-unknown})"
          fi
          if [ "$ADVISORY_OUTCOME" = "failure" ]; then
            reason="${reason:+$reason; }the advisory issue step failed"
          fi
          bash .github/scripts/open-audit-issue.sh \
            --mode cannot-audit \
            --summary "$RUNNER_TEMP/audit-summary.json" \
            --reason "$reason" \
            --label security \
            --run-url "$AUDIT_RUN_URL"

      - name: Fail the job when the audit was not clean
        if: always() && (steps.audit.outputs.status != '0' || steps.audit.outputs.hits != '0' || steps.advisories.outcome == 'failure' || steps.cannot.outcome == 'failure')
        env:
          AUDIT_STATUS: ${{ steps.audit.outputs.status }}
          CANNOT_AUDIT: ${{ steps.audit.outputs.cannot_audit }}
        run: |
          if [ "$CANNOT_AUDIT" = "false" ]; then
            echo "::error::npm audit found advisories at moderate or above that are not allowlisted. One issue per advisory set was opened or updated."
          else
            echo "::error::npm audit could not complete (status ${AUDIT_STATUS:-unknown}), so nothing here is a pass. One cannot-audit issue was opened or updated."
          fi
          exit 1

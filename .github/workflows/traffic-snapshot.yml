# Generated by OrchestKit Claude Plugin
# Created: 2026-09-12
# Issue: #4071, durable weekly traffic snapshot.
#
# GitHub exposes repository traffic (views, clones, popular paths, referrers)
# through a rolling 14-day window, then the numbers are gone. This workflow
# reads all four traffic endpoints every Monday, appends ONE JSONL row for the
# previous full week to docs/traffic/snapshots.jsonl, and opens a PR carrying
# the row (never a direct push to main), so the history outlives the window
# and every week is reviewable.
#
# Fail-closed (#4071): scripts/traffic-snapshot.mjs writes the row only after
# ALL four endpoint reads succeeded and validated. Any failed read (HTTP
# error, unparseable body, missing numeric fields) or an empty measurement
# window aborts the run with nothing written: a zero row on an API failure
# would read as a traffic collapse that never happened. The paired
# control/fault arms for this contract live in tests/ci/test-traffic-snapshot.sh.
#
# Idempotent: a week already recorded in the ledger makes the run exit 0
# without any API call, so re-dispatching cannot duplicate a row or a PR.

name: Traffic Snapshot

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC, per #4071. Shares codeql's slot; GitHub queue jitter spreads actual starts.
  workflow_dispatch:

# Default-deny at workflow level; writes scoped to the snapshot job.
permissions:
  contents: read

concurrency:
  group: traffic-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # push the snapshot branch
      pull-requests: write  # gh pr create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 # zizmor: ignore[artipacked] - persisted GITHUB_TOKEN is required for the git push in the Open PR step

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Build weekly snapshot row (fails closed on any API error)
        id: snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Exits non-zero (writing nothing) when any endpoint read fails or
          # the measured week has zero daily buckets. On success it appends
          # the row and emits row=written / week=<key> to GITHUB_OUTPUT; on
          # an already-recorded week it emits row=skipped with no API calls.
          node scripts/traffic-snapshot.mjs \
            --repo "$GH_REPO" \
            --out docs/traffic/snapshots.jsonl

      # Assert the OUTPUT side, not the exit code: a green run that wrote
      # nothing is indistinguishable from "row committed" unless the output
      # key is checked (the ci-sentinel lesson, see labs-version-watch.yml).
      - name: Verify the run outcome is explicit
        run: |
          set -euo pipefail
          case "${{ steps.snapshot.outputs.row }}" in
            written)
              echo "row written for week ${{ steps.snapshot.outputs.week }}"
              test -s docs/traffic/snapshots.jsonl
              grep -q "\"week\":\"${{ steps.snapshot.outputs.week }}\"" docs/traffic/snapshots.jsonl
              ;;
            skipped)
              echo "week ${{ steps.snapshot.outputs.week }} already recorded; nothing to do"
              ;;
            *)
              echo "::error::snapshot step produced no explicit outcome (empty row key); refusing to guess"
              exit 1
              ;;
          esac

      - name: Open PR with the new row
        if: steps.snapshot.outputs.row == 'written'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEEK: ${{ steps.snapshot.outputs.week }}
        run: |
          set -euo pipefail
          BRANCH="traffic/snapshot-${WEEK}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -B (not -b): a prior run may have pushed this week's branch before
          # dying before or during PR creation; recreate it from current main.
          git checkout -B "$BRANCH"
          git add docs/traffic/snapshots.jsonl
          git commit -m "chore(traffic): snapshot week of ${WEEK}"
          # --force-with-lease: same re-dispatch story as checkout -B; the
          # branch is bot-owned and carries exactly this one commit.
          git push --force-with-lease -u origin "$BRANCH"

          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "::error::push reported success but origin/$BRANCH does not exist"
            exit 1
          fi

          # PR body from the row itself, so the numbers on the PR are the
          # numbers in the ledger.
          ROW=$(tail -n 1 docs/traffic/snapshots.jsonl)
          BODY_FILE="$(mktemp "${TMPDIR:-/tmp}/ork-traffic-pr.XXXXXX")"
          {
            printf 'Weekly GitHub traffic snapshot for the week of %s (measured Monday 00:00 UTC to Monday 00:00 UTC).\n\n' "$WEEK"
            printf '%s' "$ROW" | jq -r '"| metric | total | uniques | days observed |\n|---|---|---|---|\n| views | \(.views.total) | \(.views.uniques) | \(.views.days_observed) |\n| clones | \(.clones.total) | \(.clones.uniques) | \(.clones.days_observed) |"'
            printf '\nTop referrers (trailing 14-day window, GitHub API shape):\n\n'
            printf '%s' "$ROW" | jq -r '.referrers.items[:5][] | "- \(.referrer): \(.count) hits, \(.uniques) uniques"'
            printf '\nTop paths (trailing 14-day window, GitHub API shape):\n\n'
            printf '%s' "$ROW" | jq -r '.popular_paths.items[:5][] | "- `\(.path)`: \(.count) views, \(.uniques) uniques"'
            printf '\nData file: `docs/traffic/snapshots.jsonl` (one JSONL row per week). Generated by `.github/workflows/traffic-snapshot.yml` (#4071). Fail-closed: no row is written when any endpoint read fails, so an absent week means a failed run, not zero traffic.\n'
          } > "$BODY_FILE"

          if gh pr create \
            --base main \
            --title "chore(traffic): traffic snapshot week of ${WEEK}" \
            --body-file "$BODY_FILE" \
            --label "documentation"; then
            echo "opened PR for $BRANCH"
          else
            # Non-fatal (a PR may already exist for this branch) but it must
            # be VISIBLE in the Actions UI, not swallowed.
            echo "::warning::gh pr create failed for $BRANCH, branch is pushed; open the PR manually"
          fi
          rm -f "$BODY_FILE"

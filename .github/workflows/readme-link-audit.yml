# Generated by OrchestKit Claude Plugin
# Created: 2026-07-28

# Weekly sweep for dead links in hand-written docs.
#
# Why scheduled and not a PR gate: link rot is time-based, not diff-based. The
# 404 found in #3183 (a docs page deleted in b23da597e while the README kept
# linking to it) appeared on a commit that never touched README.md, so a
# PR-only gate would have stayed green through the entire rot. Keeping it off
# the PR queue also keeps an external-network dependency out of a queue that is
# already strict-main and runner-constrained.
#
# Companion gates, deliberately split by what they can prove without the network:
#   check-docs-facts.mjs      counts + CC floor      (PR-blocking, docs.yml)
#   check-readme-commands.mjs /ork:<cmd> resolves    (PR-blocking, docs.yml)
#   this workflow             URLs resolve           (scheduled, reports only)
name: README Link Audit

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays 06:23 UTC, just after skill-claims-audit
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Link Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Link check
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          # Retries absorb transient 5xx so a blip does not open a bogus issue.
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --timeout 20
            --accept 200,206,301,302,303,307,308
            --
            README.md
          output: /tmp/lychee.md
          # Never fail the run: a red scheduled job is noise nobody reads. The
          # rolling issue below is the signal.
          fail: false

      - name: Update or create report issue
        if: ${{ steps.lychee.outputs.exit_code != 0 }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="readme-link audit: dead links in hand-written docs"
          BODY_FILE=/tmp/report.md
          {
            printf 'Weekly sweep found unreachable links. Fix the target or update the link; if a URL is unreachable to bots but fine for humans, add it to .lycheeignore WITH a reason.\n\n'
            cat /tmp/lychee.md
            printf '\nGenerated by the readme-link-audit workflow.\n'
          } > "$BODY_FILE"
          EXISTING=$(gh issue list --state open --search "in:title readme-link audit" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
          else
            gh issue create --title "$TITLE" --label docs --body-file "$BODY_FILE"
          fi

      - name: Mark report issue clean
        if: ${{ steps.lychee.outputs.exit_code == 0 }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Repo convention: issues close via PR merge, never gh issue close.
          EXISTING=$(gh issue list --state open --search "in:title readme-link audit" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Sweep is clean as of this run; safe to close via the next docs PR."
          fi

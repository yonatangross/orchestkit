# Generated by OrchestKit Claude Plugin
# Created: 2026-06-16

# Dependabot major-bump hold (#2490)
#
# Labels every Dependabot MAJOR version bump `dependabot-major-held` and leaves
# a one-time comment, so a human reviews it. This workflow merges nothing and
# arms no auto-merge: every Dependabot PR, major or not, merges through the
# merge desk after a skeptic check (rule SC175). The old "Auto-merge non-major
# updates" step armed `gh pr merge --auto --squash` on every synchronize, so
# each Dependabot rebase re-armed it, and a breaking 0.x minor or a bump that
# touched publish workflows could merge with no human read. It was removed on
# 2026-10-15.
#
# Security: pull_request_target runs in the BASE-repo context with a write
# token, but this job never checks out or executes PR code. It only calls
# `gh pr edit|comment`. Dependabot-controlled metadata is passed via env, never
# interpolated into a run-step shell body.
#
# Least privilege: top-level grants nothing beyond contents: read; the job only
# needs pull-requests: write for the label and the comment (Scorecard
# Token-Permissions #212).

name: Dependabot major hold

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  automerge:
    name: Hold Dependabot major bumps
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    timeout-minutes: 5
    permissions:
      contents: read        # fetch-metadata reads the PR
      pull-requests: write  # label and comment on held majors
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Major bumps -> hold for human review (label on every event; idempotent).
      - name: Label major bumps as held
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-major' }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit "$PR_URL" --add-label dependabot-major-held

      # One-time explanatory comment, only when the PR is first opened.
      - name: Comment on newly-opened held majors
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-major' && github.event.action == 'opened' }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEP_NAMES: ${{ steps.meta.outputs.dependency-names }}
          PREV: ${{ steps.meta.outputs.previous-version }}
          NEW: ${{ steps.meta.outputs.new-version }}
        run: |
          gh pr comment "$PR_URL" --body "Held for human review: major bump (\`$DEP_NAMES\` $PREV -> $NEW). Major versions carry breaking changes, so this PR waits for a human review and then merges through the merge desk (#2490). Nothing merges it automatically."

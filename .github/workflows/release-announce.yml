# Generated by OrchestKit Claude Plugin

# Release Announce — draft social posts for a release via the HQ platform.
#
# On a published release (or manual dispatch), POST the release facts to the
# Yonatan-HQ platform marketing intake (POST /api/marketing/release-announce),
# which drafts per-channel posts for the GROWTH channels (Twitter/X, Dev.to,
# Hashnode, Substack, Threads). Drafts are HUMAN-GATED on the platform —
# nothing publishes from here.
#
# LinkedIn is deliberately NOT auto-drafted — it is a curated, hand-written
# channel. Instagram joins ANNOUNCE_CHANNELS once Meta Business Verification
# clears (needs instagram_content_publish).
#
# Cadence: minor/major (X.Y.0) releases announce automatically; patch bumps and
# prereleases are skipped to keep the review queue clean, UNLESS the release PR
# carries the `announce` label (opt-in per release, decided at release-PR merge
# time). workflow_dispatch overrides for any version.
#
# Secrets (operator-provisioned; inert until both are set):
#   HQ_API_URL   - platform API base (e.g. https://<platform-api-host>)
#   HQ_API_TOKEN - platform API_STATIC_TOKEN (service-to-service bearer)

name: Release Announce

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to announce (e.g. 8.62.1)'
        required: true
        type: string
      dry_run:
        description: 'Compose the payload without posting'
        required: false
        type: boolean
        default: true

concurrency:
  group: release-announce-${{ github.event.release.tag_name || github.event.inputs.version }}
  cancel-in-progress: false

permissions: {}

jobs:
  announce:
    name: Draft release announcement
    permissions:
      contents: read
      # announce-label lookup: the meta step reads the release PR's labels via
      # the commit-associated-PRs endpoint.
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Full history so changelog-to-props.mjs can find the version section.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6  # zizmor: ignore[cache-poisoning] no deps installed, no cache restored
        with:
          node-version-file: .nvmrc

      - name: Determine version + cadence
        id: meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [ -n "$RELEASE_TAG" ]; then
            VERSION="${RELEASE_TAG#v}"
          else
            echo "ERROR: no version available"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Minor/major only on real releases; manual dispatch always proceeds.
          #
          # PATCH is read off the CORE version. `${VERSION##*.}` takes the last
          # dot-separated field of the whole string, which for 10.0.0-alpha.1 is
          # "1" — the alpha ordinal, not the patch number. That happened to skip
          # prereleases, but by accident: 10.0.0-beta.0 would have announced.
          # Prereleases are now skipped because they are prereleases.
          . scripts/lib/semver.sh
          PATCH="$(semver_core "$VERSION")"
          PATCH="${PATCH##*.}"

          # Opt-in override: a release whose release PR carries the `announce`
          # label announces regardless of the cadence band. Resolved from the
          # tag commit's associated PRs (labels live on PRs; releases have
          # none). Fails QUIET on lookup errors: for an announce gate the
          # conservative failure mode is silence, not an accidental
          # announcement — the warning line keeps the failure observable.
          announce_label() {
            SHA=$(git rev-list -n 1 "v$VERSION" 2>/dev/null || true)
            if [ -z "$SHA" ]; then
              echo "::warning::announce-label lookup: tag v$VERSION not found in history"
              return 1
            fi
            if ! RESP=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/commits/$SHA/pulls"); then
              echo "::warning::announce-label lookup failed (API error) — treating as unlabeled"
              return 1
            fi
            echo "$RESP" | jq -e '[.[].labels[].name] | index("announce") != null' > /dev/null
          }

          if [ "$EVENT_NAME" = "release" ] && semver_is_prerelease "$VERSION"; then
            if announce_label; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$VERSION is a prerelease with the announce label — announcing."
            else
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$VERSION is a prerelease — not announcing (label the release PR 'announce' to opt in)."
            fi
          elif [ "$EVENT_NAME" = "release" ] && [ "$PATCH" != "0" ]; then
            if announce_label; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$VERSION is a patch with the announce label — announcing."
            else
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skipped (patch release)
        if: steps.meta.outputs.skip == 'true'
        run: |
          echo "### 📣 Release announce skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "Patch release \`${{ steps.meta.outputs.version }}\` — announcements fire on minor/major (X.Y.0) only." >> "$GITHUB_STEP_SUMMARY"

      - name: Credential preflight (platform dry-run)
        # Fail before the live POST when a provisioned secret was revoked or
        # retired. The preflight sends the same release facts with dry_run=true,
        # which the platform authenticates and composes without creating drafts.
        if: steps.meta.outputs.skip == 'false' && github.event.inputs.dry_run != 'true'
        id: credential_preflight
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_URL: ${{ github.event.release.html_url || format('https://github.com/{0}/releases/tag/v{1}', github.repository, steps.meta.outputs.version) }}
          RELEASE_NOTES: ${{ github.event.release.body }}
          REPO: ${{ github.repository }}
          ANNOUNCE_CHANNELS: twitter,devto,hashnode,substack,threads
          ANNOUNCE_ACCOUNT: yonyon2ai
          HQ_API_URL: ${{ secrets.HQ_API_URL }}
          HQ_API_TOKEN: ${{ secrets.HQ_API_TOKEN }}
          PREFLIGHT: "true"
        run: node scripts/announce-release.mjs

      - name: Announce (draft via platform marketing)
        if: steps.meta.outputs.skip == 'false'
        id: announce
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_URL: ${{ github.event.release.html_url || format('https://github.com/{0}/releases/tag/v{1}', github.repository, steps.meta.outputs.version) }}
          RELEASE_NOTES: ${{ github.event.release.body }}
          REPO: ${{ github.repository }}
          # Growth channels only — LinkedIn is curated/hand-written (never auto).
          # Instagram joins once Meta Business Verification clears.
          ANNOUNCE_CHANNELS: twitter,devto,hashnode,substack,threads
          # Draft under the project's automation account, never a maintainer's
          # personal one. Inert until the platform adapter honours it — see
          # announce-release.mjs.
          ANNOUNCE_ACCOUNT: yonyon2ai
          HQ_API_URL: ${{ secrets.HQ_API_URL }}
          HQ_API_TOKEN: ${{ secrets.HQ_API_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node scripts/announce-release.mjs

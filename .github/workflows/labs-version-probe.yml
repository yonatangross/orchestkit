# Generated by OrchestKit Claude Plugin
# Created: 2026-07-31

# Nightly upstream-currency probe. READ ONLY.
#
# Why this is a separate file from labs-version-watch.yml, and must stay one:
# tests/unit/test-no-llm-in-ci.sh forbids an automatic trigger in any workflow FILE
# whose text matches its LLM signature (see LLM_SIGNATURE in that test). That match
# is textual, so a file merely DISCUSSING the model-invocation policy trips it, which
# is what labs-version-watch.yml does in its own trigger comments. The guard is
# deliberately file-scoped and blunt, and it is right to be: a scheduled job living
# beside a quota-spending job is one careless edit away from spending quota on a cron.
#
# Keep this file free of those signature strings. Describe the policy by reference,
# never by quoting the pattern, or this scheduled file will fail the guard too.
#
# So the split is structural, not cosmetic. This file may be scheduled because it
# can never spend quota: it runs one node script that fetches npm and PyPI and
# compares strings. labs-version-watch.yml keeps the branch-pushing, PR-opening
# half and stays workflow_dispatch only.
#
# DO NOT add any step here that invokes a model, and do not merge this file back
# into labs-version-watch.yml. The reason this exists at all is that the ONLY
# currency gate in the repo was invisible unless a human remembered to dispatch it:
# measured 2026-07-31, the last run was 2026-07-27 and 5 pin drifts plus 16 floor
# lags had accumulated unwatched in the gap.

name: Upstream Version Probe

on:
  schedule:
    - cron: "0 5 * * *"  # daily 05:00 UTC, offset from import-symbol-watch (06:00)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labs-version-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Needed to route drift to a surface someone reads (#3526). The step summary
      # was the only output and nothing ever read it: `grep -rl labs-version-probe`
      # matched only these workflows. Drift was detected nightly and reported
      # nowhere, which is how the portless reference sat five minor versions stale
      # through three green runs (2026-08-15/16/17) and then cost a session real
      # time. Same open-or-update-one-issue pattern as skill-claims-audit.yml.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version-file: .nvmrc

      - name: Probe upstream registries
        id: probe
        run: |
          set -uo pipefail
          # Capture the exit code. `|| true` used to discard it, and stderr is
          # redirected INTO the file the grep reads, so a stack trace or a fetch
          # timeout matched neither pattern and fell through to the else branch —
          # printing "Every pin and declared floor is current" for a probe that
          # never completed. Could-not-observe is its own outcome, never "clean".
          node scripts/check-labs-versions.mjs > /tmp/drift.txt 2>&1
          probe_rc=$?

          # Publish the verdict for the routing step. Three states, and "unknown"
          # must never collapse into "clean" here either.
          if [ "$probe_rc" -ne 0 ]; then
            echo "drift=unknown" >> "$GITHUB_OUTPUT"
          elif grep -qE '^DRIFT|behind upstream' /tmp/drift.txt; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo '## Upstream version probe'
            echo ''
            if [ "$probe_rc" -ne 0 ]; then
              echo "**Probe FAILED (exit $probe_rc). Drift state is UNKNOWN, not clean.**"
              echo ''
              echo 'Nothing was verified this run. Do not read this as "pins are current" —'
              echo 'read the output below, fix the probe, and re-dispatch.'
            elif grep -qE '^DRIFT|behind upstream' /tmp/drift.txt; then
              echo 'Drift detected. Dispatch **Upstream Version Watch** to open the bump PR.'
            else
              echo 'No drift. Every pin and declared floor is current.'
            fi
            echo ''
            echo '```'
            cat /tmp/drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Never fail the nightly run on DRIFT: a red cron nobody can action is a red
          # cron people mute. The step summary is the deliverable.
          # A FAILED PROBE is different — it means the check did not run, so it goes
          # red. That is actionable (fix the probe) and cannot be confused with clean.
          if [ "$probe_rc" -ne 0 ]; then
            echo "::error::upstream version probe failed (exit $probe_rc) — drift state unknown"
            exit "$probe_rc"
          fi

      # ---------------------------------------------------------------------
      # Route drift to a surface someone reads (#3526).
      #
      # ONE long-lived issue, updated in place: a notification on state change,
      # not one per night. Deliberately NOT a red cron (see above) and NOT a new
      # issue per run — both get muted, which is the failure this is fixing.
      #
      # Body is passed as --body-file, never interpolated into the command. The
      # probe's output is registry-derived (package names, version strings), so
      # inlining it would put third-party text on a shell command line.
      # ---------------------------------------------------------------------
      - name: Route drift to the tracking issue
        if: steps.probe.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "upstream pins have drifted (labs-version-probe)"
        run: |
          set -uo pipefail
          BODY=/tmp/issue-body.md
          {
            echo "The nightly upstream probe found drift as of \`$(date -u +%Y-%m-%dT%H:%MZ)\`."
            echo ''
            echo 'Dispatch **Upstream Version Watch** to open the bump PR. That half is'
            echo 'manual-dispatch on purpose: it makes real `claude -p` calls, which draw on'
            echo "the operator's shared weekly quota, so it must not fire on a cron."
            echo ''
            echo '<details><summary>probe output</summary>'
            echo ''
            echo '```'
            cat /tmp/drift.txt
            echo '```'
            echo ''
            echo '</details>'
          } > "$BODY"

          EXISTING=$(gh issue list --state open --search "in:title labs-version-probe" \
                       --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY"
            echo "updated existing issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --label chore --body-file "$BODY"
            echo "opened a new tracking issue"
          fi

      - name: Note the all-clear on the tracking issue
        if: steps.probe.outputs.drift == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # Only speaks when an issue is already open — a clean run with no open
          # issue has nothing to say, and saying it nightly is the noise this avoids.
          # Repo convention: issues close via PR merge, never `gh issue close`.
          EXISTING=$(gh issue list --state open --search "in:title labs-version-probe" \
                       --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" \
              --body "Probe is clean as of $(date -u +%Y-%m-%dT%H:%MZ) — every pin and declared floor is current. Safe to close via the next PR."
            echo "commented all-clear on #$EXISTING"
          else
            echo "clean, and no open tracking issue — nothing to say"
          fi

# Generated by OrchestKit Claude Plugin
# Created: 2026-07-23

# Validate Demos Renderer
#
# release-video.yml only runs on `release: [published]`, i.e. AFTER a release is
# already out. So when a dependency bump broke the Remotion renderer, nobody saw
# the red: 27 consecutive releases shipped no video before it was noticed (#3086).
# Two independent breakages had stacked up in the same 48 hours, both from
# routine dep bumps, both invisible until someone went looking:
#
#   remotion   4.0.484 -> 4.0.489  removed Config.setExperimentalClientSideRenderingEnabled
#   typescript 6.0.3   -> 7.0.2    dropped the legacy JS API @remotion/bundler needs
#                                  (ts.sys / ts.readConfigFile are undefined in TS 7)
#
# `remotion compositions` loads remotion.config.ts AND bundles the project with
# the TypeScript toolchain, so it would have caught BOTH at review time.
#
# This runs on EVERY pull_request (no paths filter) and cheaply early-exits when
# orchestkit-demos is untouched. That is deliberate: a required status check must
# report on every PR, or PRs that never trigger it stay permanently BLOCKED on a
# context that never appears. With this shape, "Validate Renderer" can be added
# to main's branch protection (see #3086 follow-up) so a Dependabot bump that
# breaks the renderer can no longer auto-merge — the gap that let #3086 in.
#
# Deliberately a separate workflow rather than a pull_request trigger on
# release-video.yml: that workflow's jobs read release-event data and would fail
# on a PR.

name: Validate Demos Renderer

on:
  pull_request:
  # Required checks must also report for a queued entry. Without this the
  # merge queue never sees "Validate Renderer", the entry can never satisfy
  # branch protection, and the queue stalls indefinitely (#3189). This is a
  # no-op until a queue exists, since nothing else emits merge_group events.
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: demos-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-renderer:
    name: Validate Renderer
    permissions:
      contents: read
      pull-requests: read  # gh api …/files to detect whether demos changed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Cheap gate so this can be a required check without paying the ~15-min
      # render-bundle cost on every unrelated PR. workflow_dispatch always runs.
      - name: Does this PR touch the demos tree?
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A merge_group entry has no pull_request.number, so the pulls/…/files
          # call below would build "repos/OWNER/REPO/pulls//files" and fail the
          # step under `set -e` — turning a stalled queue into a red one. Diff
          # the queued range instead; `compare` needs no deep checkout.
          if [ "$EVENT" = "merge_group" ]; then
            files=$(gh api "repos/${REPO}/compare/${MG_BASE}...${MG_HEAD}" --jq '.files[].filename')
          else
            files=$(gh api "repos/${REPO}/pulls/${PR}/files" --paginate --jq '.[].filename')
          fi
          # Here-string, not `printf | grep -q`: under pipefail, grep -q's
          # early-exit SIGPIPEs the producer (exit 141) and flips the result
          # non-deterministically. A here-string has no producer process.
          # The exemplar templates are in the trigger set because
          # orchestkit-demos/src/playground-exemplars.test.ts renders them from
          # ../src/skills/shared/assets/playground-exemplars/. Without this path,
          # editing a template alone would skip the only job that executes it and
          # the render test would be a gate that never fires on its own subject.
          if grep -qE '^(orchestkit-demos/|src/skills/shared/assets/playground-exemplars/|\.github/workflows/demos-validate\.yml)' <<<"$files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::orchestkit-demos untouched — renderer validation not needed. Reporting success."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6  # zizmor: ignore[cache-poisoning] deps via npm ci, no cache restored
        with:
          node-version-file: .nvmrc

      - name: Install demo dependencies
        if: steps.changed.outputs.run == 'true'
        working-directory: orchestkit-demos
        run: npm ci

      # The demos own 8 vitest files / 284 assertions that ran NOWHERE in CI
      # until 2026-08-03: this job only bundled, so the jsdom test environment
      # and every component test were invisible to the pipeline. That gap was
      # found while reviewing #3259 (jsdom 29 -> 30, a MAJOR) — 43 checks were
      # green and not one of them executed a line of jsdom. The bump turned out
      # fine, but only because it was verified by hand; the next one should be
      # verified here. `npm test` runs `vitest run -c vitest.demos.config.ts`
      # (the bare `vitest` picks up the repo-root config and dies on its
      # src/hooks project reference).
      - name: Run demo unit tests
        if: steps.changed.outputs.run == 'true'
        working-directory: orchestkit-demos
        run: npm test

      # Loads remotion.config.ts and bundles with the TS toolchain. A config
      # calling a removed API, or a TypeScript major that the bundler cannot
      # use, fails here rather than silently on the next 27 releases.
      - name: Bundle and enumerate compositions
        if: steps.changed.outputs.run == 'true'
        working-directory: orchestkit-demos
        run: npx remotion compositions

      # The two compositions release-video.yml actually renders must exist. A
      # rename would otherwise only surface post-release.
      - name: Assert the release-notes compositions are registered
        if: steps.changed.outputs.run == 'true'
        working-directory: orchestkit-demos
        run: |
          set -euo pipefail
          out=$(npx remotion compositions)
          for id in TPL-ReleaseNotes TPL-ReleaseNotesSquare; do
            if ! grep -qE "^${id}\b" <<<"$out"; then
              echo "::error::Composition ${id} is not registered — release-video.yml renders it and would fail after the next release."
              exit 1
            fi
            echo "::notice::Composition ${id} present."
          done

name: 'Setup OrchestKit CI Environment'
description: 'Install dependencies, setup Node.js, build plugins, and configure CI environment for cross-platform testing'

inputs:
  node-version:
    description: 'Node.js version to install. Leave empty to resolve from .nvmrc.'
    required: false
    default: ''
  build-plugins:
    description: 'Whether to build plugins'
    required: false
    default: 'true'
  run-ci-setup:
    description: 'Whether to run bin/ci-setup.sh'
    required: false
    default: 'true'
  ci-setup-flags:
    description: 'Extra flags for ci-setup.sh (e.g., --with-shellcheck)'
    required: false
    default: ''
  install-hooks-deps:
    description: 'Whether to install src/hooks npm dependencies'
    required: false
    default: 'false'
  use-cache:
    description: 'Whether to use npm cache'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    # jq and rsync are preinstalled on the hosted runner images, so the normal
    # path here does not touch a package manager at all. When an install is
    # genuinely needed the helper bounds it with `timeout` and names the cause
    # on failure. `timeout-minutes:` cannot be used on a composite-action step,
    # it is silently ignored (actions/runner#1979). See issue #3545.
    - name: Install system dependencies
      shell: bash
      run: bash .github/scripts/ensure-system-deps.sh jq rsync

    - name: Setup Node.js
      uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238  # v6
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: .nvmrc

    - name: Clean stale agent team directories
      shell: bash
      run: |
        for dir in "$HOME/.claude/teams" "$HOME/.claude/tasks"; do
          if [ -d "$dir" ]; then
            find "$dir" -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} + 2>/dev/null || true
          fi
        done

    - name: Cache npm dependencies
      if: inputs.use-cache == 'true'
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306  # v5
      with:
        path: |
          ~/.npm
          node_modules
          src/hooks/node_modules
          plugins/ork-core/hooks/node_modules
        key: ${{ runner.os }}-node-${{ inputs.node-version || hashFiles('.nvmrc') }}-${{ hashFiles('**/package-lock.json', 'src/hooks/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-${{ inputs.node-version || hashFiles('.nvmrc') }}-
          ${{ runner.os }}-node-

    - name: Cache vitest
      if: inputs.use-cache == 'true' && inputs.install-hooks-deps == 'true'
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306  # v5
      with:
        path: |
          src/hooks/node_modules/.vitest
        key: ${{ runner.os }}-vitest-${{ inputs.node-version || hashFiles('.nvmrc') }}-${{ hashFiles('src/hooks/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-vitest-${{ inputs.node-version || hashFiles('.nvmrc') }}-
          ${{ runner.os }}-vitest-

    # Install hook deps BEFORE building: build-plugins.sh [1.5/10] only rebuilds
    # src/hooks/dist when src/hooks/node_modules exists, else it ships whatever
    # stale dist is committed. Running this after the build (the previous order)
    # meant CI always skipped the rebuild → plugins/ork/hooks/dist diverged →
    # test-run-hook-dispatcher.sh failed on every PR. See #2003.
    - name: Install hook dependencies
      if: inputs.install-hooks-deps == 'true'
      shell: bash
      working-directory: src/hooks
      run: npm ci

    - name: Build plugins
      if: inputs.build-plugins == 'true'
      shell: bash
      run: bash scripts/build-plugins.sh

    - name: Setup CI environment
      if: inputs.run-ci-setup == 'true'
      shell: bash
      run: ./bin/ci-setup.sh "${{ inputs.ci-setup-flags }}"

    - name: Make test scripts executable
      if: runner.os != 'Windows'
      shell: bash
      run: |
        chmod +x tests/**/*.sh 2>/dev/null || true
        find src/hooks -name "*.sh" -exec chmod +x {} \; 2>/dev/null || true
        chmod +x bin/*.sh 2>/dev/null || true
        chmod +x scripts/ci/*.sh 2>/dev/null || true

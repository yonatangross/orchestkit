# GitHub secret scanning: files whose secret-shaped strings are test inputs.
#
# The fake credentials under src/hooks/src/__tests__/fixtures/ are reviewed
# test inputs that must keep a real scanner shape (Atlas URIs, AWS temporary
# key ids). paths-ignore names only the dedicated fixture files that hold
# them; an ordinary test file is never exempt, so a real credential pasted
# into one raises a visible alert instead of closing as ignored. Alerts 6,
# 8, 9 and 10 (2026-09-23 and 2026-09-28) were these fixtures.
#
# tests/unit/test-secret-scanning-paths.sh pins this list to the approved
# fixture files; add an entry there and here in the same commit.
#
# This file covers committed files only. PR and issue comments are still
# scanned: quote probe inputs with placeholders (see CONTRIBUTING.md).
paths-ignore:
  - "src/hooks/src/__tests__/fixtures/positive-seeds.ts"
  - "src/hooks/src/__tests__/fixtures/secret-scanning-fixtures.ts"

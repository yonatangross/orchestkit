# GitHub secret scanning: paths whose secret-shaped strings are test inputs.
#
# The hook tests under src/hooks/src/__tests__/ feed realistic but fake
# credentials (Atlas URIs, AWS temporary key ids) into the redaction and
# secret-stash code and assert that they come out masked. The values must keep
# a real shape, or the tests stop proving anything, so they are exempted here
# instead of being replaced. Alerts 6, 8, 9 and 10 (2026-09-23 and 2026-09-28)
# were these fixtures.
#
# This file covers committed files only. PR and issue comments are still
# scanned: quote probe inputs with placeholders (see CONTRIBUTING.md).
paths-ignore:
  - "src/hooks/src/__tests__/**"
